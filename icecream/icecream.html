<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🍦 픽셀 아이스크림 가게 31</title>
<style>
@font-face{font-family:"DungGeunMo";src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff") format("woff");font-display:swap;}
:root{--s:3;--ink:#3a2030;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#1a1526;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;
 font-family:"DungGeunMo","Galmuri11","NeoDunggeunmo","Pretendard","Apple SD Gothic Neo","Malgun Gothic",monospace,sans-serif;}
body{background-image:linear-gradient(#1a1526 0,#1a1526 2px,transparent 2px),linear-gradient(90deg,#1a1526 0,#1a1526 2px,transparent 2px);background-size:24px 24px;background-color:#231b33;}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(320px*var(--s));height:calc(180px*var(--s));box-shadow:0 0 0 4px #000,0 0 40px rgba(0,0,0,.6);}
canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;cursor:pointer;}
.ui{position:fixed;inset:0;pointer-events:none;font-size:clamp(11px,calc(var(--s)*5.5px),24px);}
.ui > *{pointer-events:auto;}
.hidden{display:none!important;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:1em;gap:.6em;pointer-events:none;}
.screen > *{pointer-events:auto;}
.btn{font:inherit;background:#ffd6e7;color:var(--ink);border:.3em solid var(--ink);padding:.45em .9em;box-shadow:.3em .3em 0 var(--ink);cursor:pointer;line-height:1.2;}
.btn:active{transform:translate(.2em,.2em);box-shadow:.1em .1em 0 var(--ink);}
.btn.primary{background:#ff6f9f;color:#fff;}
.btn.ghost{background:#fff;}
.btn.small{font-size:.8em;padding:.3em .6em;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.row{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center;align-items:center;}
#hud{position:absolute;top:.5em;left:.5em;right:.5em;display:flex;gap:.8em;align-items:center;background:rgba(40,20,40,.88);border:.25em solid #fff;padding:.35em .7em;font-size:.9em;flex-wrap:wrap;}
#hud b{color:#ffe08a;}
#hudMission{margin-left:auto;font-size:.85em;color:#a8f0d0;max-width:60%;}
#hudMission.done{color:#ffe08a;}
.panel{background:#fff6fa;color:var(--ink);border:.35em solid var(--ink);box-shadow:.5em .5em 0 rgba(0,0,0,.55);padding:.8em;}
#title{justify-content:center;background:rgba(0,0,0,.15);}
#title h1{font-size:2.2em;text-shadow:.12em .12em 0 var(--ink),0 0 .6em rgba(255,120,170,.6);color:#fff;text-align:center;line-height:1.15;}
#title h1 small{display:block;font-size:.45em;color:#ffd6e7;margin-top:.3em;}
#title p{font-size:.8em;color:#fff;background:rgba(40,20,40,.7);padding:.4em .8em;border:.2em solid #fff;text-align:center;line-height:1.5;}
#kiosk{justify-content:center;}
#kioskPanel{width:min(94vw,760px);height:min(92vh,560px);display:flex;flex-direction:column;overflow:hidden;gap:.5em;}
#kHead{display:flex;align-items:center;gap:.5em;border-bottom:.25em dashed var(--ink);padding-bottom:.4em;flex-wrap:wrap;}
#kHead h2{font-size:1.1em;flex:1;}
.tab{font:inherit;border:.25em solid var(--ink);background:#fff;padding:.3em .7em;cursor:pointer;font-size:.85em;}
.tab.on{background:var(--ink);color:#fff;}
#kBody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.5em;}
#kFoot{display:flex;gap:.5em;justify-content:space-between;align-items:center;border-top:.25em dashed var(--ink);padding-top:.5em;flex-wrap:wrap;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:.6em;}
.card{border:.25em solid var(--ink);background:#fff;padding:.6em;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:.3em;align-items:center;box-shadow:.25em .25em 0 var(--ink);}
.card:hover{background:#ffeef5;}
.card.sel{background:#ffd6e7;outline:.25em solid #ff4f8b;}
.card .big{font-size:1.8em;line-height:1;}
.card .price{color:#c2185b;font-size:.85em;}
.card .desc{font-size:.7em;color:#7a5a6a;line-height:1.3;}
.card:disabled,.card.off{opacity:.45;cursor:not-allowed;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2em,1fr));gap:.4em;}
.fl{border:.2em solid var(--ink);background:#fff;padding:.3em .15em;font-size:.62em;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.25em;line-height:1.15;word-break:keep-all;position:relative;}
.fl .sw{width:2.6em;height:2.6em;border-radius:50%;border:.2em solid var(--ink);position:relative;overflow:hidden;}
.fl .sw i{position:absolute;width:.5em;height:.5em;border-radius:50%;}
.fl.sel{outline:.3em solid #ff4f8b;background:#ffe3ee;}
.fl.new::after{content:"NEW";position:absolute;top:-.3em;right:-.2em;background:#ff4f8b;color:#fff;font-size:.7em;padding:0 .25em;}
.fl.monthly{background:#fff5d6;border-color:#c2185b;}
.fl.monthly .name{color:#c2185b;}
.chips{display:flex;gap:.4em;flex-wrap:wrap;align-items:center;min-height:2em;}
.chip{display:flex;align-items:center;gap:.3em;border:.2em solid var(--ink);background:#fff;padding:.15em .5em;font-size:.75em;cursor:pointer;}
.chip .sw{width:1.1em;height:1.1em;border-radius:50%;border:.15em solid var(--ink);display:inline-block;}
.chip.empty{opacity:.5;border-style:dashed;}
.sum{font-size:.9em;line-height:1.7;}
.sum .total{font-size:1.3em;color:#c2185b;}
.warn{color:#d32f2f;font-size:.8em;}
#counterUI,#eatUI{position:absolute;inset:0;pointer-events:none;}
#counterUI > *,#eatUI > *{pointer-events:auto;}
#btnSkip{position:absolute;right:1em;bottom:1em;}
#eatTop{position:absolute;top:.6em;left:.6em;right:.6em;display:flex;gap:.6em;align-items:center;flex-wrap:wrap;}
#eatHint{background:rgba(40,20,40,.85);border:.2em solid #fff;padding:.3em .7em;font-size:.85em;}
#meltBar{flex:1;min-width:6em;height:1em;border:.2em solid #fff;background:#3a2030;position:relative;}
#meltFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7ee0a0,#ffe08a,#ff6f6f);width:0%;}
#meltLabel{font-size:.8em;}
#eatBottom{position:absolute;bottom:.8em;left:0;right:0;display:flex;justify-content:center;gap:.6em;}
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);}
#modalBox{width:min(92vw,620px);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:.6em;}
#modalBox h2{font-size:1.2em;text-align:center;border-bottom:.25em dashed var(--ink);padding-bottom:.3em;}
.stat{display:grid;grid-template-columns:1fr auto;gap:.2em .8em;font-size:.9em;line-height:1.6;}
.stat b{color:#c2185b;}
.satBig{font-size:2.6em;text-align:center;color:#ff4f8b;text-shadow:.08em .08em 0 var(--ink);line-height:1.1;}
.stars{text-align:center;font-size:1.4em;color:#ffb300;letter-spacing:.1em;}
.mission{border:.25em solid var(--ink);padding:.5em;background:#fff;font-size:.9em;}
.mission.ok{background:#e0ffe8;}
.mission.fail{background:#ffe6e6;}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5em,1fr));gap:.4em;}
.book .fl{cursor:default;}
.book .fl.lock{opacity:.35;filter:grayscale(1);}
#toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:var(--ink);color:#fff;border:.25em solid #fff;padding:.5em 1em;font-size:.95em;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;white-space:pre-line;}
#toast.show{opacity:1;}
#sndBtn{position:absolute;right:.5em;bottom:.5em;font-size:.8em;}
.tiny{font-size:.7em;color:#7a5a6a;text-align:center;line-height:1.4;}
/* 리뷰 */
.rvStars{display:flex;justify-content:center;gap:.2em;font-size:1.8em;cursor:pointer;user-select:none;}
.rvStars span{color:#cfc0c8;transition:transform .08s;}
.rvStars span.on{color:#ffb300;text-shadow:.08em .08em 0 var(--ink);}
.rvStars span:hover{transform:scale(1.15);}
.rvChips{display:flex;flex-wrap:wrap;gap:.3em;justify-content:center;}
.rvChips button{font:inherit;font-size:.75em;background:#fff;border:.2em solid var(--ink);padding:.25em .5em;cursor:pointer;box-shadow:.15em .15em 0 var(--ink);}
.rvChips button:active{transform:translate(.1em,.1em);box-shadow:none;}
.rvText{font:inherit;font-size:.9em;width:100%;box-sizing:border-box;min-height:4.5em;border:.25em solid var(--ink);padding:.4em;background:#fffaf0;resize:vertical;color:var(--ink);}
.rvCount{font-size:.7em;text-align:right;color:#7a5a6a;}
.rvList{display:flex;flex-direction:column;gap:.5em;max-height:52vh;overflow:auto;}
.rvItem{border:.25em solid var(--ink);background:#fff;padding:.5em .6em;font-size:.85em;line-height:1.5;box-shadow:.2em .2em 0 var(--ink);}
.rvItem .rvHead{display:flex;justify-content:space-between;gap:.5em;flex-wrap:wrap;}
.rvItem .rvStar{color:#ffb300;text-shadow:.06em .06em 0 var(--ink);}
.rvItem .rvMenu{font-size:.8em;color:#7a5a6a;}
.rvItem .rvBody{margin-top:.2em;word-break:break-all;}
.rvEmpty{text-align:center;color:#7a5a6a;padding:1em;font-size:.9em;}
@media (max-aspect-ratio:1/1){
 #wrap{top:36%;}
 .ui{font-size:clamp(12px,3.6vw,18px);}
 #hud{font-size:.8em;}
}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div class="ui">
 <div id="hud" class="hidden"><span>💰 <b id="hudMoney">0</b>원</span><span>📅 <b id="hudDate"></b></span><span id="hudMission"></span></div>

 <div id="title" class="screen">
  <h1>🍦 픽셀 아이스크림 가게<small>THIRTY-ONE FLAVORS · 용돈 미션</small></h1>
  <div class="row"><button class="btn primary" id="btnStart">▶ 시작하기</button><button class="btn ghost" id="btnReset">데이터 초기화</button></div>
  <p>키오스크에서 주문 → 직원이 스쿱으로 떠주면<br>녹기 전에 클릭(터치)해서 냠냠!<br>매일 용돈으로 미션을 클리어하세요.</p>
 </div>

 <div id="lobby" class="screen hidden">
  <div class="row">
   <button class="btn primary" id="btnKiosk">🧾 키오스크 주문</button>
   <button class="btn" id="btnBook">📖 도감</button>
   <button class="btn" id="btnStats">📊 통계</button>
   <button class="btn" id="btnReviews">📝 리뷰</button>
   <button class="btn ghost" id="btnNext">🌙 다음 날로</button>
  </div>
 </div>

 <div id="kiosk" class="screen hidden">
  <div id="kioskPanel" class="panel">
   <div id="kHead"><h2>🧾 키오스크</h2><button class="tab on" data-tab="ice">🍦 아이스크림</button><button class="tab" data-tab="cake">🎂 케이크</button><button class="btn small ghost" id="btnKioskClose">✕ 닫기</button></div>
   <div id="kBody"></div>
   <div id="kFoot"></div>
  </div>
 </div>

 <div id="counterUI" class="hidden"><button class="btn small" id="btnSkip">건너뛰기 ▶▶</button></div>

 <div id="eatUI" class="hidden">
  <div id="eatTop"><div id="eatHint">👆 아이스크림을 클릭해서 먹기!</div><div id="meltBar"><div id="meltFill"></div></div><span id="meltLabel">🧊 신선</span></div>
  <div id="eatBottom"><button class="btn small ghost" id="btnStopEat">그만 먹기</button></div>
 </div>

 <div id="modal" class="hidden"><div id="modalBox" class="panel"></div></div>
 <div id="toast"></div>
 <button class="btn small ghost" id="sndBtn">🔊 소리</button>
</div>
<script>
'use strict';
// ===================== 데이터 =====================
// [id, 이름, 기본색, 그림자색, 하이라이트색, 토핑점 색상들]
const FLAVOR_ROWS=[
 ['mom','엄마는외계인','#6b3e26','#472616','#8f5f40',['#f3e2c2','#2a1a10']],
 ['almond','아몬드봉봉','#5a3826','#3c2416','#7a5238',['#dfb888']],
 ['star','슈팅스타','#f4a7cc','#d67ba8','#ffd6ea',['#6ec3f0','#ffe066']],
 ['mint','민트초콜릿칩','#9fe3d0','#6cc7b0','#d6fff2',['#3a2418']],
 ['cherry','체리쥬빌레','#f7cfdb','#e0a0b8','#fff0f5',['#c8203a']],
 ['berry','베리베리스트로베리','#f28aa8','#d9678a','#ffc2d4',['#b3123a']],
 ['nycheese','뉴욕치즈케이크','#f5e6b8','#dcc98f','#fff8dc',['#b07a3a']],

 ['cotton','이상한나라의솜사탕','#cfe6ff','#a3c8f2','#eaf5ff',['#ffb3d9','#ffb3d9','#fff']],
 ['forest','초코나무숲','#4a3020','#2f1e12','#6a4a34',['#f3e9d3']],
 ['cookie','쿠키앤크림','#f4f0e8','#d8d2c6','#ffffff',['#2a2222']],
 ['pista','피스타치오아몬드','#b9d98a','#8fb865','#dbf0b8',['#8b6a3e']],
 ['greentea','그린티','#8fbf6a','#6f9d50','#b6dc96',[]],
 ['oreo','오레오쿠키앤크림','#e8e6e2','#c8c4bc','#ffffff',['#1a1a1a','#1a1a1a']],
 ['rainbow','레인보우샤베트','#ffb347','#e6892a','#ffd18a',['#7ac943','#ff6ec7','#6ec3f0']],

 ['lovestraw','사랑에빠진딸기','#ff8fa8','#e06585','#ffc2d0',['#ffffff','#c2183a']],
 ['mousse','초콜릿무스','#5c3a2e','#3e261f','#7a5446',[]],
 ['vanilla','바닐라','#fff3d6','#eadbb0','#fffbee',[]],
 ['choco','초콜릿','#6b4a35','#4a3020','#8a6650',[]],
 ['applemint','애플민트','#b8f0c0','#86d29a','#e0ffe6',['#ff6b6b']],
 ['goldmedal','골드메달리본','#f5e9c0','#dccb92','#fff7dc',['#c27a2a','#c27a2a']],
 ['homealone','나홀로집에','#fbe8e0','#e9c6b8','#fff8f4',['#d24040','#ffffff']],
 ['choux','슈크림','#f9e4a8','#dcc07a','#fff4cc',['#b57c2a']],
 ['mango','망고탱고','#ffc040','#e39a20','#ffe08a',['#ff8a3c']],
 ['yogurt','요거트','#f8f8f8','#d8d8e0','#ffffff',['#ff7aa8']],
 ['latte','아이스카페라떼','#c9a27e','#a37d5a','#e0c4a4',['#5a3a20']],
 ['brownie','초코퍼지브라우니','#4e2f22','#331d14','#6a4434',['#8b5a3c','#f3e2c2']],
 ['dark','다크초콜릿','#3a2218','#22120c','#563428',[]],
 ['strawcheese','딸기치즈케이크','#f5b8c8','#d98da4','#ffdbe5',['#d9a86a','#c2183a']],
 ['raspberry','라즈베리소르베','#d63a6a','#a8244c','#f06a92',['#ffb3c6']],
];
// 이달의 맛(한정) 풀
const MONTHLY_ROWS=[
 ['banana','우주에서온바나나','#f7e37a','#d8c04c','#fff3b0',['#4a3a90','#fff']],
 ['pinkstar','핑크스타','#ff9ed0','#e070a8','#ffd0ea',['#ffffff','#ffe066']],
 ['caramelpop','카라멜팝콘','#e6b05a','#c48a30','#f7d48a',['#f9f3d0','#7a4a10']],
 ['bluyo','블루베리요거트','#9f9fe0','#7a7ac0','#c8c8f5',['#4a3a90','#fff']],
 ['melon','메론팡팡','#bfe8a0','#8fc670','#e0ffc8',['#ff8fa8']],
 ['watermelon','수박수박','#ff6f7f','#d64c5c','#ff9fac',['#222222']],
 ['sweetpotato','고구마라떼','#c9a0d8','#a077b0','#e6c8f0',['#7a4a90']],
 ['bluemoon','블루문','#7fc8ff','#4f9ad8','#b8e2ff',['#ffffff','#ffe066']],
];
const FLAVORS=FLAVOR_ROWS.map(r=>({id:r[0],name:r[1],c:[r[2],r[3],r[4]],dots:r[5]}));
const MONTHLY=MONTHLY_ROWS.map(r=>({id:r[0],name:r[1],c:[r[2],r[3],r[4]],dots:r[5],monthly:true}));
const FL_BY_ID={};FLAVORS.concat(MONTHLY).forEach(f=>FL_BY_ID[f.id]=f);

const SIZES=[{n:1,name:'싱글',price:3200},{n:2,name:'더블',price:6200},{n:3,name:'트리플',price:8700}];

const CAKES=[
 {id:'heart',name:'미니 하트 케이크',price:15000,bites:6,shape:'heart',layers:['#ff8fa8','#ffd6e2'],deco:'#ffffff',flavors:['lovestraw','vanilla'],desc:'딸기+바닐라. 작고 귀여운 하트'},
 {id:'rainbow',name:'레인보우 케이크',price:22000,bites:8,shape:'round',layers:['#c77dff','#6ec3f0','#7ac943','#ffd166','#ff6f7f'],deco:'#ffffff',flavors:['rainbow','cotton','vanilla'],desc:'5색 레이어! 파티의 주인공'},
 {id:'chocoparty',name:'초코 파티 케이크',price:25000,bites:8,shape:'round',layers:['#4a3020','#6b4a35','#4a3020'],deco:'#f3e2c2',candles:true,flavors:['choco','mom','forest'],desc:'초콜릿 3층 + 촛불 장식'},
 {id:'strawdome',name:'스트로베리 돔',price:18000,bites:7,shape:'dome',layers:['#f28aa8','#ffc2d4'],deco:'#c8203a',flavors:['berry','strawcheese'],desc:'딸기 폭탄 돔 모양'},
 {id:'mintroll',name:'민트초코 롤',price:16000,bites:6,shape:'roll',layers:['#9fe3d0','#3a2418'],deco:'#3a2418',flavors:['mint','choco'],desc:'돌돌 말린 민트초코'},
 {id:'cookiebox',name:'쿠키앤크림 박스',price:20000,bites:7,shape:'box',layers:['#f4f0e8','#2a2222','#f4f0e8'],deco:'#2a2222',flavors:['oreo','cookie'],desc:'네모난 쿠키 크림 박스'},
 {id:'chara',name:'캐릭터 케이크',price:35000,bites:10,shape:'chara',layers:['#ffd6a0','#ffd6a0'],deco:'#3a2030',flavors:['vanilla','mango','lovestraw'],desc:'귀여운 얼굴 케이크. 최고급!'},
];
const CAKE_BY_ID={};CAKES.forEach(c=>CAKE_BY_ID[c.id]=c);

const DAYS_PER_MONTH=10;   // 게임 내 한 달 = 10일
const ALLOWANCE_BASE=7000; // 일일 용돈
const MISSION_BONUS=3000;
const REVIEW_BONUS=300;    // 리뷰 작성 보너스 용돈

const W=320,H=180;
const cv=document.getElementById('cv');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
function fitScale(){
 const s=Math.max(1,Math.floor(Math.min(innerWidth/W,(innerHeight*(innerWidth<innerHeight?0.62:1))/H)*4)/4);
 document.documentElement.style.setProperty('--s',s);
}
addEventListener('resize',fitScale);fitScale();

const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
const P=(x,y,c)=>R(x,y,1,1,c);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function seedRand(seed){let s=(seed*9301+49297)>>>0||1;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function shadeHex(h,amt){const[r,g,b]=hexToRgb(h);const f=v=>clamp(Math.round(v+amt),0,255);return`rgb(${f(r)},${f(g)},${f(b)})`;}
function ellipse(cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++){const hw=Math.floor(rx*Math.sqrt(Math.max(0,1-(y/ry)*(y/ry))));R(cx-hw,cy+y,hw*2+1,1,c);}}
function text(str,x,y,c,size=8,align='left'){ctx.font=`${size}px "DungGeunMo",monospace`;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillStyle=c;ctx.fillText(str,Math.round(x),Math.round(y));}

// ===================== 스쿱 =====================
// o: {melt, eaten, seed}
function drawScoop(cx,cy,r,fl,o={}){
 const melt=o.melt||0,eaten=o.eaten||0;
 const rx=r*(1+0.5*melt), ry=Math.max(1,r*(1-0.7*melt));
 const top=-ry+eaten*2*ry;
 cx=Math.round(cx);cy=Math.round(cy);
 for(let y=Math.ceil(-ry);y<=ry;y++){
  if(y<top)continue;
  const hw=Math.floor(rx*Math.sqrt(Math.max(0,1-(y/ry)*(y/ry))));
  R(cx-hw,cy+y,hw*2+1,1,fl.c[0]);
  if(y>ry*0.3){const sw=Math.floor(hw*0.55+(y/ry)*hw*0.45);R(cx+hw-sw,cy+y,sw+1,1,fl.c[1]);}
  else if(y>-ry*0.2){const s0=Math.floor(hw*0.7);R(cx+s0,cy+y,hw-s0+1,1,fl.c[1]);}
 }
 if(top<-ry*0.45&&r>=4){R(cx-Math.floor(rx*0.55),cy-Math.floor(ry*0.62),Math.max(1,Math.floor(rx*0.3)),Math.max(1,Math.floor(ry*0.14)),fl.c[2]);}
 if(fl.dots&&fl.dots.length){
  const rnd=seedRand(o.seed||7);const n=Math.floor(r*r/5);const sz=r>=10?2:1;
  for(let i=0;i<n;i++){
   const a=rnd()*Math.PI*2,d=Math.sqrt(rnd())*0.82;
   const dx=Math.cos(a)*d*rx,dy=Math.sin(a)*d*ry;
   if(dy<top+1)continue;
   R(cx+dx,cy+dy,sz,sz,fl.dots[i%fl.dots.length]);
  }
 }
 if(eaten>0&&eaten<1){ // 한 입 먹은 자국 (들쭉날쭉)
  const y=cy+Math.round(top);const hw=Math.floor(rx*Math.sqrt(Math.max(0,1-(top/ry)*(top/ry))));
  const rnd=seedRand((o.seed||7)*31+Math.floor(eaten*97));
  for(let x=-hw;x<=hw;x+=2){if(rnd()<0.55)R(cx+x,y-1,2,1,fl.c[0]);else if(rnd()<0.3)R(cx+x,y,2,1,fl.c[1]);}
 }
 return{rx,ry};
}

// ===================== 콘 / 컵 =====================
// eaten: 0~1, 위에서부터 베어먹은 비율(콘 먹기)
function drawCone(cx,yTop,w,h,eaten=0){
 const hw=w/2;
 const startRow=Math.min(h,Math.round(eaten*h));
 for(let y=startRow;y<h;y++){
  const t=y/h;const rowHw=Math.max(0,Math.round(hw*(1-t)));
  const bitten=eaten>0&&y<startRow+2; // 베어먹은 단면: 울퉁불퉁
  for(let x=-rowHw;x<=rowHw;x++){
   const wx=x+cx,wy=y+yTop;
   if(bitten&&((wx*7+y*3)%4===0))continue;
   const waffle=((wx+wy)%5===0)||((wx-wy)%5===0);
   P(wx,wy,waffle?'#b0722e':(x>rowHw*0.5?'#c98a3e':'#e0a850'));
  }
  if(bitten&&y===startRow)for(let x=-rowHw;x<=rowHw;x+=2)P(x+cx,y+yTop,'#f3d9a0'); // 속살(연한 색)
 }
 if(eaten<=0){R(cx-hw-1,yTop-1,w+3,2,'#d9964a');R(cx-hw-1,yTop+1,w+3,1,'#a86a28');}
}
function drawCup(cx,yTop,w,h,fillLv,fillColor){
 const hw=w/2;
 for(let y=0;y<h;y++){
  const t=y/h;const rowHw=Math.round(hw*(1-0.22*t));
  R(cx-rowHw,yTop+y,rowHw*2+1,1,(y>h*0.3&&y<h*0.55)?'#ff6f9f':'#ffe3ee');
  P(cx+rowHw,yTop+y,'#d98aa8');
 }
 R(cx-hw-1,yTop,w+3,2,'#ffffff');R(cx-hw-1,yTop+2,w+3,1,'#d98aa8');
 if(w>20){R(cx-3,yTop+Math.round(h*0.36),7,2,'#fff');R(cx-2,yTop+Math.round(h*0.36)+2,5,1,'#fff');}
 if(fillLv>0){ // 컵 안에 고인 녹은 아이스크림
  const lvH=Math.max(1,Math.round(fillLv*6));
  R(cx-hw+2,yTop-lvH+1,w-3,lvH,fillColor||'#f7cfdb');R(cx-hw+3,yTop-lvH+1,w-5,1,shadeHex(fillColor||'#f7cfdb',35));
  if(fillLv>0.5){R(cx+hw-4,yTop+3,3,Math.round((fillLv-0.5)*10),fillColor||'#f7cfdb');} // 컵 밖으로 넘침
 }
}

// item: {vessel:'cone'|'cup', scoops:[{fid,melt,eaten,gone,seed}], cupFill, fillColor}
// 반환: 스쿱 위치 정보 배열 (히트테스트용)
function drawIceCream(item,cx,baseY,r){
 const isCone=item.vessel==='cone';
 const vw=isCone?Math.round(r*2.1):Math.round(r*2.6), vh=isCone?Math.round(r*2.6):Math.round(r*1.7);
 const vTop=baseY-vh;
 const pos=[];
 let cy=vTop+r*0.15;let prevRy=null;
 const alive=item.scoops.filter(s=>!s.gone);
 alive.forEach((s,i)=>{
  const fl=FL_BY_ID[s.fid];
  const ry=Math.max(1,r*(1-0.7*(s.melt||0)));
  if(prevRy!=null)cy=cy-prevRy*0.72-ry*0.72;
  if(i===0)cy+=Math.round((s.melt||0)*r*(isCone?0.2:0.5)); // 녹으면서 아래로 가라앉음 // 컵: 녹으면서 안으로 가라앉음
  const g=drawScoop(cx,cy,r,fl,{melt:s.melt,eaten:s.eaten,seed:s.seed||(i+3)});
  pos.push({s,x:cx,y:cy,rx:g.rx,ry:g.ry,top:cy-ry+(s.eaten||0)*2*ry});
  prevRy=ry;
 });
 if(isCone)drawCone(cx,vTop,vw,vh,item.coneEaten||0);else drawCup(cx,vTop,vw,vh,item.cupFill||0,item.fillColor);
 item._geom={vTop,vw,vh,cx,baseY};
 return pos;
}

// ===================== 케이크 =====================
function drawCake(cake,cx,baseY,w,h,eaten=0,melt=0,withPlate=true){
 const hh=Math.round(h*(1-0.35*melt));
 const ww=Math.round(w*(1+0.15*melt));
 const left=cx-Math.round(ww/2);
 const visW=Math.max(0,Math.round(ww*(1-eaten)));
 if(withPlate){ellipse(cx,baseY,Math.round(ww/2)+6,3,'#ffffff');ellipse(cx,baseY+1,Math.round(ww/2)+6,3,'#cfd8e6');}
 if(visW<=0)return{left,visW,top:baseY-hh};
 const layers=cake.layers;const lh=Math.max(1,Math.floor(hh/layers.length));
 const top=baseY-lh*layers.length;
 const rnd=seedRand(cake.id.length*77);
 if(cake.shape==='dome'){
  const rx=Math.round(ww/2),ry=hh;
  for(let y=-ry;y<=0;y++){
   const hw=Math.floor(rx*Math.sqrt(Math.max(0,1-(y/ry)*(y/ry))));
   const x0=cx-hw,x1=Math.min(cx+hw,left+visW);if(x1<x0)continue;
   const c=y<-ry*0.5?layers[1]:layers[0];R(x0,baseY+y,x1-x0+1,1,c);
   if(x1===left+visW&&eaten>0&&eaten<1)P(x1,baseY+y,'#ffe6ee');
  }
  for(let i=0;i<14;i++){const a=rnd()*Math.PI,d=rnd()*0.9;const x=cx+Math.cos(a)*d*rx,y=baseY-Math.abs(Math.sin(a))*d*ry;if(x<left+visW-1)R(x,y,2,2,cake.deco);}
  return{left,visW,top:baseY-hh};
 }
 if(cake.shape==='roll'){
  const r=Math.round(hh/2);const cy=baseY-r;
  for(let x=left;x<left+visW;x++)R(x,cy-r,1,r*2,layers[0]);
  for(let y=-r+2;y<r-1;y+=3)R(left,cy+y,visW,1,(y%2===0)?layers[1]:layers[0]);
  if(eaten>0&&eaten<1){ // 단면(나선)
   const ex=left+visW-1;for(let y=-r;y<=r;y++){const hw=Math.sqrt(Math.max(0,r*r-y*y));if(hw>1)R(ex-1,cy+y,2,1,layers[0]);}
   for(let k=1;k<r;k+=2)ellipse(ex,cy,Math.max(1,Math.round(k*0.6)),k,k%4===1?layers[1]:layers[0]);
  } else {const ex=left+visW-1;for(let k=r-1;k>0;k-=2)ellipse(ex,cy,Math.max(1,Math.round(k*0.5)),k,k%4===1?layers[1]:layers[0]);}
  return{left,visW,top:cy-r};
 }
 // round / box / heart / chara: 층 케이크
 for(let i=0;i<layers.length;i++){
  const y=baseY-lh*(i+1);
  const inset=(cake.shape==='box')?0:Math.round(i*0.5);
  R(left+inset,y,Math.max(0,visW-inset),lh,layers[i]);
  R(left+inset,y+lh-1,Math.max(0,visW-inset),1,shadeHex(layers[i],-40));
 }
 if(eaten>0&&eaten<1){ // 베어문 단면: 들왜됛들한 자국 + 안식 밝은 색 + 부스러기
  const ex=left+visW-1;
  for(let y=top;y<baseY;y++){const li=clamp(((baseY-1-y)/lh)|0,0,layers.length-1);const bite=Math.round(Math.abs(Math.sin((y-top)*0.9))*3)+1;R(ex-bite+1,y,bite,1,shadeHex(layers[li],55));P(ex,y,'#fff6fa');}
  for(let k=0;k<5;k++){R(ex+1+rnd()*6,baseY-1-rnd()*3,2,1,shadeHex(layers[0],20));}
 }
 // 윗면 장식
 R(left,top-2,visW,2,shadeHex(layers[layers.length-1],40));
 if(cake.shape==='heart'){for(let x=left+3;x<left+visW-3;x+=6){R(x,top-4,2,1,cake.deco);R(x-1,top-3,4,1,cake.deco);R(x,top-2,2,1,'#ff4f8b');}}
 else if(cake.candles){for(let x=left+4;x<left+visW-3;x+=8){R(x,top-8,2,6,'#ffe066');R(x,top-10,2,2,'#ff8a3c');P(x,top-11,'#fff2a8');}}
 else if(cake.shape==='chara'){
  const eyeY=top+Math.round(hh*0.3);
  if(visW>8){R(left+Math.round(ww*0.28),eyeY,3,3,cake.deco);}
  if(visW>ww*0.72){R(left+Math.round(ww*0.66),eyeY,3,3,cake.deco);}
  if(visW>ww*0.6){R(left+Math.round(ww*0.4),eyeY+7,Math.round(ww*0.2),1,cake.deco);P(left+Math.round(ww*0.4)-1,eyeY+6,cake.deco);P(left+Math.round(ww*0.6),eyeY+6,cake.deco);}
  if(visW>4)R(left+3,eyeY+4,3,2,'#ff9aa8');if(visW>ww*0.85)R(left+ww-7,eyeY+4,3,2,'#ff9aa8');
  for(let x=left+2;x<left+visW-1;x+=5)R(x,top-3,2,2,'#ff6f9f');
 } else {for(let x=left+2;x<left+visW-1;x+=5)R(x,top-3,2,2,cake.deco);}
 return{left,visW,top:top-3};
}


// ===================== 직원 =====================
// st: {x, y(발), arm:'idle'|'dip'|'lift'|'hold'|'place'|'give'|'wave'|'carry', dip, hold(fid), walk, carryCake, target:{x,y}}
// part: 'all' | 'body' | 'arm'  (카운터 뒤 몸통은 먼저, 팔은 카운터 위에 덧그리기)
function drawStaff(st,time,part='all'){
 const bob=st.walk?Math.round(Math.abs(Math.sin(time*14)))*1:0;
 const x=Math.round(st.x),y=Math.round(st.y)-bob;
 const skin='#f7d2b5';
 if(part!=='arm'){
  // 다리
  const legOff=st.walk?Math.round(Math.sin(time*14)*2):0;
  R(x-5,y-8,4,8,'#3a3a5a');R(x+1,y-8,4,8,'#3a3a5a');
  if(st.walk){R(x-5+legOff,y-2,4,2,'#3a3a5a');R(x+1-legOff,y-2,4,2,'#3a3a5a');}
  // 몸통 (셔츠 + 앞치마)
  R(x-7,y-20,14,13,'#fff');R(x-5,y-18,10,11,'#ff6f9f');R(x-4,y-14,8,1,'#d94f7f');
  R(x+2,y-17,3,2,'#ffe066'); // 이름표
  // 머리
  R(x-5,y-28,10,8,skin);
  R(x-6,y-31,12,4,'#ff6f9f');R(x-7,y-28,14,1,'#d94f7f');R(x-3,y-32,6,1,'#ff6f9f'); // 모자
  P(x-3,y-25,'#222');P(x+2,y-25,'#222'); // 눈
  R(x-1,y-22,3,1,'#c0605a'); // 입
  if(st.arm==='dip'||st.arm==='lift'){R(x-3,y-25,1,1,'#222');R(x+2,y-25,1,1,'#222');R(x-4,y-26,3,1,'#f7d2b5');R(x+1,y-26,3,1,'#f7d2b5');} // 집중하는 눈
 }
 if(part==='body')return;
 const shoulderY=y-19;
 const arm=st.arm||'idle';
 const scooper=(hx,hy)=>{R(hx-1,hy,4,2,'#9aa6b8');R(hx-2,hy+2,6,3,'#c8d2e0');};
 const heldScoop=(sx,sy)=>{if(st.hold)drawScoop(sx,sy,5,FL_BY_ID[st.hold],{seed:5});};
 if(arm==='idle'){R(x-9,shoulderY,2,8,skin);R(x+7,shoulderY,2,8,skin);}
 else if(arm==='wave'){R(x-9,shoulderY,2,8,skin);const wy=Math.round(Math.sin(time*6)*2);R(x+7,shoulderY-6+wy,2,7,skin);R(x+7,shoulderY-8+wy,3,3,skin);}
 else if(arm==='dip'){
  // 팔을 앞으로 뻗어 카운터 너머 통에 스쿠퍼를 꽂음 (오른쪽 아래 대각선)
  const d=clamp(st.dip||0,0,1);
  R(x-9,shoulderY,2,8,skin);
  const hx=x+8+Math.round(d*10),hy=shoulderY+2+Math.round(d*12);
  // 상완→하완 (계단식)
  R(x+7,shoulderY,2,4,skin);
  const steps=Math.max(1,Math.round((hx-(x+7))/2));
  for(let i=0;i<=steps;i++){R(x+7+i*2,shoulderY+3+Math.round(i*(hy-shoulderY-3)/steps),2,3,skin);}
  scooper(hx+1,hy+2);
  if(d>0.6){ // 통 안 스쿱 뜨기 시작 (살짝 보임)
   if(st.hold){const fl=FL_BY_ID[st.hold];R(hx-2,hy+5,6,2,fl.c[0]);}
  }
 }
 else if(arm==='lift'){
  // dip 1→0 : 팔이 아래에서 위로 들려 올라오며 스쿱이 보임
  const d=clamp(st.dip||0,0,1);
  R(x-9,shoulderY,2,8,skin);
  const hx=x+8+Math.round(d*10),hy=Math.round(lerp(shoulderY-10,shoulderY+14,d));
  const steps=Math.max(1,Math.round(Math.abs(hx-(x+7))/2));
  for(let i=0;i<=steps;i++){R(x+7+i*2,shoulderY+Math.round(i*(hy-shoulderY)/steps),2,3,skin);}
  scooper(hx+1,hy);
  heldScoop(hx+2,hy-5);
 }
 else if(arm==='hold'||arm==='carry'){
  R(x-9,shoulderY,2,8,skin);
  R(x+7,shoulderY+2,6,2,skin);R(x+11,shoulderY-8,2,11,skin);
  if(arm==='hold'){scooper(x+12,shoulderY-10);heldScoop(x+13,shoulderY-15);}
  if(arm==='carry'&&st.carryCake){R(x-9,shoulderY+2,6,2,skin);R(x-11,shoulderY-8,2,11,skin);drawCake(st.carryCake,x+1,shoulderY-6,22,10,0,0,true);}
 }
 else if(arm==='place'){
  // 손이 어깨 위에서 목표(콘 위)까지 포물선으로 이동
  const t=clamp(st.place||0,0,1);
  R(x-9,shoulderY,2,8,skin);
  const tx=st.target?st.target.x-3:x+18,ty=st.target?st.target.y-4:shoulderY-14;
  const ax=Math.round(lerp(x+11,tx,t)),ay=Math.round(lerp(shoulderY-8,ty,t)-Math.sin(t*Math.PI)*6);
  const steps=Math.max(1,Math.round(Math.abs(ax-(x+7))/2));
  for(let i=0;i<=steps;i++){R(x+7+i*2,shoulderY+Math.round(i*(ay-shoulderY)/steps),2,3,skin);}
  scooper(ax+1,ay-2);
  if(st.hold&&t<0.92)heldScoop(ax+2,ay-7);
 }
 else if(arm==='give'){R(x-9,shoulderY+2,6,2,skin);R(x+7,shoulderY+2,6,2,skin);}
}

let _caseCache=null;
function caseFlavors(){ // 진열대에 올라온 10개 통(주문한 맛 우선)
 if(_caseCache)return _caseCache;
 // 하루 동안 고정된 배치 + 이달의 맛은 맨 오른쪽. 주문한 맛이 없으면 직원이 통을 바꿔 놓은 것으로(자리 교체)
 const rnd=seedRand(S.day*13+7);
 const set=[];const pool=FLAVORS.map(f=>f.id);
 while(set.length<TUB_N-1&&pool.length){const i=Math.floor(rnd()*pool.length);set.push(pool.splice(i,1)[0]);}
 const mf=monthlyFlavor();set.push(mf.id);
 if(G.order&&G.order.type==='ice'){let slot=0;G.order.flavors.forEach(f=>{if(!set.includes(f)){while(slot<TUB_N-1&&G.order.flavors.includes(set[slot]))slot++;set[slot]=f;slot++;}});}
 _caseCache=set;return set;
}

const AU={ctx:null,on:true,
 init(){if(!this.ctx){try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 tone(f,d=0.08,type='square',v=0.12,f2=null,delay=0){
  if(!this.on||!this.ctx)return;const t0=this.ctx.currentTime+delay;
  const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(f2)o.frequency.linearRampToValueAtTime(f2,t0+d);
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);
  o.connect(g);g.connect(this.ctx.destination);o.start(t0);o.stop(t0+d+0.02);
 },
 click(){this.tone(880,0.05);},
 scoop(){this.tone(180,0.14,'triangle',0.15,320);},
 place(){this.tone(520,0.06,'square',0.1,780);},

function genMission(){
 const rnd=Math.random;const mf=monthlyFlavor();
 const known=Object.keys(S.coll).length;
 const pool=[
  ()=>{const p=rnd()<0.5?3200:6200;return{id:'cheap',p,text:`${fmt(p)}원 이하로 만족도 80 이상`,deadline:S.day};},
  ()=>({id:'monthly',text:`이달의 맛 「${mf.name}」 먹어보기`,deadline:S.day}),
  ()=>({id:'triple',text:'트리플 주문해서 만족도 70 이상',deadline:S.day}),
  ()=>({id:'fresh',text:'녹기 전에 다 먹기 (만족도 90 이상)',deadline:S.day}),
  ()=>({id:'cup',text:'컵으로 더블 이상 먹기',deadline:S.day}),
  ()=>({id:'cone',text:'콘으로 주문해서 하나도 안 흘리기 (만족도 85 이상)',deadline:S.day}),
 ];
 if(known<FLAVORS.length-3)pool.push(()=>({id:'new',text:'처음 먹는 맛 2종 이상 한 번에 주문',deadline:S.day}));
 if(S.money<15000)pool.push(()=>({id:'cake',text:'3일 안에 저축해서 케이크 사기',deadline:S.day+2}));
 else pool.push(()=>({id:'cakeNow',text:'오늘 케이크 사서 만족도 80 이상',deadline:S.day}));
 const m=pool[Math.floor(rnd()*pool.length)]();m.done=false;return m;
}
function checkMission(res){
 const m=S.mission;if(!m||m.done||S.day>m.deadline)return false;
 const o=res.order;let ok=false;
 switch(m.id){
  case 'cheap':ok=o.price<=m.p&&res.sat>=80;break;
  case 'monthly':ok=o.type==='ice'&&o.flavors.includes(monthlyFlavor().id)&&res.eatenAny;break;
  case 'triple':ok=o.type==='ice'&&o.size===3&&res.sat>=70;break;
  case 'fresh':ok=res.sat>=90;break;
  case 'cup':ok=o.type==='ice'&&o.vessel==='cup'&&o.size>=2&&res.eatenAny;break;
  case 'cone':ok=o.type==='ice'&&o.vessel==='cone'&&res.sat>=85;break;
  case 'new':ok=res.newFlavors>=2;break;
  case 'cake':ok=o.type==='cake';break;
  case 'cakeNow':ok=o.type==='cake'&&res.sat>=80;break;
 }
 return ok;
}
function refreshMission(){
 const m=S.mission;
 if(!m||S.day>m.deadline||(m.done&&S.day>(m.doneDay||0)))S.mission=genMission();
}

function startCounter(){

 G.item=o.type==='ice'?{vessel:o.vessel,scoops:[],cupFill:0}:{cake:CAKE_BY_ID[o.cake],eaten:0,melt:0,inBox:0};
 const st={x:160,y:STAFF_Y,arm:'idle',walk:false,hold:null,dip:0,place:0};
 const tl=[];const add=(dur,fn,end)=>tl.push({dur,fn,end,started:false});
 if(o.type==='ice'){
  o.flavors.forEach((fid,i)=>{
   const tx=tubXOf(fid);
   add(0.55,(t,s)=>{st.x=lerp(s.from,tx-10,ease(t));st.arm='idle';st.walk=true;});
   add(0.35,t=>{st.arm='dip';st.dip=t;st.walk=false;if(t>0.6)st.hold=fid;},()=>AU.scoop());
   add(0.4,t=>{st.arm='lift';st.hold=fid;st.dip=1-t;});
   add(0.6,(t,s)=>{st.x=lerp(s.from,STAND_X-22,ease(t));st.arm='hold';st.walk=true;});
   add(0.35,t=>{st.arm='place';st.place=t;st.walk=false;st.target={x:STAND_X,y:standTopY(i)};},()=>{G.item.scoops.push({fid,melt:0,eaten:0,bites:0,seed:i*7+3});st.hold=null;AU.place();});
  });
  add(0.5,t=>{st.arm='give';st.walk=false;});
 } else {
  const FR_X=88;
  add(0.7,(t,s)=>{st.x=lerp(s.from,FR_X+66,ease(t));st.arm='idle';st.walk=true;});
  add(0.5,t=>{st.arm='idle';st.walk=false;G.counter.fridgeOpen=t;});
  add(0.5,t=>{st.arm='carry';st.carryCake=G.item.cake;},()=>AU.scoop());
  add(0.4,t=>{G.counter.fridgeOpen=1-t;});
  add(0.8,(t,s)=>{st.x=lerp(s.from,STAND_X-18,ease(t));st.walk=true;st.arm='carry';});
  add(0.6,t=>{st.walk=false;st.arm='give';st.carryCake=null;G.counter.boxT=t;},()=>AU.place());
  add(0.5,t=>{G.counter.boxLid=t;});

   }
  });
  const geom=G.item._geom;
  e.drips.forEach(d=>{
   d.vy+=dt*60;d.y+=d.vy*dt;d.x+=(d.vx||0)*dt;

 $('rvSubmit').onclick=()=>{
  const txt=ta.value.trim();
  if(!txt){toast('한마디만 적어주세요! ✍️',1200);ta.focus();return;}
  if(!S.reviews)S.reviews=[];
  S.reviews.push({day:rev.day,name:rev.name,stars,text:txt,sat:rev.sat,type:rev.type,flavors:rev.flavors,cake:rev.cake});
  if(S.reviews.length>100)S.reviews.shift();
  S.money+=REVIEW_BONUS;save();updateHUD();AU.coin();
  openModal(`<h2>📝 리뷰 등록 완료!</h2>
   <div class="rvItem"><div class="rvHead"><span class="rvStar">${starsTxt(stars)}</span><span class="rvMenu">Day ${rev.day}</span></div><div class="rvMenu">${rev.name}</div><div class="rvBody">${escapeHTML(txt)}</div></div>
   <div class="mission ok">리뷰 보너스 용돈 +${fmt(REVIEW_BONUS)}원 🪙 (누적 리뷰 ${S.reviews.length}개)</div>
   <div class="row"><button class="btn primary" id="btnResLobby">🏠 로비로</button><button class="btn" id="btnResNext">🌙 바로 다음 날</button></div>`);
  $('btnResLobby').onclick=()=>{closeModal();setScene('lobby');};
  $('btnResNext').onclick=()=>{closeModal();nextDay();};
 };
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openReviews(){
 const list=(S.reviews||[]).slice().reverse();
 const avg=list.length?(list.reduce((a,r)=>a+r.stars,0)/list.length):0;
 openModal(`<h2>📝 내 리뷰 ${list.length?`(${list.length})`:''}</h2>
  <div class="tiny">${list.length?`평균 별점 <b style="color:#c2185b">${avg.toFixed(1)}</b> · 리뷰를 쓰면 매번 +${REVIEW_BONUS}원!`:'아직 리뷰가 없어요. 아이스크림을 먹고 결과 화면에서 리뷰를 남겨보세요!'}</div>
  ${list.length?`<div class="rvList">${list.map(r=>`<div class="rvItem"><div class="rvHead"><span class="rvStar">${starsTxt(r.stars)}</span><span class="rvMenu">Day ${r.day} · 만족도 ${r.sat}</span></div><div class="rvMenu">${escapeHTML(r.name)}</div><div class="rvBody">${escapeHTML(r.text)}</div></div>`).join('')}</div>`:`<div class="rvEmpty">🍦 아직 텅 빈 게시판이에요</div>`}
  <div class="row"><button class="btn" id="btnClose">닫기</button></div>`);
 $('btnClose').onclick=closeModal;
}

// ===================== 하루 진행 =====================
function nextDay(){
 const prevMonth=monthOf(S.day);S.day++;_caseCache=null;
 const rnd=seedRand(S.day*7919);
 const allowance=ALLOWANCE_BASE+Math.floor(rnd()*4)*500;
 S.money+=allowance;
 let msg=`🌅 Day ${S.day} 아침!\n용돈 +${fmt(allowance)}원`;
 if(monthOf(S.day)!==prevMonth){ensureMonthly();msg+=`\n🗓 ${monthOf(S.day)}월! 이달의 맛: ${monthlyFlavor().name}`;}
 refreshMission();ensureMonthly();
 AU.coin();setScene('lobby');toast(msg,2600);save();
}
function drawLobbyScene(){
 drawShopWall();drawFloor();const st={x:160,y:STAFF_Y,arm:'wave'};drawStaff(st,G.time,'body');drawCase(null);drawStaff(st,G.time,'arm');
 // 이달의 맛 안내 (카운터 앞 바닥 입간판)
 const mf=monthlyFlavor();
 R(106,158,110,14,'#fff');R(108,160,106,10,'#ffe08a');text('이달의 맛: '+mf.name,124,161,'#3a2030',8);
 drawScoop(116,165,5,mf,{seed:9});
}
function drawTitleScene(){
 // 하늘 + 가게 외관
 R(0,0,W,120,'#8fd3ff');R(0,0,W,40,'#a8dcff');
 for(const[cx,cy]of[[40,20],[130,32],[250,18]]){ellipse(cx,cy,14,5,'#fff');ellipse(cx+8,cy-3,9,5,'#fff');}
 R(0,120,W,60,'#c4b0d8');for(let x=0;x<W;x+=16)R(x,120,8,60,'#b09ac8');
 R(40,50,240,70,'#ff9fbf');R(40,50,240,3,'#fff');
 // 어닝
 for(let x=36;x<284;x+=16){R(x,44,8,10,'#ff4f8b');R(x+8,44,8,10,'#fff');}R(36,54,248,2,'#c96a8a');
 // 창 & 문
 R(60,64,60,40,'#a8dcff');R(60,64,60,2,'#fff');R(200,64,60,40,'#a8dcff');R(200,64,60,2,'#fff');
 R(140,66,40,54,'#7a4a90');R(144,70,32,26,'#a8dcff');P(172,100,'#ffe066');
 // 커다란 아이스크림 간판
 drawScoop(160,22,12,FL_BY_ID.mint,{seed:1});drawScoop(160,8,10,FL_BY_ID.lovestraw,{seed:2});drawCone(160,28,22,20);
 // 걷는 직원
 drawStaff({x:296,y:172,arm:'wave'},G.time);
 // 바닥 아이스크림 카트
 R(20,130,40,20,'#fff');R(20,130,40,3,'#ff6f9f');drawScoop(30,126,5,FL_BY_ID.choco,{seed:3});drawScoop(50,126,5,FL_BY_ID.vanilla,{seed:4});
}

// ===================== 도감 / 통계 =====================
function openBook(){
 const all=FLAVORS.concat(MONTHLY.filter(m=>S.monthlyHist.includes(m.id)||S.coll[m.id]));
 const got=all.filter(f=>S.coll[f.id]).length;
 openModal(`<h2>📖 맛 도감 ${got}/${all.length}</h2><div class="tiny">먹어본 맛이 컬러로 표시돼요. ⭐는 이달의 맛(한정)</div>
  <div class="book">${all.map(f=>`<div class="fl ${S.coll[f.id]?'':'lock'} ${f.monthly?'monthly':''}">${swatchHTML(f)}<span class="name">${f.monthly?'⭐':''}${f.name}</span>${S.coll[f.id]?`<span class="tiny">Day ${S.coll[f.id]}</span>`:'<span class="tiny">???</span>'}</div>`).join('')}</div>
  <div class="row"><button class="btn" id="btnClose">닫기</button></div>`);
 $('btnClose').onclick=closeModal;
}
function openStats(){
 const st=S.stats;
 openModal(`<h2>📊 통계</h2><div class="stat">
  <span>진행 일수</span><b>Day ${S.day} (${monthOf(S.day)}월)</b>
  <span>현재 용돈</span><b>${fmt(S.money)}원</b>
  <span>총 주문</span><b>${st.orders}회 (케이크 ${st.cakes}회)</b>
  <span>총 지출</span><b>${fmt(st.spent)}원</b>
  <span>평균 만족도</span><b>${st.total?Math.round(st.satSum/st.total):0}</b>
  <span>최고 만족도</span><b>${st.best}</b>
  <span>녹여버린 스쿱</span><b>${st.melted}개</b>
  <span>미션 클리어</span><b>${S.missionsDone}회</b>
  <span>작성한 리뷰</span><b>${(S.reviews||[]).length}개</b>
  <span>도감</span><b>${Object.keys(S.coll).length}종</b></div>
  <div class="row"><button class="btn" id="btnClose">닫기</button></div>`);
 $('btnClose').onclick=closeModal;
}

// ===================== 입력 =====================
$('btnStart').onclick=()=>{AU.init();AU.click();if(!S.started){S.started=true;ensureMonthly();refreshMission();save();toast(`🌅 Day 1! 용돈 ${fmt(S.money)}원으로 시작해요`,2200);}else{refreshMission();}setScene('lobby');};
$('btnReset').onclick=()=>{if(confirm('저장된 데이터를 모두 지울까요?')){localStorage.removeItem(SAVE_KEY);S=defaultState();toast('초기화 완료!');}};
$('btnKiosk').onclick=()=>{AU.init();AU.click();resetKiosk();setScene('kiosk');};
$('btnBook').onclick=()=>{AU.click();openBook();};
$('btnStats').onclick=()=>{AU.click();openStats();};
$('btnReviews').onclick=()=>{AU.click();openReviews();};
$('btnNext').onclick=()=>{AU.init();AU.click();nextDay();};
$('btnSkip').onclick=()=>{AU.click();skipCounter();};
$('btnStopEat').onclick=()=>{AU.click();if(G.eat&&!G.eat.finished)finishEat();};
$('sndBtn').onclick=()=>{AU.init();AU.on=!AU.on;S.sound=AU.on;save();$('sndBtn').textContent=AU.on?'🔊 소리':'🔇 무음';if(AU.on)AU.click();};
$('sndBtn').textContent=AU.on?'🔊 소리':'🔇 무음';
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'&&G.scene!=='eat')closeModal();});
cv.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();if(G.scene==='eat')tryBite();else if(G.scene==='counter'){/* 클릭으로 살짝 빨리 */}});
addEventListener('keydown',e=>{if(e.code==='Space'&&G.scene==='eat'){e.preventDefault();tryBite();}});

// ===================== 메인 루프 =====================
let last=performance.now();
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;G.time+=dt;
 ctx.clearRect(0,0,W,H);
 switch(G.scene){
  case 'title':drawTitleScene();break;
  case 'lobby':case 'kiosk':drawLobbyScene();break;
  case 'counter':updateCounter(dt);if(G.scene==='counter')drawCounterScene();else drawEatScene();break;
  case 'eat':updateEat(dt);drawEatScene();break;
 }
 requestAnimationFrame(loop);
}
setScene('title');
requestAnimationFrame(loop);
</script>
</body>
</html>
