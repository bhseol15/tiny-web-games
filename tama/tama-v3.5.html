<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#20242c">
<title>TAMAGOTCHI v3</title>
<style>
@font-face{font-family:'DungGeunMo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#20242c;color:#cfd6e4;
  font-family:'DungGeunMo','Galmuri11',ui-monospace,'D2Coding',monospace;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5vh;
  background:radial-gradient(circle at 50% 30%,#39404f,#171a20 75%)}
.device{--s1:#ff6f91;--s2:#ffb3c4;position:relative;width:min(94vw,72vh,440px);width:min(94vw,72dvh,440px);
  aspect-ratio:10/12.4;container-type:inline-size;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(circle at 32% 22%,var(--s2),var(--s1) 62%);
  border-radius:50% 50% 48% 48%/56% 56% 44% 44%;
  box-shadow:inset -3cqw -4cqw 8cqw #0004,inset 2cqw 3cqw 6cqw #fff5,0 3cqw 8cqw #000a}
.brand{margin-top:11cqw;height:8cqw;line-height:8cqw;font-size:4.6cqw;letter-spacing:.35em;color:#fffc;text-shadow:0 .3cqw 0 #0004}
.bezel{width:68cqw;padding:3cqw;margin-top:1.5cqw;background:#262a31;border-radius:6cqw;box-shadow:inset 0 0 2cqw #000,0 .6cqw 0 #fff4}
.lcd{--bg:#b7c79b;--fg:#1d2a1a;position:relative;container-type:inline-size;background:var(--bg);color:var(--fg);
  border-radius:2.5cqw;overflow:hidden;box-shadow:inset 0 0 6cqw #0005}
.lcd.dark{--bg:#232e1f;--fg:#a9bd8a}
.icons{display:flex;justify-content:space-around;height:14cqw;align-items:center}
.icon{width:20cqw;height:13cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.28;cursor:pointer}
.icon.on{opacity:1}
.icon canvas{width:7.5cqw;height:7.5cqw;image-rendering:pixelated}
.icon span{font-size:3.6cqw;line-height:4.4cqw}
#cv{display:block;width:100%;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.grid{position:absolute;left:0;right:0;top:14cqw;height:66.67cqw;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 calc(100cqw/48 - 1px),#0000000d 0 calc(100cqw/48)),
             repeating-linear-gradient(90deg,transparent 0 calc(100cqw/48 - 1px),#0000000d 0 calc(100cqw/48))}
#msg{height:10cqw;line-height:10cqw;font-size:5.4cqw;text-align:center;white-space:nowrap;overflow:hidden;border-top:1px dashed color-mix(in srgb,var(--fg) 35%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--fg) 35%,transparent)}
#panel{position:absolute;inset:0;background:var(--bg);padding:3cqw 4cqw;display:flex;flex-direction:column;font-size:5.6cqw;line-height:1.45}
#panel[hidden]{display:none}
.p-title{text-align:center;border-bottom:.6cqw solid var(--fg);padding-bottom:1cqw;margin-bottom:1.5cqw;font-size:6cqw}
.p-body{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.p-item{padding:.6cqw 2cqw;cursor:pointer;display:flex;align-items:center;gap:2cqw;white-space:nowrap}
.p-item small{font-size:4.2cqw;opacity:.75}
.p-item.sel{background:var(--fg);color:var(--bg)}
.p-item canvas{width:11cqw;height:11cqw;image-rendering:pixelated;flex:none}
.p-hint{text-align:center;font-size:4cqw;opacity:.7;border-top:1px dashed var(--fg);padding-top:1cqw;white-space:nowrap}
.center{text-align:center}
.big{font-size:10cqw;letter-spacing:.08em;line-height:1.2}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.row{display:flex;align-items:center;gap:2cqw;white-space:nowrap}
.row b{font-weight:normal;width:17cqw;flex:none}
.bar{flex:1;height:4.6cqw;border:.6cqw solid var(--fg);padding:.5cqw}
.bar i{display:block;height:100%;background:var(--fg)}
#nameIn{width:100%;font:inherit;font-size:7cqw;text-align:center;background:transparent;color:var(--fg);border:.7cqw solid var(--fg);border-radius:0;padding:1.5cqw;outline:none;user-select:text;-webkit-user-select:text}
.pbtn{margin:3cqw auto 0;padding:1cqw 6cqw;background:var(--fg);color:var(--bg);cursor:pointer}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2cqw}
.dex div{aspect-ratio:1;border:.5cqw solid color-mix(in srgb,var(--fg) 40%,transparent);display:flex;align-items:center;justify-content:center;font-size:8cqw;cursor:pointer}
.dex div.sel{border-color:var(--fg);outline:.6cqw solid var(--fg)}
.dex canvas{width:80%;height:80%;image-rendering:pixelated}
.btns{display:flex;gap:7cqw;margin-top:4cqw;align-items:flex-start}
.btn{width:13cqw;height:13cqw;border-radius:50%;border:0;padding:0;font:inherit;font-size:4.5cqw;color:#0008;cursor:pointer;
  background:radial-gradient(circle at 35% 30%,#fff,#e9e2c9 45%,#b9b196);box-shadow:0 1cqw 0 #0005,0 1.4cqw 2cqw #0006;touch-action:none}
.btn:active,.btn.down{transform:translateY(.8cqw);box-shadow:0 .2cqw 0 #0005}
.btn.b{margin-top:3cqw}
.help{font-size:12px;opacity:.55;text-align:center;line-height:1.5;padding:0 12px}
@media (max-height:560px){.help{display:none}}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="brand">TAMAGOTCHI</div>
  <div class="bezel">
    <div class="lcd" id="lcd">
      <div class="icons" id="iconsTop"></div>
      <canvas id="cv" width="48" height="32"></canvas>
      <div class="grid"></div>
      <div id="msg"></div>
      <div class="icons" id="iconsBot"></div>
      <div id="panel" hidden></div>
    </div>
  </div>
  <div class="btns">
    <button class="btn a" data-b="A" aria-label="A 버튼">A</button>
    <button class="btn b" data-b="B" aria-label="B 버튼">B</button>
    <button class="btn c" data-b="C" aria-label="C 버튼">C</button>
  </div>
</div>
<div class="help">A 이동 · B 선택 · C 취소 &nbsp;|&nbsp; 키보드: ←→ 이동 · Enter 선택 · Esc 취소 (Z/X/C = A/B/C)<br>화면의 아이콘·메뉴는 직접 눌러도 됩니다</div>

function drawSpr(c,s,x,y,flip){
  x=Math.round(x);y=Math.round(y);
  for(let r=0;r<s.length;r++){const row=s[r],w=row.length;
    for(let k=0;k<w;k++) if(row[k]==='#') c.fillRect(x+(flip?w-1-k:k),y+r,1,1);}
}

const RUNAWAY_MIN=120;                   // 방치 누적(게임 분) → 가출

/* ================= 저장 상태 ================= */
let S={v:1,pet:null,dex:{},speed:4,shell:0,sound:true,runaways:0,lastTs:Date.now()};
let P=null;
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(d&&d.v===1){S=Object.assign(S,d);P=S.pet;migrate();}}catch(e){}}
function save(){S.pet=P;try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
const ui={lastFood:[null,null],intro:null,cursor:-1,panel:null,game:null,fx:null,msg:'',msgUntil:0,px:16,dir:-1,bob:0,warned:false,dark:null};
let frame=0,lastInteract=Date.now();
const held={A:false,B:false,C:false};

/* ================= 사운드 ================= */
let AC=null;
function beep(f,d=0.07,when=0){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.045;
    o.connect(g);g.connect(AC.destination);const t=AC.currentTime+when;o.start(t);o.stop(t+d);}catch(e){}
}
const tune=(arr,step=0.09)=>arr.forEach((f,i)=>f&&beep(f,step*0.9,i*step));
const sfx={
  move:()=>beep(1047,.03), ok:()=>tune([988,1319],.06), back:()=>beep(523,.05), no:()=>tune([247,196],.1),
  eat:()=>tune([659,0,659,0,659],.11), happy:()=>tune([784,988,1175],.08), wash:()=>tune([1319,1175,1319,1175],.07),
  win:()=>tune([784,988,1175,1568,0,1568],.09), lose:()=>tune([392,330,262],.14), alert:()=>tune([1568,0,1568,0,1568],.08),
  evolve:()=>tune([523,659,784,1047,1319,1568],.1), bye:()=>tune([440,415,392,349,294],.2), point:()=>beep(1319,.05), sleep:()=>tune([659,523,392],.15),
};

/* ================= 시간/시뮬레이션 ================= */
const isNight=()=>{const h=new Date().getHours();return h>=21||h<7;};
function say(t,ms=2200){ui.msg=t;ui.msgUntil=Date.now()+ms;}
function newPet(type,name){
  P={type,name,stage:0,form:null,age:0,stageT:0,hunger:70,happy:70,energy:85,clean:100,poop:0,poopT:1200,
     sleep:false,neglect:0,careSum:0,careT:0,wins:0};
  ui.px=16;ui.cursor=-1;ui.warned=false;save();
}
const formId=()=>!P||P.stage===0?null:P.type+'_'+(P.stage===1?'baby':(P.stage===2?'c':'a')+(P.sp||0));
const petSprite=()=>P.stage===0?'egg_'+P.type:formId();
function advance(gs){while(gs>0&&P){const c=Math.min(gs,30);stepSim(c);gs-=c;}}
function stepSim(c){
  const m=c/60;P.age+=c;P.stageT+=c;
  if(P.stage===0){if(P.stageT>=STAGE_MIN[0]*60)evolve();return;}
  if(P.sleep){
    P.energy+=2.5*m;P.hunger-=0.3*m;P.happy-=0.2*m;P.clean-=0.15*m;
    if(P.energy>=100&&!isNight()){P.sleep=false;say('잘 잤다! 일어났어요');}
  }else{
    P.hunger-=1.0*m;P.happy-=0.8*m;P.clean-=(0.4+0.6*P.poop)*m;P.energy-=(isNight()?1.2:0.6)*m;
    P.poopT-=c;if(P.poopT<=0){if(P.poop<3)P.poop++;P.poopT=1100+rnd(900);}
    if(P.energy<=0){P.sleep=true;say('지쳐서 잠들었어요');}
  }
  for(const k of['hunger','happy','energy','clean'])P[k]=clamp(P[k]);
  const zeros=(P.hunger<=0)+(P.happy<=0)+(P.clean<=0);
  if(zeros)P.neglect+=m*zeros;else if(Math.min(P.hunger,P.happy,P.clean)>30)P.neglect=Math.max(0,P.neglect-m*0.5);
  if(P.stage<3){P.careSum+=(P.hunger+P.happy+P.clean+P.energy)/4*c;P.careT+=c;}
  if(P.spouse&&!P.heir){                                   // 결혼 뒤 게임 시간 60분이 지나면 2세 알이 생김
    P.wedT=(P.wedT||0)+c;
    if(P.wedT>=HEIR_MIN*60){const t=rnd(1)<0.5?P.type:P.spouse.id.split('_')[0];P.heir={type:t};sfx.happy();say('2세 알이 생겼어요!',4000);}
  }
  if(P.neglect>=RUNAWAY_MIN){runaway();return;}
  if(P.stage<3&&P.stageT>=STAGE_MIN[P.stage]*60)evolve();
}
function evolve(){
  P.stage++;P.stageT=0;
  if(P.stage===2)P.sp=Math.floor(rnd(NSP));                       // 어린이가 될 때 30종 중 하나로 정해짐
  if(P.stage===3)P.form=(P.careT?P.careSum/P.careT:0)>=55?'a':'b';   // 돌봄 등급(a 잘 자람 / b 제멋대로)
  const id=formId();const isNew=!S.dex[id];S.dex[id]=true;
  ui.fx={kind:'flash',t:30};sfx.evolve();
  say(P.stage===1?'알에서 '+FORMS[id].name+' 탄생!':FORMS[id].name+'(으)로 진화!'+(isNew?' ★':''),4000);
  save();
}
function runaway(){
  const name=P.name;P=null;S.runaways++;ui.game=null;ui.fx=null;save();sfx.bye();
  openInfo('가출',`<div class="center">${esc(name)}의 편지<br><br>"돌봐주지 않아서<br>집을 나갑니다…<br>찾지 마세요."</div>`,()=>openPickType(),'B: 새 알 고르기');
}
function offline(dt){
  if(isNight()&&P.stage>0)P.sleep=true;
  advance(Math.min(dt,8*3600)*0.5);           // 자리를 비운 동안은 느리게(×0.5, 최대 8시간)
  if(P){const m=Math.round(dt/60);say(m>=60?`${Math.floor(m/60)}시간 ${m%60}분 만이에요!`:m>=1?`${m}분 만이에요!`:'다시 왔어요!',3500);}
  save();
}

/* ================= 렌더링 ================= */
function setDark(d){
  if(ui.dark===d)return;ui.dark=d;lcd.classList.toggle('dark',d);drawIcons();
  if(ui.panel)renderPanel();
}
const fg=()=>getComputedStyle(lcd).getPropertyValue('--fg').trim()||'#1d2a1a';
let FG='#1d2a1a';
function drawIcons(){
  FG=fg();
  document.querySelectorAll('.icon canvas').forEach((c,i)=>{const g=c.getContext('2d');g.clearRect(0,0,9,9);g.fillStyle=FG;drawSpr(g,ICONS[i].spr,0,0);});
}
function buildIcons(){
  ICONS.forEach((ic,i)=>{const d=document.createElement('div');d.className='icon';d.dataset.i=i;
    d.innerHTML=`<canvas width="9" height="9"></canvas><span>${ic.label}</span>`;
    d.addEventListener('pointerdown',e=>{e.preventDefault();touch();if(ui.panel||ui.game||!P)return;ui.cursor=i;doIcon(i);});
    (i<4?$('#iconsTop'):$('#iconsBot')).appendChild(d);});
}
function background(){
  const night=isNight();
  spr(night?'moon':'sun',W-9,1);
  if(night){[[5,3],[14,7],[25,2],[33,6]].forEach(([x,y],i)=>{if((frame>>4)%4!==i)cx.fillRect(x,y,1,1);});}
  const t=P?P.type:'land',f=frame>>3;
  if(t==='sea'){for(let x=0;x<W;x++)cx.fillRect(x,(x+f)%6<3?31:30,1,1);
    cx.fillRect(4,24-(f%14),1,1);cx.fillRect(6,28-((f+5)%16),1,1);}
  else if(t==='land'){cx.fillRect(0,31,W,1);for(let x=2;x<W;x+=7){cx.fillRect(x,30,1,1);cx.fillRect(x+1,29,1,1);cx.fillRect(x+2,30,1,1);}}
  else{for(let x=0;x<W;x+=2)cx.fillRect(x,31,1,1);
    const c=(W+8)-((frame>>4)%(W+16));cx.fillRect(c,3,5,1);cx.fillRect(c+1,2,3,1);cx.fillRect(c-1,4,7,1);}
}
function render(){
  cx.clearRect(0,0,W,H);cx.fillStyle=FG;
  if(ui.intro){renderIntro();return;}
  if(ui.game){renderGame();return;}
  if(!P)return;
  background();
  const fx=ui.fx,name=petSprite();let x=ui.px,y=14,flip=ui.dir>0,pair=false;
  if(fx&&fx.kind==='wed'){                                  // 결혼식: 둘이 마주 보고 통통, 하트가 떠오름
    const up=(fx.t>>2)%2,h=((110-fx.t)>>2)%10;
    spr(name,7,14-(up?1:0),true);spr(P.spouse.id,25,14-(up?0:1));
    spr('heart',20,9-h);if(fx.t<80)spr('heart',8,7-(h+5)%10*0.6);if(fx.t<60)spr('heart',33,7-(h+2)%10*0.6);
    if(up){cx.fillRect(3,4,1,3);cx.fillRect(2,5,3,1);cx.fillRect(44,3,1,3);cx.fillRect(43,4,3,1);}
    return;
  }
  if(P.stage===0){x=16;y=14;flip=false;x+=(frame%40<6)?((frame>>1)%2?1:-1):0;}
  else if(P.sleep){y=15;spr('zz',x+15,8-((frame>>3)%3));if((frame>>3)%3>0)cx.fillRect(x+13,13,2,1);}
  else if(fx&&fx.kind==='eat'){x=18;flip=false;y=14+((frame>>2)%2);
    const k=fx.t>26?fx.food:fx.t>12?null:'crumb';
    if(fx.t>26)spr(fx.food,7,22);else if(fx.t>12){cx.save();cx.beginPath();cx.rect(7,22,8,4+0);cx.rect(11,22,4,8);cx.clip();spr(fx.food,7,22);cx.restore();}else spr('crumb',7,22);}
  else if(fx&&fx.kind==='wash'){x=16;flip=(fx.t>>4)%2===0;y=6+((fx.t>>2)%2);}
  else if(fx&&fx.kind==='no'){flip=(fx.t>>1)%2===0;}
  else if(fx&&fx.kind==='heart'){pair=true;y=14-((frame>>1)%2);spr('heart',x+4,5-((20-fx.t)>>3));}
  else{pair=true;y=14+ui.bob;if(isSad()){spr('sweat',x+(flip?-1:14),9+((frame>>3)%2));}}
  if(P.heir&&!(fx&&fx.kind==='wash'))spr('egg_s',(frame%60<6&&(frame>>1)%2)?2:1,21);   // 2세 알 (짝꿍은 집 화면에 나오지 않음)
  if(fx&&fx.kind==='wash'){cx.save();cx.beginPath();cx.rect(0,0,W,18);cx.clip();spr(name,x,y,flip);cx.restore();}   // 욕조 위로 나온 부분만
  else if(!(fx&&fx.kind==='flash'&&(fx.t>>2)%2))spr(name,x,y,flip);
  if(P.stage>0)for(let i=0;i<P.poop;i++)spr('poop',W-9-i*9,23);
  if(fx&&fx.kind==='wash'){
    const t=fx.t,a=(t>>2)%2;
    cx.fillRect(8,18,2,1);cx.fillRect(38,18,2,1);cx.fillRect(9,19,30,1);          // 욕조 테두리
    cx.fillRect(10,20,1,7);cx.fillRect(37,20,1,7);cx.fillRect(11,27,1,1);cx.fillRect(36,27,1,1);cx.fillRect(12,28,24,1);   // 욕조 몸통
    cx.fillRect(13,29,2,2);cx.fillRect(33,29,2,2);                                 // 다리
    cx.fillRect(13,22,5,1);cx.fillRect(13,24,3,1);                                 // 욕조 무늬
    cx.fillRect(42,10,1,9);cx.fillRect(38,10,4,1);cx.fillRect(38,11,1,2);          // 수도꼭지
    if(t>14)cx.fillRect(38,14+((60-t)>>1)%4,1,1);                                  // 물방울
    for(let bx=11;bx<37;bx+=3)cx.fillRect(bx+a,17+((bx/3+a)&1),2,1);               // 거품
    [[6,0],[20,7],[31,3]].forEach(([bx,o])=>{const by=14-((60-t+o*2)>>1)%12;       // 떠오르는 비눗방울
      cx.fillRect(bx+1,by,1,1);cx.fillRect(bx,by+1,1,1);cx.fillRect(bx+2,by+1,1,1);cx.fillRect(bx+1,by+2,1,1);});
    if(t<14&&a){[[4,6],[43,4],[24,1]].forEach(([sx,sy])=>{cx.fillRect(sx,sy-1,1,3);cx.fillRect(sx-1,sy,3,1);});}   // 반짝반짝
  }
  if(fx&&fx.kind==='flash'&&fx.t%8<2){cx.fillRect(0,0,W,H);}
}
const isSad=()=>P&&P.stage>0&&Math.min(P.hunger,P.happy,P.clean,P.energy)<25;
function wander(){
  if(!P||P.stage===0||P.sleep||ui.fx||ui.game)return;
  if(isSad()){ui.bob=(frame>>4)%2;return;}
  if(frame%8)return;
  if(rnd(1)<0.12)ui.dir=-ui.dir;
  const max=W-17-(P.poop?P.poop*9:0),min=P.heir?9:1;          // 2세 알이 있으면 왼쪽 자리를 비워 둠
  ui.px+=ui.dir;if(ui.px<min){ui.px=min;ui.dir=1;}if(ui.px>max){ui.px=max;ui.dir=-1;}
  ui.bob=ui.bob?0:1;
}
function updateUI(){
  document.querySelectorAll('.icon').forEach((d,i)=>d.classList.toggle('on',ui.cursor===i&&!ui.panel&&!ui.game));
  let t='';
  if(ui.intro)t=introMsg();
  else if(ui.game)t=gameMsg();
  else if(Date.now()<ui.msgUntil)t=ui.msg;
  else if(!P)t='';
  else if(ui.cursor>=0)t='▶ '+['밥 주기','간식 주기','놀아주기','씻기기',P.sleep?'불 켜기':'불 끄기','상태 보기','도감','설정'][ui.cursor];
  else if(P.stage===0)t='알이 꿈틀… (톡톡 두드려요)';
  else if(P.sleep)t=P.name+' Zzz…';
  else{const w=[];if(P.hunger<25)w.push('배고파');if(P.happy<25)w.push('심심해');if(P.clean<25)w.push('찝찝해');if(P.energy<25)w.push('졸려');
    t=w.length?((frame>>3)%2?'!':' ')+' '+w.slice(0,2).join(' ')+'…':P.name;}
  if(msgEl.textContent!==t)msgEl.textContent=t;
  const sad=isSad()&&!P.sleep;if(sad&&!ui.warned)sfx.alert();ui.warned=sad;
}

/* ================= 패널(메뉴) ================= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function closePanel(){ui.panel=null;panelEl.hidden=true;panelEl.innerHTML='';}
function openList(title,items,onCancel,idx=0){ui.panel={kind:'list',title,items,idx,onCancel};renderPanel();}
function openInfo(title,html,onClose,hint){ui.panel={kind:'info',title,html,onClose,hint};renderPanel();}
function renderPanel(){
  const p=ui.panel;if(!p)return;panelEl.hidden=false;FG=fg();
  if(p.kind==='list'){
    panelEl.innerHTML=`<div class="p-title">${p.title}</div><div class="p-body">`+p.items.map((it,i)=>
      `<div class="p-item${i===p.idx?' sel':''}" data-i="${i}">${it.spr?`<canvas width="16" height="16" data-spr="${it.spr}"></canvas>`:''}<span>${it.label}</span>${it.desc?`<small>${it.desc}</small>`:''}</div>`).join('')+
      `</div><div class="p-hint">A 이동 · B 선택${p.onCancel?' · C 뒤로':''}</div>`;
  }else if(p.kind==='info'){
    panelEl.innerHTML=`${p.title?`<div class="p-title">${p.title}</div>`:''}<div class="p-body" data-close="1">${p.html}</div><div class="p-hint">${p.hint||'B 또는 C: 닫기'}</div>`;
  }else if(p.kind==='name'){
    panelEl.innerHTML=`<div class="p-title">이름 짓기</div><div class="p-body"><div class="center">${p.heir?'2세':TYPES[p.type].name+' 친구'}의 이름은?</div>
      <input id="nameIn" maxlength="6" placeholder="${TYPES[p.type].def}" autocomplete="off" enterkeyhint="done" value="${esc(p.value||'')}">
      <div class="pbtn" data-ok="1">확인</div></div><div class="p-hint">B 확인 · C 뒤로 (최대 6글자)</div>`;
    const inp=$('#nameIn');inp.addEventListener('input',()=>p.value=inp.value);
  }else if(p.kind==='dex'){
    const got=DEX_ORDER.filter(id=>S.dex[id]).length,pg=DEX_PAGES[p.pg],id=pg[p.idx],has=S.dex[id];
    panelEl.innerHTML=`<div class="p-title"><span data-pg="-1">◀</span> 도감 ${got}/${DEX_ORDER.length} · ${p.pg+1}/${DEX_PAGES.length} <span data-pg="1">▶</span></div><div class="p-body"><div class="dex">`+pg.map((d,i)=>
      `<div class="${i===p.idx?'sel':''}" data-i="${i}">${S.dex[d]?`<canvas width="16" height="16" data-spr="${d}"></canvas>`:'?'}</div>`).join('')+
      `</div></div><div class="p-hint">${TYPES[id.split('_')[0]].name} ${stageOf(id)} · ${has?FORMS[id].name+' · '+FORMS[id].desc:'??? (B: 다음 쪽)'}</div>`;
  }
  panelEl.querySelectorAll('canvas[data-spr]').forEach(c=>{const g=c.getContext('2d');
    g.fillStyle=c.closest('.sel')&&p.kind==='list'?getComputedStyle(lcd).getPropertyValue('--bg').trim():FG;drawSpr(g,SPR[c.dataset.spr],0,0);});
}
panelEl.addEventListener('click',e=>{
  const p=ui.panel;if(!p)return;touch();
  if(e.target.closest('[data-ok]')){panelPress('B');return;}
  const pgBtn=e.target.closest('[data-pg]');
  if(pgBtn&&p.kind==='dex'){dexPage(+pgBtn.dataset.pg);return;}
  const it=e.target.closest('[data-i]');
  if(it){p.idx=+it.dataset.i;if(p.kind==='list'){panelPress('B');}else{sfx.move();renderPanel();}return;}
  if(p.kind==='info'&&e.target.closest('[data-close],.p-hint')){panelPress('B');}
});
function panelPress(b,dir=1){
  const p=ui.panel;
  if(p.kind==='list'){
    if(b==='A'){p.idx=(p.idx+dir+p.items.length)%p.items.length;sfx.move();renderPanel();}
    else if(b==='B'){sfx.ok();p.items[p.idx].fn();}
    else if(p.onCancel){sfx.back();p.onCancel();}
  }else if(p.kind==='info'){
    if(b==='A')return;
    sfx.ok();const f=p.onClose;if(f)f();else closePanel();
  }else if(p.kind==='name'){
    if(b==='B'){const v=(p.value||'').trim().slice(0,6)||TYPES[p.type].def;sfx.ok();if(document.activeElement)document.activeElement.blur();p.heir?startHeir(p.type,v):openPickSpeed(p.type,v);}
    else if(b==='C'){sfx.back();if(p.heir)closePanel();else startIntro(2,TKEYS.indexOf(p.type));}
    else{const i=$('#nameIn');if(i)i.focus();}
  }else if(p.kind==='dex'){
    if(b==='C'){sfx.back();closePanel();}
    else if(b==='B')dexPage(1);
    else{const n=DEX_PAGES[p.pg].length,i=p.idx+dir;
      if(i<0){dexPage(-1);ui.panel.idx=DEX_PAGES[ui.panel.pg].length-1;renderPanel();}
      else if(i>=n)dexPage(1);
      else{p.idx=i;sfx.move();renderPanel();}}
  }
}
function dexPage(d){const p=ui.panel,n=DEX_PAGES.length;p.pg=(p.pg+d+n)%n;p.idx=0;sfx.move();renderPanel();}
function openDex(){
  const id=formId();let pg=Math.max(0,DEX_PAGES.findIndex(g=>g.includes(id)));
  ui.panel={kind:'dex',pg,idx:Math.max(0,DEX_PAGES[pg].indexOf(id))};renderPanel();
}

/* ---------- 오프닝 컷신: 잼민이의 문방구 ---------- */
// 장면 0 문방구 가는 길 → 1 가게 안 → 5 무엇을 살까(간식·학용품·다마고치) → 2 알 고르기(물·흙·하늘) → 3 계산 → 4 구매 완료 → 이름 짓기
// 장면 6: 간식·학용품을 골랐을 때의 짧은 장면(끝나면 5로 돌아옴)
const SHOP=[{spr:'shop_snack',name:'간식',desc:'달콤한 군것질',got:'잼민이: 냠냠! 근데 다마고치는?'},
  {spr:'shop_pen',name:'학용품',desc:'공책과 연필',got:'잼민이: 숙제는 내일! 다마고치는?'},
  {spr:'shop_tama',name:'다마고치',desc:'오늘의 주인공!'}];
const TKEYS=['sea','land','sky'];

    if(P.hunger>=95){ui.fx={kind:'no',t:16};sfx.no();say('배불러요! 도리도리');return;}
    const list=FOODS[i===0?'meal':'snack'];let f;do{f=list[Math.floor(rnd(list.length))];}while(f[0]===ui.lastFood[i]);ui.lastFood[i]=f[0];   // 매번 다른 메뉴
    if(i===0){P.hunger=clamp(P.hunger+30);P.neglect=Math.max(0,P.neglect-5);say('냠냠! '+f[1]+' 맛있다');}
    else{P.hunger=clamp(P.hunger+8);P.happy=clamp(P.happy+12);P.clean=clamp(P.clean-4);say('간식은 '+f[1]+'! 신난다');}

    P.sleep=!P.sleep;sfx.sleep();say(P.sleep?'불을 껐어요. 잘 자요':'불을 켰어요. 좋은 아침!');

/* ================= 미니게임 ================= */
const RPS=['가위','바위','보'];
function startGame(kind){
  if(P.energy<10){closePanel();sfx.no();say('너무 피곤해서 못 놀아요');return;}
  closePanel();
  const g={kind,t:0,score:0,round:0,phase:'wait',timer:0};
  if(kind==='lr'){g.rounds=5;g.need=3;}
  if(kind==='rps'){g.rounds=3;g.need=2;}
  if(kind==='catch'){g.x=16;g.n=0;g.food=null;}
  if(kind==='jump'){g.y=0;g.vy=0;g.obs=[];g.next=25;g.spawned=0;g.dead=false;}
  if(kind==='friend'){                                   // 이웃 친구: 같은 성장 단계의 다른 생물이 놀러 옴
    const me=formId(),mate=P.spouse?P.spouse.id:null;let id;
    // 어른이고 아직 결혼 전이면, 가장 친한 친구가 다시 찾아올 확률이 높음(친해질 수 있게)
    const pals=P.stage===3&&!mate&&P.pals?Object.keys(P.pals).filter(k=>k!==me&&FORMS[k]&&k.split('_')[1][0]==='a').sort((a,b)=>P.pals[b]-P.pals[a]):[];
    if(pals.length&&rnd(1)<0.6)id=pals[0];
    else do{const t=TKEYS[Math.floor(rnd(3))];id=t+'_'+(P.stage===1?'baby':(P.stage===2?'c':'a')+Math.floor(rnd(NSP)));}while(id===me||id===mate);
    Object.assign(g,{fid:id,fname:FORMS[id].name,fx:W,phase:'in',n:0,u:0,dir:-1,swing:0,hop:0});
    sfx.happy();
  }
  ui.game=g;
}
function endFriend(){
  const g=ui.game,gain=10+g.score*4;ui.game=null;held.A=held.B=false;
  P.happy=clamp(P.happy+gain);P.energy=clamp(P.energy-8);P.hunger=clamp(P.hunger-5);P.friends=(P.friends||0)+1;
  P.pals=P.pals||{};
  const c=P.pals[g.fid]=Math.min(PAL_MAX,(P.pals[g.fid]||0)+(g.score>=3?2:1));     // 친한 정도: 한 번 놀면 +1, 공 3개 이상 받아치면 +2
  const canMarry=P.stage===3&&!P.spouse&&c>=PAL_MAX;
  sfx.win();save();
  openInfo('친구와 놀았어요',`<div class="center">이웃 친구 ${esc(g.fname)}<br>받아친 공 ${g.score}/5 · 행복 +${gain}<br><br>친한 정도<br>${'♥'.repeat(c)+'♡'.repeat(PAL_MAX-c)}${canMarry?'<br>아주 친해졌어요!':''}</div>`,
    ()=>canMarry?openPropose(g.fid):closePanel(),canMarry?'B: 다음':'');
}
/* ---------- 결혼: 어른이 된 뒤 이웃 친구와 친한 정도가 가득 차면 ---------- */

function endGame(win){
  const g=ui.game;ui.game=null;held.A=held.B=false;
  P.happy=clamp(P.happy+(win?28:12));P.energy=clamp(P.energy-8);P.hunger=clamp(P.hunger-5);if(win)P.wins++;
  win?sfx.win():sfx.lose();save();
  const unit=g.kind==='jump'||g.kind==='catch'?'개':'번';
  openInfo(win?'성공!':'아쉬워요',`<div class="center">점수 ${g.score}${unit}<br><br>${win?esc(P.name)+' 기분 최고!<br>행복 +28':'그래도 즐거웠어요<br>행복 +12'}</div>`,()=>closePanel());
}
function gamePress(b){
  const g=ui.game;
  if(g.kind==='lr'){
    if(b==='C'){ui.game=null;sfx.back();return;}
    if(g.phase!=='wait')return;
    g.ans=rnd(1)<0.5?'L':'R';g.pick=b==='A'?'L':'R';g.ok=g.ans===g.pick;if(g.ok)g.score++;
    g.ok?sfx.happy():sfx.no();g.phase='show';g.timer=24;
  }else if(g.kind==='rps'){
    if(g.phase!=='wait')return;
    g.me='ABC'.indexOf(b);g.pet=Math.floor(rnd(3));g.res=(g.me-g.pet+3)%3;   // 0 비김, 1 승, 2 패
    if(g.res===1){g.score++;sfx.happy();}else if(g.res===2)sfx.no();else sfx.move();
    g.phase='show';g.timer=30;
  }else if(g.kind==='catch'){
    if(b==='C'){ui.game=null;sfx.back();}
  }else if(g.kind==='friend'){
    if(b==='C'){ui.game=null;sfx.back();say(g.fname+': 다음에 또 놀자~');return;}
    if(g.phase==='play'&&g.swing<=-5){g.swing=7;beep(660,.04);}        // 받아치기(잠깐 동안 유효)
  }else if(g.kind==='jump'){
    if(b==='C'){ui.game=null;sfx.back();return;}
    if(g.y>=0&&!g.dead){g.vy=-2.6;beep(784,.05);}
  }
}
function gameStep(){
  const g=ui.game;g.t++;
  if(g.kind==='lr'||g.kind==='rps'){
    if(g.phase==='show'&&--g.timer<=0){
      if(!(g.kind==='rps'&&g.res===0))g.round++;
      if(g.round>=g.rounds)return endGame(g.score>=g.need);
      g.phase='wait';}
  }else if(g.kind==='catch'){
    if(held.A)g.x-=2;if(held.B)g.x+=2;g.x=clamp(g.x,0,W-16);
    if(!g.food){if(g.n>=10){if(--g.timer<-12)return endGame(g.score>=6);return;}
      g.food={x:Math.floor(2+rnd(W-12)),y:-8,k:ALL_FOODS[Math.floor(rnd(ALL_FOODS.length))]};g.n++;}
    const f=g.food;f.y+=0.45+g.n*0.05;
    if(f.y>=9&&f.y<=17&&Math.abs((f.x+4)-(g.x+8))<9){g.score++;sfx.point();g.food=null;g.fl=6;}
    else if(f.y>24){beep(196,.1);g.food=null;}
    if(g.fl)g.fl--;
  }else if(g.kind==='friend'){
    g.swing--;if(g.hop)g.hop--;
    if(g.phase==='in'){g.fx=Math.max(30,W-g.t*0.5);if(g.t>=44){g.phase='play';g.n=1;g.u=0;g.dir=-1;g.swing=-9;}}
    else if(g.phase==='gap'){if(--g.timer<=0){if(g.n>=5)return endFriend();g.n++;g.u=0;g.dir=-1;g.phase='play';}}
    else{
      g.u+=0.032+g.n*0.004;
      if(g.u>=1){
        if(g.dir<0){                                       // 내 쪽에 도착: 제때 눌렀으면 받아침
          if(g.swing>0){g.score++;g.dir=1;g.u=0;sfx.point();}
          else{beep(196,.1);g.phase='gap';g.timer=16;g.lost=true;}
        }else{g.hop=6;g.phase='gap';g.timer=12;g.lost=false;}   // 친구가 받음
      }
    }
  }else if(g.kind==='jump'){
    if(g.dead){if(--g.timer<=0)endGame(g.score>=5);return;}
    g.vy+=0.3;g.y+=g.vy;if(g.y>=0){g.y=0;g.vy=0;}
    if(--g.next<=0&&g.spawned<10){g.obs.push({x:W});g.spawned++;g.next=30+rnd(18);}
    const v=1.5+g.spawned*0.06;
    for(const o of g.obs){o.x-=v;if(o.x<15&&o.x+4>7&&g.y>-5){g.dead=true;g.timer=22;sfx.no();return;}}
    while(g.obs.length&&g.obs[0].x<-4){g.obs.shift();g.score++;sfx.point();}
    if(g.spawned>=10&&!g.obs.length)endGame(true);
  }
}
function gameMsg(){
  const g=ui.game;
  if(g.kind==='lr')return g.phase==='wait'?`${g.round+1}/5 어느 쪽? ◀A B▶`:(g.ok?'맞았다!':'틀렸다…')+` (${g.score}점)`;
  if(g.kind==='rps')return g.phase==='wait'?'A가위 B바위 C보':`${RPS[g.me]} vs ${RPS[g.pet]} → ${['비김!','이겼다!','졌다…'][g.res]}`;
  if(g.kind==='catch')return `받은 먹이 ${g.score} · ${Math.min(g.n,10)}/10`;
  if(g.kind==='friend')return g.phase==='in'?`이웃 친구 ${g.fname} 등장!`:`공놀이 ${g.n}/5 · A/B로 받아치기`;
  return g.dead?'쿵! 부딪혔다':`넘은 장애물 ${g.score}/10`;
}
function renderGame(){
  const g=ui.game,name=petSprite();
  if(g.kind==='lr'){
    cx.fillRect(0,31,W,1);
    if(g.phase==='wait'){spr(name,16,14,(g.t>>2)%2===0);if((g.t>>3)%2){spr('arrow',2,18);spr('arrow',W-9,18,true);}}
    else{const r=g.ans==='R';spr(name,16,14,r);spr('arrow',r?W-10:3,18,r);spr(g.ok?'heart':'xx',g.ok?20:21,4);}
  }else if(g.kind==='rps'){
    if(g.phase==='wait'){const b=(g.t>>2)%2;spr('rps1',3,9+b);spr('rps1',33,9+(1-b),true);cx.fillRect(22,14,1,1);cx.fillRect(25,14,1,1);cx.fillRect(22,17,1,1);cx.fillRect(25,17,1,1);}
    else{spr('rps'+g.me,3,9);spr('rps'+g.pet,33,9,true);spr(g.res===1?'heart':g.res===2?'xx':'zz',g.res===1?20:21,13);}
    for(let i=0;i<g.rounds;i++){if(i<g.round+(g.phase==='show'&&g.res!==0?1:0))cx.fillRect(19+i*4,27,3,3);else{cx.fillRect(19+i*4,27,3,1);cx.fillRect(19+i*4,29,3,1);cx.fillRect(19+i*4,28,1,1);cx.fillRect(21+i*4,28,1,1);}}
    cx.fillRect(0,31,W,1);
  }else if(g.kind==='friend'){
    cx.fillRect(0,31,W,1);
    spr(name,1,14-(g.swing>0?2:0),true);
    spr(g.fid,g.fx,14-(g.phase==='in'?(g.t>>2)%2:g.hop?2:0));
    if(g.phase==='play'||g.phase==='gap'){
      const u=Math.min(g.u,1),p=g.dir<0?1-u:u;              // p: 0 내 쪽, 1 친구 쪽
      let bx=Math.round(17+p*13),by=Math.round(20-Math.sin(Math.PI*u)*13);
      if(g.phase==='gap'){if(g.lost){bx=15;by=28;}else{bx=30;by=20;}}
      cx.fillRect(bx,by+1,3,1);cx.fillRect(bx+1,by,1,3);
      if(g.phase==='gap'&&!g.lost)spr('heart',20,3);
    }
  }else if(g.kind==='catch'){
    for(let x=0;x<W;x+=2)cx.fillRect(x,31,1,1);
    spr(name,g.x,15-(g.fl?1:0));if(g.food)spr(g.food.k,g.food.x,g.food.y);if(g.fl)spr('heart',g.x+4,7);
  }else{
    const off=(g.t*2)%6;for(let x=-off;x<W;x+=6)cx.fillRect(x,31,3,1);cx.fillRect(0,30,W,1);
    if(!(g.dead&&(g.timer>>1)%2))spr(name,3,14+g.y,true);
    for(const o of g.obs)spr('cactus',o.x,24);
  }
}

/* ================= 입력 ================= */
function touch(){lastInteract=Date.now();if(AC&&AC.state==='suspended')AC.resume();}
function press(b,dir=1){
  touch();
  if(ui.panel){panelPress(b,dir);return;}
  if(ui.intro){introPress(b,dir);return;}
  if(ui.game){gamePress(b);return;}
  if(!P)return;
  if(b==='A'){ui.cursor=((ui.cursor<0&&dir<0?0:ui.cursor)+dir+8)%8;sfx.move();}
  else if(b==='B'){if(ui.cursor>=0)doIcon(ui.cursor);else petTouch();}
  else{if(ui.cursor>=0)sfx.back();ui.cursor=-1;}
}
document.querySelectorAll('.btn').forEach(el=>{
  const b=el.dataset.b;
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}
    held[b]=true;el.classList.add('down');press(b);});
  const up=()=>{held[b]=false;el.classList.remove('down');};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();const r=cv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width;
  if(ui.game){const b=ui.game.kind==='rps'?(fx<1/3?'A':fx<2/3?'B':'C'):(fx<0.5?'A':'B');
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    held[b]=true;cv._b=b;press(b);}
  else if(ui.intro&&!ui.panel){
    if(ui.intro.scene===2||ui.intro.scene===5){const i=Math.min(2,Math.floor(fx*3)),key=ui.intro.scene===2?'sel':'cat';if(i===ui.intro[key])press('B');else{touch();ui.intro[key]=i;sfx.move();}}
    else press('B');}
  else{touch();petTouch();}
});
const cvUp=()=>{if(cv._b){held[cv._b]=false;cv._b=null;}};
cv.addEventListener('pointerup',cvUp);cv.addEventListener('pointercancel',cvUp);cv.addEventListener('lostpointercapture',cvUp);
const keyMap=e=>{
  const k=e.key,inGame=!!ui.game&&!ui.panel;
  if(k==='z'||k==='Z')return['A',1];if(k==='x'||k==='X')return['B',1];if(k==='c'||k==='C')return['C',1];
  if(k==='Escape')return['C',1];
  if(inGame){if(k==='ArrowLeft')return['A',1];if(k==='ArrowRight')return['B',1];if(k===' '||k==='ArrowUp'||k==='Enter')return['A',1];return null;}
  if(k==='ArrowRight'||k==='ArrowDown'||k==='Tab')return['A',1];
  if(k==='ArrowLeft'||k==='ArrowUp')return['A',-1];
  if(k==='Enter'||k===' ')return['B',1];
  return null;
};
addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='nameIn'){
    if(e.isComposing||e.keyCode===229)return;
    if(e.key==='Enter'){e.preventDefault();press('B');}else if(e.key==='Escape'){press('C');}
    return;}
  const m=keyMap(e);if(!m)return;e.preventDefault();
  if(e.repeat&&ui.game)return;
  held[m[0]]=true;press(m[0],m[1]);
});
addEventListener('keyup',e=>{const m=keyMap(e);if(m)held[m[0]]=false;});
addEventListener('contextmenu',e=>e.preventDefault());

/* ================= 메인 루프 ================= */
function tick(){
  const now=Date.now(),dt=(now-S.lastTs)/1000;S.lastTs=now;
  if(P){if(dt>5)offline(dt);else if(dt>0)advance(dt*S.speed);}
  frame++;
  if(frame%20===0&&P&&P.stage>0&&!P.sleep&&isNight()&&!ui.game&&!ui.panel&&now-lastInteract>120000){P.sleep=true;sfx.sleep();say('밤이 깊어 잠들었어요');}
  setDark(!!(P&&P.sleep)||(isNight()&&!ui.panel&&!!P));
  if(P&&P.heir&&!P.heirAsked&&!P.sleep&&!ui.panel&&!ui.game&&!ui.fx&&!ui.intro){P.heirAsked=true;sfx.ok();openHeir();}   // 2세 알이 생기면 한 번 물어봄
  if(ui.intro&&!ui.panel)ui.intro.t++;
  if(ui.game)gameStep();
  if(ui.fx&&--ui.fx.t<=0)ui.fx=null;
  wander();render();updateUI();
  if(frame%100===0)save();
}
addEventListener('visibilitychange',()=>{if(document.hidden)save();});
addEventListener('pagehide',save);

load();buildIcons();applyShell();setDark(false);
if(!P)openTitle();
setInterval(tick,50);tick();
window.__tama={get S(){return S},get P(){return P},ui,advance,press,save};   // 디버그용
</script>
