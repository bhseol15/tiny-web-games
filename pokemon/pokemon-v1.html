<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1d1a2b;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none}
#app{height:100%;max-width:900px;margin:0 auto;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;right:8px;display:none;gap:6px}
#hud button{font:700 14px inherit;padding:8px 12px;border-radius:12px;border:3px solid #2a2238;background:#fff;color:#2a2238}
#ui{position:absolute;left:0;right:0;bottom:0;padding:8px;display:flex;flex-direction:column;gap:6px;max-height:100%;pointer-events:none}
#ui>*{pointer-events:auto}
#panel{display:none;gap:6px;overflow-y:auto;max-height:55vh;padding:2px}
#panel.cols1{grid-template-columns:1fr}
#panel.cols2{grid-template-columns:1fr 1fr}
#panel button{display:flex;align-items:center;gap:8px;text-align:left;min-height:50px;padding:6px 10px;border-radius:14px;border:3px solid #2a2238;background:#fff;color:#2a2238;font:inherit;box-shadow:0 3px 0 #2a2238}
#panel button b{font-size:15px;display:block}
#panel button small{font-size:11.5px;color:#6a6480;display:block;margin-top:1px}
#panel button img{width:40px;height:40px;flex:none}
#panel button.foc{background:#fff3b8;outline:3px solid #ffb400}
#panel button:disabled{opacity:.45}
#panel button.back{background:#e9e6f3}
#dlg{display:none;min-height:62px;padding:10px 14px;border-radius:16px;border:3px solid #2a2238;background:rgba(255,255,255,.96);color:#2a2238;font-size:15.5px;line-height:1.45;white-space:pre-line;font-weight:600;box-shadow:0 3px 0 #2a2238}
#dlg.tap::after{content:" ▼";color:#ff7a59;animation:bl 1s infinite}
@keyframes bl{50%{opacity:0}}
#full{position:absolute;inset:0;display:none;flex-direction:column;background:#f5f1ff;color:#2a2238}
#full header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:800;font-size:17px;border-bottom:3px solid #2a2238;background:#ffd95a}
#full header button{font:700 14px inherit;padding:6px 12px;border-radius:10px;border:3px solid #2a2238;background:#fff}
#dexg{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:10px;touch-action:pan-y}
.dx{border:3px solid #2a2238;border-radius:12px;background:#fff;text-align:center;padding:4px 2px 6px;font-size:12px;font-weight:700}
.dx img{width:60px;height:60px}
.dx i{display:inline-block;font-style:normal;color:#fff;border-radius:8px;padding:0 6px;font-size:10.5px}
#pad{display:none;height:168px;position:relative;background:linear-gradient(#2d2942,#1d1a2b);border-top:3px solid #2a2238;flex:none}
body.touch #pad{display:block}
#pad button{position:absolute;border:3px solid #15121f;background:#4a4466;color:#fff;font:800 18px inherit;border-radius:14px;box-shadow:0 4px 0 #15121f}
#pad button:active,#pad button.on{background:#7a72a6;transform:translateY(2px);box-shadow:0 2px 0 #15121f}
#pad .d{width:52px;height:52px}
#du{left:66px;top:8px}#dd{left:66px;top:108px}#dl{left:14px;top:58px}#dr{left:118px;top:58px}
#ba,#bb{width:66px;height:66px;border-radius:50%!important}
#ba{right:16px;top:28px;background:#ff6b6b!important}#bb{right:94px;top:74px;background:#4dabf7!important}
#hint{position:absolute;left:8px;top:8px;font-size:11.5px;color:#fff;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:8px;pointer-events:none}
body.touch #hint{display:none}
</style>
</head>

 c.beginPath();if(dir==='u')c.arc(0,-35,13.5,0,7);else{c.arc(0,-36,13.5,Math.PI*1.02,Math.PI*1.98);c.quadraticCurveTo(dir==='l'?12:6,-36,dir==='r'?-4:0,-40);c.quadraticCurveTo(dir==='r'?-12:-6,-36,-13.4,-36.8)}
 c.closePath();c.fillStyle=look[0];c.fill();c.stroke();
 if(dir!=='u'){const ex=dir==='d'?[-5,5]:dir==='l'?[-8,-1]:[1,8];ex.forEach(x=>{c.beginPath();c.ellipse(x,-32,2.2,3.4,0,0,7);c.fillStyle=OL;c.fill();c.beginPath();c.arc(x-.6,-33.2,.9,0,7);c.fillStyle='#fff';c.fill()})}
 c.restore();
}
let banner=-9;
function drawWorld(){
 const m=cur(),s=TS,mw=m.w*s,mh=m.h*s;
 const ox=mw<=W?(mw-W)/2:clamp(P.rx*s+s/2-W/2,0,mw-W),oy=mh<=H?(mh-H)/2:clamp(P.ry*s+s/2-H*.45,0,mh-H);
 cx.fillStyle=m.theme==='cave'?'#3a3040':m.theme==='snow'?'#3d8f6a':'#3fa55b';cx.fillRect(0,0,W,H);
 const x0=Math.max(0,Math.floor(ox/s)),x1=Math.min(m.w-1,Math.floor((ox+W)/s)),y0=Math.max(0,Math.floor(oy/s)),y1=Math.min(m.h-1,Math.floor((oy+H)/s));
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)drawTile(m.g[y][x],x,y,Math.round(x*s-ox),Math.round(y*s-oy),m.theme);
 m.blds.forEach(b=>drawBld(b,ox,oy));
 const ents=m.npcs.filter(npcVisible).map(n=>({y:n.y,n}));ents.push({y:P.ry,p:1});ents.sort((a,b)=>a.y-b.y);
 for(const e of ents){
  if(e.p)drawChar(P.rx*s-ox,P.ry*s-oy,P.dir,['#e63946','#4d96ff'],P.mv>0);
  else{const n=e.n,sx=n.x*s-ox,sy=n.y*s-oy;
   if(n.kind==='legend')drawMon(cx,n.mon,sx+s/2,sy+s*.95,s*1.25,T);
   else drawChar(sx,sy,n.dir,n.look,false);
   if(n.alert){cx.font=`900 ${s*.6}px system-ui`;cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='#fff';cx.strokeText('!',sx+s/2,sy-s*.2);cx.fillStyle='#e63946';cx.fillText('!',sx+s/2,sy-s*.2)}
   else if(n.kind==='trainer'&&!G.flags[n.id]){cx.font=`${s*.3}px system-ui`;cx.textAlign='center';cx.fillText('⚔️',sx+s/2,sy-s*.12)}}
 }
 const a=clamp(2.5-(T-banner),0,1);
 if(a>0){cx.globalAlpha=a;cx.lineWidth=3;cx.strokeStyle=OL;cx.font='800 16px system-ui,sans-serif';const tw0=cx.measureText(m.name).width+32;rr(W/2-tw0/2,44,tw0,34,12,'#fff');cx.fillStyle=OL;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(m.name,W/2,62);cx.globalAlpha=1}
}
/* ================= 그리기: 배틀 ================= */
function hpBox(x,y,w,m,frac,mine){
 const c=cx,d=S(m.id),h=mine?58:46;c.lineWidth=3;c.strokeStyle=OL;rr(x,y,w,h,12,'rgba(255,255,255,.95)');
 c.fillStyle=OL;c.textBaseline='middle';c.textAlign='left';c.font='800 14px system-ui,sans-serif';c.fillText(d.n,x+10,y+14);
 c.textAlign='right';c.font='700 12px system-ui,sans-serif';c.fillText('Lv.'+m.lv,x+w-10,y+14);
 if(m.st){const sw=34;c.fillStyle=m.st==='brn'?'#f0703a':'#e6b300';c.beginPath();c.roundRect?c.roundRect(x+w-52-sw,y+6,sw,16,6):c.rect(x+w-52-sw,y+6,sw,16);c.fill();c.fillStyle='#fff';c.font='700 10px system-ui';c.textAlign='center';c.fillText(STN[m.st],x+w-52-sw/2,y+14.5)}
 const bx=x+10,by=y+26,bw=w-20;c.lineWidth=2;rr(bx,by,bw,10,5,'#dcd8e8');const f=clamp(frac,0,1);
 if(f>0){c.beginPath();c.roundRect?c.roundRect(bx+1,by+1,Math.max(4,(bw-2)*f),8,4):c.rect(bx+1,by+1,(bw-2)*f,8);c.fillStyle=f>.5?'#45c46b':f>.2?'#f2b632':'#ef4b4b';c.fill()}
 if(mine){c.fillStyle=OL;c.font='700 11px system-ui';c.textAlign='right';c.fillText(`${Math.max(0,Math.round(f*maxHp(m)))} / ${maxHp(m)}`,x+w-10,y+46);
  const e0=m.lv**3,e1=(m.lv+1)**3;c.fillStyle='#dcd8e8';c.fillRect(x+10,y+43,bw*.5,5);c.fillStyle='#4d96ff';c.fillRect(x+10,y+43,bw*.5*clamp((m.exp-e0)/(e1-e0),0,1),5)}
}
function drawBattle(){
 const c=cx,f=B.fx,th=cur().theme,BH=Math.max(H-200,H*.5),sz=Math.min(W*.44,BH*.52,230);
 const g=c.createLinearGradient(0,0,0,H);
 if(th==='cave'){g.addColorStop(0,'#2e2536');g.addColorStop(.6,'#5d4f66');g.addColorStop(1,'#7d6d82')}
 else if(th==='snow'){g.addColorStop(0,'#9fd3ff');g.addColorStop(.5,'#e6f4ff');g.addColorStop(1,'#ffffff')}
 else{g.addColorStop(0,'#7fd0ff');g.addColorStop(.45,'#d8f5ff');g.addColorStop(.46,'#a6e38f');g.addColorStop(1,'#6fc66a')}
 c.fillStyle=g;c.fillRect(0,0,W,H);
 c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=3;for(let i=0;i<6;i++){const lx=((T*120+i*W/5)%(W+200))-100,ly=20+i*BH*.07;c.beginPath();c.moveTo(lx,ly);c.lineTo(lx+60,ly);c.stroke()}
 const mp={x:W*.27,y:BH*.98},fp={x:W*.73,y:BH*.56};if(f.evo)mp.x=W/2,mp.y=BH*.8;
 const pc=th==='cave'?'#4b3f55':th==='snow'?'#cfe6f7':'#58b25e';c.lineWidth=3;c.strokeStyle=OL;
 if(!f.evo){c.beginPath();c.ellipse(fp.x,fp.y,sz*.55,sz*.14,0,0,7);c.fillStyle=pc;c.fill();c.stroke()}
 c.beginPath();c.ellipse(mp.x,mp.y,sz*.62,sz*.15,0,0,7);c.fillStyle=pc;c.fill();c.stroke();
 if(f.fa>0&&f.fs>0)drawMon(c,B.foe.id,fp.x+f.fx,fp.y-f.fx*.3,sz*.9,T,{alpha:f.fa,sc:f.fs});
 if(f.ma>0&&f.ms>0)drawMon(c,B.me.id,mp.x+f.mx,mp.y-f.mx*.3,sz*1.1,T,{alpha:f.ma,sc:f.ms,flip:!f.evo});
 if(f.ball){const p=f.ball.p,bx=mp.x+(fp.x-mp.x)*p,by=mp.y-sz*.4+(fp.y-sz*.12-(mp.y-sz*.4))*p-Math.sin(p*Math.PI)*sz*.5,r=sz*.09;
  c.save();c.translate(bx,by);c.rotate(f.ball.sh*.5+p*6.283);c.lineWidth=3;c.strokeStyle=OL;const col={ball:'#ef4b4b',sball:'#4d96ff',uball:'#f2b632'}[f.ball.k];
  c.beginPath();c.arc(0,0,r,0,7);c.fillStyle='#fff';c.fill();c.beginPath();c.arc(0,0,r,Math.PI,0);c.closePath();c.fillStyle=col;c.fill();c.beginPath();c.arc(0,0,r,0,7);c.stroke();
  c.beginPath();c.moveTo(-r,0);c.lineTo(r,0);c.stroke();c.beginPath();c.arc(0,0,r*.3,0,7);c.fillStyle='#fff';c.fill();c.stroke();c.restore()}
 for(let i=f.parts.length-1;i>=0;i--){const p=f.parts[i],a=(T-p.t0)/.5;if(a>1){f.parts.splice(i,1);continue}const o=p.side?mp:fp;
  c.globalAlpha=1-a;for(let j=0;j<10;j++){const an=j*.628+p.t0,rd=a*sz*.5;c.beginPath();c.arc(o.x+Math.cos(an)*rd,o.y-sz*.35+Math.sin(an)*rd,sz*.06*(1-a*.5),0,7);c.fillStyle=j%2?p.c:'#fff';c.fill()}c.globalAlpha=1}
 if(!f.evo){const bw=Math.min(210,W*.5);hpBox(8,8,bw,B.foe,f.fh,false);hpBox(W-bw-8,BH-66,bw,B.me,f.mh,true);
  if(!B.o.wild){c.font='12px system-ui';c.textAlign='left';c.fillStyle=OL;let s='';for(let i=0;i<B.foes.length;i++)s+=i<B.fi?'○':'●';c.fillText(s,12,66)}}
 if(f.white>0){c.globalAlpha=f.white;c.fillStyle='#fff';c.fillRect(0,0,W,H);c.globalAlpha=1}
}
function drawTitle(){
 const c=cx,g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#6ec6ff');g.addColorStop(.6,'#d8f5ff');g.addColorStop(.61,'#a6e38f');g.addColorStop(1,'#6fc66a');c.fillStyle=g;c.fillRect(0,0,W,H);
 const fs=Math.min(56,W*.12);c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.font=`900 ${fs}px system-ui,sans-serif`;c.lineWidth=fs*.22;c.strokeStyle=OL;c.strokeText('몬스터 트레일',W/2,H*.2);c.fillStyle='#ffd23f';c.fillText('몬스터 트레일',W/2,H*.2);
 c.font=`700 ${Math.max(13,fs*.3)}px system-ui,sans-serif`;c.fillStyle=OL;c.fillText('탐험 · 포획 · 배틀 RPG  v1',W/2,H*.2+fs*.9);
 const sz=Math.min(W*.3,H*.26,170);[1,4,7].forEach((id,i)=>drawMon(c,id,W*(.2+i*.3),H*.58+Math.abs(Math.sin(T*2.5+i))*-14,sz,T,{flip:i===0}));
}
/* ================= 메인 루프 / 입력 ================= */
function resize(){const r=$('#stage').getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(200,r.width);H=Math.max(200,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);TS=W<560?40:48}
let last=0;
function loop(ts){
 const dt=Math.min(50,ts-last);last=ts;T=ts/1000;updTweens(dt);
 if(mode==='world')updWorld(dt);
 cx.setTransform(DPR,0,0,DPR,0,0);
 if(mode==='title')drawTitle();else if(mode==='battle'&&B)drawBattle();else if(G)drawWorld();
 if(FX.fade>0){cx.globalAlpha=FX.fade;cx.fillStyle='#000';cx.fillRect(0,0,W,H);cx.globalAlpha=1}
 requestAnimationFrame(loop);
}
function action(){if(sayRes){sayRes();return}if(chooser){chooser.pick();return}if(mode==='world'&&!busy)interact()}
function cancel(){if(chooser){chooser.cancel();return}if(sayRes){sayRes();return}if(mode==='world'&&!busy&&!P.mv)run(openMenu)}
function press(d){if(chooser){chooser.move(d);return}const i=held.indexOf(d);if(i>=0)held.splice(i,1);held.push(d);tap=d}
function release(d){const i=held.indexOf(d);if(i>=0)held.splice(i,1)}
const KEY={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
addEventListener('keydown',e=>{const d=KEY[e.key];if(d){e.preventDefault();if(!e.repeat||chooser)press(d);return}
 if(e.repeat)return;if(['z','Z','Enter',' '].includes(e.key)){e.preventDefault();action()}else if(['x','X','Escape','Backspace'].includes(e.key)){e.preventDefault();cancel()}});
addEventListener('keyup',e=>{const d=KEY[e.key];if(d)release(d)});
addEventListener('blur',()=>{held.length=0});
$('#stage').addEventListener('click',()=>{if(sayRes)sayRes()});
$('#mbtn').addEventListener('click',e=>{e.stopPropagation();cancel()});
document.querySelectorAll('#pad .d').forEach(b=>{const d=b.dataset.d;
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');press(d)});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{b.classList.remove('on');release(d)}))});
$('#ba').addEventListener('pointerdown',e=>{e.preventDefault();action()});
$('#bb').addEventListener('pointerdown',e=>{e.preventDefault();cancel()});
document.addEventListener('contextmenu',e=>e.preventDefault());
if(('ontouchstart' in window)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches))document.body.classList.add('touch');
addEventListener('resize',resize);
/* ================= 타이틀 ================= */
async function title(){
 mode='title';setHud(0);
 while(true){
  const hs=hasSave(),opts=hs?[{label:'▶ 이어하기'},{label:'✨ 새 게임',sub:'저장 데이터를 지우고 시작'}]:[{label:'✨ 새 게임 시작'}];
  const i=await choose(opts,{cancel:false,cols:1});
  if(hs&&i===0){if(load())break;continue}
  if(hs){dlg.textContent='저장된 데이터를 지우고 새로 시작할까요?';dlg.classList.remove('tap');dlg.style.display='block';const y=await choose([{label:'네, 새로 시작'},{label:'아니요'}],{cancel:false});hideDlg();if(y!==0)continue}
  newGame();break;
 }
 await tw(FX,'fade',1,250);place();mode='world';banner=T;setHud(1);await tw(FX,'fade',0,250);
 if(!G.party.length&&!G.flags.intro){G.flags.intro=1;run(()=>talk(['새벽마을의 아침이 밝았다!','오늘은 드디어 첫 몬스터를 받는 날.\n오른쪽 위의 「연구소」 문으로 들어가 보자!']))}
}
resize();requestAnimationFrame(loop);title();
window.GAME={get G(){return G},get B(){return B},P,MAPS,mk,addMon,battle,run,place,save};
