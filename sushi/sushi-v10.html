<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>냠냠 스시 🍣</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#fff4e6;}
  canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// ───────────────────────── 기본 세팅 ─────────────────────────
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = "'Nunito','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif";
let W = 0, H = 0, DPR = 1, U = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.max(0.6, Math.min(1.3, Math.min(W, H) / 560));
}
window.addEventListener('resize', resize);
resize();

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const won = n => n.toLocaleString('ko-KR') + '원';

// ───────────────────────── 사운드 (Web Audio) ─────────────────────────
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'sine', v = 0.2, slide = 0, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d);
}
const SFX = {
  eat()   { tone(520, 0.08, 'square', 0.1); tone(780, 0.1, 'square', 0.1, 0, 0.07); },
  bad()   { tone(220, 0.3, 'sawtooth', 0.12, -150); },
  coin()  { tone(1000, 0.08, 'sine', 0.15); tone(1500, 0.18, 'sine', 0.15, 0, 0.08); },
  pop()   { tone(380, 0.07, 'triangle', 0.15, 320); },
  serve() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'triangle', 0.13, 0, i * 0.06)); },
  angry() { tone(160, 0.35, 'square', 0.1, -80); tone(120, 0.3, 'square', 0.1, -60, 0.15); },
  over()  { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.35, 'triangle', 0.14, 0, i * 0.22)); },
  tea()   { tone(600, 0.25, 'sine', 0.12, 250); },
  combo() { [660, 880, 1320].forEach((f, i) => tone(f, 0.1, 'square', 0.08, 0, i * 0.05)); },
  click() { tone(700, 0.05, 'triangle', 0.1); },
};

// ───────────────────────── 초밥 데이터 ─────────────────────────
const SUSHI = [
  { id: 'maki',   name: '김밥롤', price: 1200, pts: 10, fill: 10, plate: '#8ce99a' },
  { id: 'tamago', name: '계란',   price: 1500, pts: 12, fill: 8,  plate: '#ffe066' },
  { id: 'ebi',    name: '새우',   price: 2000, pts: 16, fill: 9,  plate: '#74c0fc' },
  { id: 'salmon', name: '연어',   price: 2500, pts: 20, fill: 10, plate: '#ffa94d' },
  { id: 'tuna',   name: '참치',   price: 3000, pts: 26, fill: 11, plate: '#ff6b81' },
  { id: 'unagi',  name: '장어',   price: 4000, pts: 36, fill: 12, plate: '#b197fc' },
  // 사이드
  { id: 'karaage',  name: '가라아게', price: 2200, pts: 18, fill: 14, plate: '#ffd8a8', cat: 'side' },
  { id: 'takoyaki', name: '타코야키', price: 2000, pts: 17, fill: 12, plate: '#c3fae8', cat: 'side' },
  // 디저트 (배부름이 거의 안 차는 '디저트 배')
  { id: 'babyshu',  name: '베이비 슈', price: 1800, pts: 18, fill: 3, plate: '#fcc2d7', cat: 'dessert' },
  { id: 'pudding',  name: '푸딩',     price: 2000, pts: 20, fill: 4, plate: '#d0bfff', cat: 'dessert' },
  // 주문판 전용 메뉴 (벨트에 안 돌고, 사장님이 직접 만들어 줌)
  { id: 'ebifry',   name: '새우튀김', price: 2500, pts: 20, fill: 13, plate: '#ffe8cc', cat: 'side', orderOnly: true },
  { id: 'hirame',   name: '광어',     price: 2800, pts: 24, fill: 10, plate: '#dee2e6', orderOnly: true },
  { id: 'tako',     name: '문어',     price: 2600, pts: 22, fill: 10, plate: '#eebefa', orderOnly: true },
  { id: 'ikura',    name: '연어알 군함', price: 3500, pts: 30, fill: 10, plate: '#ff8787', orderOnly: true },
];
const BELT_MENU = SUSHI.filter(d => !d.orderOnly); // 벨트·사장 모드 메뉴
const MENU_KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
const CHEAPEST = Math.min(...SUSHI.map(s => s.price));

// ───────────────────────── 그리기 헬퍼 ─────────────────────────
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function text(str, x, y, size, color = '#444', align = 'center', weight = '800', base = 'middle') {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(str, x, y);
}
function textO(str, x, y, size, color, outline, align = 'center', weight = '900') {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.18; ctx.strokeStyle = outline;
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}

// 초밥 그리기 (y = 접시 중심)
function drawSushi(x, y, s, id, opt = {}) {
  const def = SUSHI.find(d => d.id === id);
  const plateCol = opt.plate || (def ? def.plate : '#e9ecef');
  // 접시
  if (!opt.noPlate) {
    ctx.fillStyle = 'rgba(0,0,0,0.08)'; ell(x, y + s * 0.08, s * 0.82, s * 0.3); ctx.fill();
    ctx.fillStyle = plateCol; ell(x, y, s * 0.8, s * 0.3); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ell(x, y, s * 0.62, s * 0.2); ctx.stroke();
  }
  if (opt.empty) return;

  if (id === 'wasabi') {
    ctx.fillStyle = '#7cc242'; circ(x, y - s * 0.25, s * 0.26); ctx.fill();
    ctx.fillStyle = '#9ad45e'; circ(x - s * 0.05, y - s * 0.42, s * 0.14); ctx.fill();
    // 화난 얼굴
    ctx.strokeStyle = '#2d5016'; ctx.lineWidth = s * 0.04; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - s * 0.16, y - s * 0.34); ctx.lineTo(x - s * 0.05, y - s * 0.29); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + s * 0.16, y - s * 0.34); ctx.lineTo(x + s * 0.05, y - s * 0.29); ctx.stroke();
    ctx.fillStyle = '#2d5016'; circ(x - s * 0.09, y - s * 0.24, s * 0.035); ctx.fill(); circ(x + s * 0.09, y - s * 0.24, s * 0.035); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y - s * 0.1, s * 0.07, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    return;
  }
  if (id === 'tea') {
    ctx.fillStyle = '#3f8f5f'; rr(x - s * 0.26, y - s * 0.6, s * 0.52, s * 0.55, s * 0.08); ctx.fill();
    ctx.fillStyle = '#5bb27a'; rr(x - s * 0.26, y - s * 0.6, s * 0.52, s * 0.12, s * 0.06); ctx.fill();
    ctx.fillStyle = '#c3e9c0'; ell(x, y - s * 0.6, s * 0.22, s * 0.07); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = s * 0.03;
    for (let i = -1; i <= 1; i++) {
      const sx = x + i * s * 0.12, wob = Math.sin(tGlobal * 3 + i) * s * 0.03;
      ctx.beginPath(); ctx.moveTo(sx, y - s * 0.68); ctx.quadraticCurveTo(sx + wob, y - s * 0.8, sx, y - s * 0.92); ctx.stroke();
    }
    ctx.fillStyle = '#2d5016'; circ(x - s * 0.1, y - s * 0.36, s * 0.03); ctx.fill(); circ(x + s * 0.1, y - s * 0.36, s * 0.03); ctx.fill();
    ctx.strokeStyle = '#2d5016'; ctx.beginPath(); ctx.arc(x, y - s * 0.3, s * 0.06, 0.2, Math.PI - 0.2); ctx.stroke();
    return;
  }
  if (id === 'coin') {
    const bob = Math.sin(tGlobal * 5 + x) * s * 0.03;
    ctx.fillStyle = '#f0b429'; circ(x, y - s * 0.3 + bob, s * 0.3); ctx.fill();
    ctx.fillStyle = '#ffd43b'; circ(x, y - s * 0.34 + bob, s * 0.28); ctx.fill();
    ctx.strokeStyle = '#f0b429'; ctx.lineWidth = s * 0.03; circ(x, y - s * 0.34 + bob, s * 0.2); ctx.stroke();
    text('₩', x, y - s * 0.33 + bob, s * 0.28, '#b8860b');
    return;
  }
  if (id === 'babyshu') { // 베이비 슈 2개
    for (const dx of [-0.26, 0.26]) {
      const cx = x + dx * s, cy = y - s * 0.3, r = s * 0.24;
      ctx.fillStyle = '#d9a066'; circ(cx, cy + r * 0.25, r); ctx.fill();
      ctx.fillStyle = '#fff'; ell(cx, cy - r * 0.1, r * 1.05, r * 0.3); ctx.fill();
      ctx.fillStyle = '#e8b074'; circ(cx, cy - r * 0.45, r * 0.85); ctx.fill();
      ctx.fillStyle = '#f3c88f'; circ(cx - r * 0.25, cy - r * 0.65, r * 0.35); ctx.fill();
      ctx.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { circ(cx - r * 0.5 + i * r * 0.33, cy - r * 0.9 + (i % 2) * r * 0.15, r * 0.06); ctx.fill(); }
    }
  } else if (id === 'pudding') { // 푸딩 + 체리
    const cy = y - s * 0.12;
    ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.moveTo(x - s * 0.38, cy); ctx.lineTo(x + s * 0.38, cy); ctx.lineTo(x + s * 0.3, cy - s * 0.5); ctx.lineTo(x - s * 0.3, cy - s * 0.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8a5a3c'; ctx.beginPath(); ctx.moveTo(x - s * 0.3, cy - s * 0.5); ctx.lineTo(x + s * 0.3, cy - s * 0.5); ctx.lineTo(x + s * 0.33, cy - s * 0.3); ctx.quadraticCurveTo(x + s * 0.1, cy - s * 0.2, x, cy - s * 0.32); ctx.quadraticCurveTo(x - s * 0.15, cy - s * 0.18, x - s * 0.33, cy - s * 0.3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#6b4226'; ell(x, cy - s * 0.5, s * 0.3, s * 0.08); ctx.fill();
    ctx.fillStyle = '#e03131'; circ(x + s * 0.02, cy - s * 0.58, s * 0.07); ctx.fill();
    ctx.strokeStyle = '#2b8a3e'; ctx.lineWidth = s * 0.02; ctx.beginPath(); ctx.moveTo(x + s * 0.02, cy - s * 0.64); ctx.quadraticCurveTo(x + s * 0.08, cy - s * 0.74, x + s * 0.12, cy - s * 0.72); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ell(x - s * 0.2, cy - s * 0.25, s * 0.05, s * 0.12); ctx.fill();
  } else if (id === 'karaage') { // 가라아게 + 레몬
    for (const [dx, dy, r] of [[-0.25, -0.28, 0.22], [0.12, -0.36, 0.2], [0.28, -0.14, 0.19], [-0.05, -0.1, 0.17]]) {
      ctx.fillStyle = '#c47a2c'; circ(x + dx * s, y + dy * s, r * s); ctx.fill();
      ctx.fillStyle = '#e09a4a'; circ(x + dx * s - r * s * 0.2, y + dy * s - r * s * 0.25, r * s * 0.5); ctx.fill();
      ctx.fillStyle = '#9c5a1e'; circ(x + dx * s + r * s * 0.3, y + dy * s + r * s * 0.2, r * s * 0.15); ctx.fill();
    }
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.moveTo(x - s * 0.55, y - s * 0.05); ctx.arc(x - s * 0.55, y - s * 0.05, s * 0.18, -Math.PI * 0.5, Math.PI * 0.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff3bf'; ctx.beginPath(); ctx.moveTo(x - s * 0.55, y - s * 0.05); ctx.arc(x - s * 0.55, y - s * 0.05, s * 0.12, -Math.PI * 0.5, Math.PI * 0.5); ctx.closePath(); ctx.fill();
  } else if (id === 'takoyaki') { // 타코야키 3개
    for (const dx of [-0.3, 0, 0.3]) {
      const cx = x + dx * s, cy = y - s * 0.28, r = s * 0.17;
      ctx.fillStyle = '#c98a3e'; circ(cx, cy, r); ctx.fill();
      ctx.fillStyle = '#e8a85a'; circ(cx - r * 0.25, cy - r * 0.3, r * 0.45); ctx.fill();
      ctx.strokeStyle = '#5a2d0c'; ctx.lineWidth = r * 0.22; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx - r * 0.7, cy - r * 0.3); ctx.quadraticCurveTo(cx, cy + r * 0.1, cx + r * 0.7, cy - r * 0.4); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.12; ctx.beginPath(); ctx.moveTo(cx - r * 0.6, cy + r * 0.1); ctx.lineTo(cx + r * 0.6, cy - r * 0.1); ctx.stroke();
      ctx.fillStyle = '#2b8a3e'; circ(cx + r * 0.3, cy + r * 0.4, r * 0.1); ctx.fill(); circ(cx - r * 0.4, cy + r * 0.5, r * 0.08); ctx.fill();
      ctx.fillStyle = '#d9a066'; ell(cx + r * 0.1, cy - r * 0.85, r * 0.3, r * 0.12); ctx.fill();
    }
  } else if (id === 'ebifry') { // 새우튀김 2개
    for (const [dx, dy, ang] of [[-0.12, -0.22, -0.35], [0.14, -0.38, -0.3]]) {
      ctx.save(); ctx.translate(x + dx * s, y + dy * s); ctx.rotate(ang);
      ctx.fillStyle = '#e0a048'; rr(-s * 0.4, -s * 0.13, s * 0.7, s * 0.26, s * 0.12); ctx.fill();
      ctx.fillStyle = '#f2c070'; for (let i = 0; i < 5; i++) { circ(-s * 0.3 + i * s * 0.13, -s * 0.04 + (i % 2) * s * 0.07, s * 0.045); ctx.fill(); }
      ctx.fillStyle = '#ff7a7a'; ctx.beginPath(); ctx.moveTo(s * 0.28, 0); ctx.lineTo(s * 0.48, -s * 0.18); ctx.lineTo(s * 0.5, s * 0.14); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#5bb85d'; ell(x - s * 0.45, y - s * 0.12, s * 0.12, s * 0.07); ctx.fill();
  } else if (id === 'ikura') { // 연어알 군함
    ctx.fillStyle = '#2f2f2f'; rr(x - s * 0.4, y - s * 0.62, s * 0.8, s * 0.6, s * 0.1); ctx.fill();
    ctx.fillStyle = '#fff'; rr(x - s * 0.34, y - s * 0.3, s * 0.68, s * 0.24, s * 0.06); ctx.fill();
    ctx.fillStyle = '#ff7b2b';
    for (let i = 0; i < 9; i++) { const ox = x - s * 0.3 + (i % 5) * s * 0.15 + (i >= 5 ? s * 0.07 : 0), oy = y - s * 0.62 + (i >= 5 ? s * 0.13 : 0); circ(ox, oy, s * 0.075); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; for (let i = 0; i < 9; i++) { const ox = x - s * 0.3 + (i % 5) * s * 0.15 + (i >= 5 ? s * 0.07 : 0), oy = y - s * 0.62 + (i >= 5 ? s * 0.13 : 0); circ(ox - s * 0.025, oy - s * 0.025, s * 0.025); ctx.fill(); }
  } else if (id === 'maki') {
    for (const dx of [-0.26, 0.26]) {
      const cx = x + dx * s, cy = y - s * 0.28, r = s * 0.25;
      ctx.fillStyle = '#2f2f2f'; circ(cx, cy, r); ctx.fill();
      ctx.fillStyle = '#fff'; circ(cx, cy, r * 0.74); ctx.fill();
      ctx.fillStyle = '#5bb85d'; circ(cx - r * 0.15, cy, r * 0.3); ctx.fill();
      ctx.fillStyle = '#ff9eb5'; circ(cx + r * 0.25, cy - r * 0.1, r * 0.18); ctx.fill();
      ctx.fillStyle = '#ffd43b'; circ(cx + r * 0.15, cy + r * 0.28, r * 0.14); ctx.fill();
    }
  } else {
    // 밥
    ctx.fillStyle = '#fff'; rr(x - s * 0.45, y - s * 0.44, s * 0.9, s * 0.42, s * 0.15); ctx.fill();
    ctx.strokeStyle = '#e6e6e6'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#f0f0f0';
    circ(x - s * 0.25, y - s * 0.3, s * 0.03); ctx.fill(); circ(x + s * 0.3, y - s * 0.12, s * 0.03); ctx.fill();
    const ty = y - s * 0.55;
    if (id === 'hirame') { // 광어 (희고 반투명)
      ctx.fillStyle = '#f4f1ec'; rr(x - s * 0.52, ty - s * 0.1, s * 1.04, s * 0.28, s * 0.1); ctx.fill();
      ctx.strokeStyle = '#d9d4cc'; ctx.lineWidth = s * 0.03;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x + i * s * 0.3 - s * 0.08, ty - s * 0.06); ctx.lineTo(x + i * s * 0.3 + s * 0.06, ty + s * 0.14); ctx.stroke(); }
      ctx.fillStyle = '#c9b9a6'; rr(x - s * 0.52, ty + s * 0.1, s * 1.04, s * 0.08, s * 0.04); ctx.fill();
      ctx.fillStyle = '#5bb85d'; circ(x + s * 0.3, ty - s * 0.1, s * 0.05); ctx.fill();
    } else if (id === 'tako') { // 문어 (흰 살 + 보라 가장자리 + 빨판)
      ctx.fillStyle = '#8e5aa8'; rr(x - s * 0.52, ty - s * 0.14, s * 1.04, s * 0.32, s * 0.1); ctx.fill();
      ctx.fillStyle = '#fbf6ff'; rr(x - s * 0.5, ty - s * 0.08, s * 1.0, s * 0.22, s * 0.08); ctx.fill();
      ctx.fillStyle = '#b388c9'; for (let i = 0; i < 4; i++) { circ(x - s * 0.36 + i * s * 0.24, ty - s * 0.1, s * 0.035); ctx.fill(); }
      ctx.fillStyle = '#2b2b2b'; rr(x - s * 0.07, ty - s * 0.16, s * 0.14, s * 0.6, s * 0.03); ctx.fill();
    } else if (id === 'tuna') {
      ctx.fillStyle = '#e8505b'; rr(x - s * 0.52, ty - s * 0.1, s * 1.04, s * 0.28, s * 0.1); ctx.fill();
      ctx.strokeStyle = '#f59aa0'; ctx.lineWidth = s * 0.035;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x + i * s * 0.28 - s * 0.06, ty - s * 0.05); ctx.lineTo(x + i * s * 0.28 + s * 0.08, ty + s * 0.12); ctx.stroke(); }
    } else if (id === 'salmon') {
      ctx.fillStyle = '#ff9f68'; rr(x - s * 0.52, ty - s * 0.1, s * 1.04, s * 0.28, s * 0.1); ctx.fill();
      ctx.strokeStyle = '#ffe0d0'; ctx.lineWidth = s * 0.04;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x + i * s * 0.3 - s * 0.1, ty - s * 0.06); ctx.quadraticCurveTo(x + i * s * 0.3 + s * 0.02, ty + s * 0.03, x + i * s * 0.3 + s * 0.1, ty + s * 0.14); ctx.stroke(); }
    } else if (id === 'ebi') {
      ctx.fillStyle = '#ffb4b4'; rr(x - s * 0.5, ty - s * 0.1, s * 0.92, s * 0.28, s * 0.12); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = s * 0.045;
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x + i * s * 0.25 - s * 0.08, ty - s * 0.08); ctx.lineTo(x + i * s * 0.25, ty + s * 0.04); ctx.lineTo(x + i * s * 0.25 - s * 0.08, ty + s * 0.16); ctx.stroke(); }
      ctx.fillStyle = '#ff7a7a';
      ctx.beginPath(); ctx.moveTo(x + s * 0.4, ty + s * 0.02); ctx.lineTo(x + s * 0.62, ty - s * 0.22); ctx.lineTo(x + s * 0.66, ty + s * 0.1); ctx.closePath(); ctx.fill();

const DAY_LEN = 120; // 하루 영업 시간(초)

function spawnCustomer(g, seat) {

  seat.cust = { want: pick(BELT_MENU).id, patience: maxP, maxP, state: 'wait', leaveT: 0, hair: pick(HAIRS), shirt: pick(SHIRTS), seed: Math.random() * 10, cap: Math.random() < 0.3 ? pick(SHIRTS) : null };
}
function updBoss(g, dt) {
  if (g.over || g.dayOver) return;
  g.time += dt; g.dayT += dt;
  if (g.dayT >= DAY_LEN) { endDay(g); return; }
  const speed = Math.min(230, 75 + g.time * 1.6) * U; g.speed = speed;
  // 손님 스폰

    g.spawnT = clamp(4.5 - g.time * 0.035, 1.6, 4.5) * rnd(0.8, 1.2);
  }
  // 벨트 이동
  for (const it of g.items) { it.x += speed * dt; if (it.x > W + g.s) { it.x = -g.s; it.loops++; } }
  const stale = g.items.filter(it => it.loops >= 2);
  for (const it of stale) { g.score = Math.max(0, g.score - 100); g.wasted++; g.dayWasted++; addPop(g, g.s, g.plateY - g.s, '폐기 -100 🗑️', '#868e96', 16); }
  g.items = g.items.filter(it => it.loops < 2);
  // 손님 처리
  for (const st of g.seats) {
    const c = st.cust; if (!c) continue;
    if (c.state === 'wait') {
      c.patience -= dt;
      const hit = g.items.find(it => it.type === c.want && Math.abs(it.x - st.x) < 15 * U && !it.taken);
      if (hit) {
        hit.taken = true; g.items = g.items.filter(i => i !== hit);
        const def = SUSHI.find(d => d.id === c.want);
        const bonus = Math.round(c.patience / c.maxP * 10) * 100;
        g.combo++; const gain = Math.round((def.price + bonus) * comboMult(g.combo) / 100) * 100;
        g.score += gain; g.served++; g.dayServed++; g.dayEarned += gain;
        addPop(g, st.x, g.seatY - g.seatR * 2.2, '+' + gain.toLocaleString(), '#f59f00');
        addSpark(g, st.x, g.seatY, 8, '#ffd43b');
        c.state = 'happy'; c.leaveT = 1.3; SFX.serve();
        g.chefMood = 'happy'; g.chefT = 1;
      } else if (c.patience <= 0) {
        c.state = 'angry'; c.leaveT = 1.4; g.lives--; g.dayAngry++; g.combo = 0; g.shake = 0.3; SFX.angry();
        addPop(g, st.x, g.seatY - g.seatR * 2.2, '화났어요! 💢', '#e03131', 18);
        g.chefMood = 'sad'; g.chefT = 1.2;

  }
  if (g.cooldown > 0) g.cooldown -= dt;
  if (g.chefT > 0) { g.chefT -= dt; if (g.chefT <= 0) g.chefMood = 'idle'; }
  for (const p of g.pops) p.t -= dt, p.y -= 45 * U * dt;
  g.pops = g.pops.filter(p => p.t > 0);
  for (const s of g.sparks) { s.t -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 400 * U * dt; }
  g.sparks = g.sparks.filter(s => s.t > 0);
  if (g.shake > 0) g.shake -= dt;
}

  g.btnRetry = { x: px + 20 * U, y: py + ph - 70 * U, w: pw / 2 - 30 * U, h: 50 * U };
  g.btnMenu = { x: W / 2 + 10 * U, y: py + ph - 70 * U, w: pw / 2 - 30 * U, h: 50 * U };
  drawBtn(g.btnRetry, '다시하기', '#ff8787', 18 * U);
  drawBtn(g.btnMenu, '메뉴로', '#adb5bd', 18 * U);
}
let titleBtns = {};
function drawTitle() {
  drawBG();
  // 떠다니는 초밥
  const deco = ['tuna', 'salmon', 'ebi', 'babyshu', 'tamago', 'unagi', 'maki', 'pudding'];
  deco.forEach((id, i) => {
    const x = (W * (i + 0.5) / deco.length), y = H * 0.12 + Math.sin(tGlobal * 1.5 + i) * 12 * U;
    drawSushi(x, y, Math.min(46 * U, W / deco.length * 0.5), id);
  });
  textO('냠냠 스시', W / 2, H * 0.3, Math.min(56 * U, W * 0.14), '#ff6b6b', '#fff');
  text('🍣 귀여운 회전초밥 게임 🍣', W / 2, H * 0.3 + 44 * U, 16 * U, '#8d6e63');
  const bw = Math.min(320 * U, W - 40), bh = 68 * U, bx = W / 2 - bw / 2;
  titleBtns.customer = { x: bx, y: H * 0.44, w: bw, h: bh };
  titleBtns.boss = { x: bx, y: H * 0.44 + bh + 22 * U, w: bw, h: bh };
  drawBtn(titleBtns.customer, '🍴 손님 모드', '#ff8787', 22 * U, `최고 ${best.customer.toLocaleString()}점 · 벨트 초밥을 탭해서 먹기`);
  drawBtn(titleBtns.boss, '👨‍🍳 사장 모드', '#5c7cfa', 22 * U, `최고 ${best.boss.toLocaleString()}원 · 주문대로 만들어 올리기`);
  // 캐릭터 둘
  const r = Math.min(46 * U, W * 0.1);
  drawChar(W * 0.18, H * 0.82, r, 'happy', { hair: '#4a3528', shirt: '#ff8787', seed: 1 });
  drawChar(W * 0.82, H * 0.82, r, 'happy', { hair: '#1f1f1f', shirt: '#fff', chef: true, seed: 2 });
  text('벨트 접시 탭 → 테이블로  ·  테이블 접시 탭(1~3) → 젓가락으로 냄!', W / 2, H - 22 * U, 12 * U, '#adb5bd');
}

// ───────────────────────── 입력 ─────────────────────────
function startGame(mode) {
  audio(); SFX.click();
  game = mode === 'customer' ? newCustomerGame() : newBossGame();
  scene = mode;
}
function onTap(x, y) {
  audio();
  if (scene === 'title') {
    if (inBtn(titleBtns.customer, x, y)) startGame('customer');
    else if (inBtn(titleBtns.boss, x, y)) startGame('boss');
    return;
  }
  const g = game; if (!g) return;
  if (g.orderOpen) {
    const b = g.orderBtns && g.orderBtns.find(b => inBtn(b, x, y));
    if (b) placeOrder(g, b.id);
    else if (g.orderClose && inBtn(g.orderClose, x, y)) { g.orderOpen = false; SFX.click(); }
    return;
  }
  if (g.paying) {
    if (g.btnCard && inBtn(g.btnCard, x, y)) payWith(g, 'card');
    else if (g.btnCash && inBtn(g.btnCash, x, y)) payWith(g, 'cash');
    else if (g.btnDone && inBtn(g.btnDone, x, y)) finishMeal(g);
    return;
  }
  if (g.dayOver) { if (g.btnNext && inBtn(g.btnNext, x, y)) startNextDay(g); else if (inBtn(g.menuBtn, x, y)) { scene = 'title'; game = null; } return; }
  if (g.over) {
    if (g.btnRetry && inBtn(g.btnRetry, x, y)) startGame(g.mode);
    else if (g.btnMenu && inBtn(g.btnMenu, x, y)) { scene = 'title'; game = null; SFX.click(); }
    return;
  }
  if (inBtn(g.menuBtn, x, y)) { scene = 'title'; game = null; SFX.click(); return; }
  if (scene === 'customer' && g.doneBtn && inBtn(g.doneBtn, x, y)) { startPay(g); return; }
  if (scene === 'customer' && g.orderBtn && inBtn(g.orderBtn, x, y)) { if (g.order) { SFX.bad(); addPop(g, g.chefX, g.chefY - g.chefR * 1.8, '만드는 중이에요!', '#868e96', 14); } else { g.orderOpen = true; SFX.click(); } return; }
  if (scene === 'customer') tapCustomer(g, x, y);
  else if (scene === 'boss') {
    const b = g.btns.find(b => inBtn(b, x, y));
    if (b) makeSushi(g, b.idx);
  }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  onTap(e.clientX - r.left, e.clientY - r.top);
});
window.addEventListener('keydown', e => {
  if (scene === 'boss' && game && !game.over && MENU_KEYS.includes(e.key)) { const idx = MENU_KEYS.indexOf(e.key); if (idx < BELT_MENU.length) { audio(); makeSushi(game, idx); } }
  if (scene === 'customer' && game && !game.over && e.key >= '1' && e.key <= '3') { audio(); eatSlot(game, +e.key - 1); }
  if (scene === 'customer' && game && !game.over && e.key >= '4' && e.key <= '6') { audio(); useSide(game, ['soup', 'wasabi', 'garlic'][+e.key - 4]); }
  if (e.key === 'Escape' && game && game.orderOpen) { game.orderOpen = false; return; }
  if (e.key === 'Escape' && game) { scene = 'title'; game = null; }
  if (game && game.paying) { if (e.key === 'Enter' && game.btnDone) finishMeal(game); return; }
  if (scene === 'customer' && game && !game.over && e.key === 'Enter') { startPay(game); return; }
  if ((e.key === 'Enter' || e.key === ' ') && game && game.over) startGame(game.mode);
  else if ((e.key === 'Enter' || e.key === ' ') && game && game.dayOver) startNextDay(game);
});

// ───────────────────────── 루프 ─────────────────────────
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts; tGlobal += dt;
  if (scene === 'customer') { updCustomer(game, dt); drawCustomer(game); }
  else if (scene === 'boss') { updBoss(game, dt); drawBoss(game); }
  else drawTitle();
  requestAnimationFrame(loop);
}
drawTitle();
requestAnimationFrame(loop);
</script>
