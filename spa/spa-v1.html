/* ================= 3D 투영 코어 ================= */
cam.pitch=0;
function toCam(p){const dx=p[0]-cam.x,dz=p[2]-cam.z,c=Math.cos(cam.yaw),s=Math.sin(cam.yaw);const rx=dx*c-dz*s,rz=dx*s+dz*c,ry=p[1]-cam.h;const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);return[rx,ry*cp-rz*sp,ry*sp+rz*cp];}
function proj(c){const k=F/c[2];return[W/2+c[0]*k,HZ-c[1]*k,k];}
function clipNear(poly){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],ina=a[2]>NEAR,inb=b[2]>NEAR;if(ina)out.push(a);if(ina!==inb){const t=(NEAR-a[2])/(b[2]-a[2]);out.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t),NEAR]);}}return out;}
function poly3(pts,fill,stroke,lw){const c=clipNear(pts.map(toCam));if(c.length<3)return null;const s=c.map(proj);ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}return s;}
function line3(a,b,col,lw){let A=toCam(a),B=toCam(b);if(A[2]<=NEAR&&B[2]<=NEAR)return;if(A[2]<=NEAR){const t=(NEAR-A[2])/(B[2]-A[2]);A=[lerp(A[0],B[0],t),lerp(A[1],B[1],t),NEAR];}if(B[2]<=NEAR){const t=(NEAR-B[2])/(A[2]-B[2]);B=[lerp(B[0],A[0],t),lerp(B[1],A[1],t),NEAR];}const p=proj(A),q=proj(B);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.strokeStyle=col;ctx.lineWidth=lw||1;ctx.stroke();}
function pt3(p){const c=toCam(p);if(c[2]<=NEAR)return null;return proj(c);}
/* 벽 위의 지역 좌표 → 월드 좌표 (wall: N(+z) S(-z) E(+x) W(-x), u: -1..1 along wall, y: 높이) */
function wallPt(S,wall,u,y){switch(wall){case'N':return[u*S,y,S];case'S':return[-u*S,y,-S];case'E':return[S,y,-u*S];case'W':return[-S,y,u*S];}}
function wallQuad(S,wall,u0,u1,y0,y1){return[wallPt(S,wall,u0,y0),wallPt(S,wall,u1,y0),wallPt(S,wall,u1,y1),wallPt(S,wall,u0,y1)];}
function wallFacing(wall){/* 벽이 카메라 정면에 가까울수록 밝게 */const dir={N:0,E:Math.PI/2,S:Math.PI,W:-Math.PI/2}[wall];return .78+.22*Math.cos(cam.yaw-dir);}

/* ================= 방 렌더링 ================= */
function drawRoom(R,t){
  const S=R.S,ch=R.ch;
  // 천장
  const cg=ctx.createLinearGradient(0,0,0,HZ);cg.addColorStop(0,shade(R.ceil,.75));cg.addColorStop(1,R.ceil);
  poly3([[-S,ch,-S],[S,ch,-S],[S,ch,S],[-S,ch,S]],cg);
  // 바닥
  const fg=ctx.createLinearGradient(0,HZ,0,H);fg.addColorStop(0,R.floor[1]);fg.addColorStop(1,R.floor[0]);
  poly3([[-S,0,-S],[S,0,-S],[S,0,S],[-S,0,S]],fg);
  // 바닥 패턴
  if(R.style==='wood'||R.style==='clay'){const n=Math.ceil(S*2/.6);for(let i=0;i<=n;i++){const x=-S+i*.6;line3([x,0,-S],[x,0,S],'rgba(0,0,0,.13)',1.2);}for(let i=0;i<=n;i++){const z=-S+i*.6;line3([-S,0,z],[S,0,z],'rgba(0,0,0,.07)',1);}}
  if(R.style==='stone'){for(let i=0;i<34;i++){const x=(seeded(i)*2-1)*S*.9,z=(seeded(i+50)*2-1)*S*.9,w=.3+seeded(i+90)*.35;poly3([[x-w,0.001,z-w*.7],[x+w,0.001,z-w*.7],[x+w*.9,0.001,z+w*.7],[x-w*.9,0.001,z+w*.7]],`rgba(0,0,0,${.12+seeded(i+7)*.12})`);}}
  if(R.style==='salt'){for(let i=0;i<60;i++){const x=(seeded(i)*2-1)*S*.95,z=(seeded(i+80)*2-1)*S*.95,w=.06+seeded(i+9)*.1;poly3([[x-w,.001,z-w],[x+w,.001,z-w],[x+w,.001,z+w],[x-w,.001,z+w]],`rgba(255,255,255,${.4+.4*Math.abs(Math.sin(t*2+i))})`);}}
  if(R.style==='ice'){for(let i=0;i<14;i++){const x=(seeded(i+3)*2-1)*S*.9,z=(seeded(i+33)*2-1)*S*.9,x2=x+(seeded(i+5)-.5)*1.5,z2=z+(seeded(i+6)-.5)*1.5;line3([x,.002,z],[x2,.002,z2],'rgba(255,255,255,.55)',1.5);}}
  // 벽 4면
  for(const w of['N','E','S','W']){
    const k=wallFacing(w),base=shade(R.wall,k);
    poly3(wallQuad(S,w,-1,1,0,ch),base);
    // 걸레받이
    poly3(wallQuad(S,w,-1,1,0,.12),shade(R.wall,k*.6));
    drawWallStyle(R,w,k,t);
  }
}
function drawWallStyle(R,w,k,t){
  const S=R.S,ch=R.ch;
  if(R.style==='wood'){for(let i=-9;i<=9;i++){const u=i/9;line3(wallPt(S,w,u,.12),wallPt(S,w,u,ch),'rgba(0,0,0,.08)',1);}line3(wallPt(S,w,-1,1.1),wallPt(S,w,1,1.1),'rgba(0,0,0,.12)',2);}
  if(R.style==='stone'){for(let i=0;i<40;i++){const u=(seeded(i+w.charCodeAt(0))*2-1)*.95,y=.2+seeded(i+200+w.charCodeAt(0))*(ch-.5),du=.1+seeded(i+300)*.12,dy=.12+seeded(i+400)*.14;poly3(wallQuad(S,w,u-du,u+du,y-dy,y+dy),shade(R.wall,k*(.7+seeded(i+9)*.5)),'rgba(0,0,0,.25)',1);}
    // 숯불 빛 반사
    const g=.5+.5*Math.sin(t*6+seeded(w.charCodeAt(0))*9);poly3(wallQuad(S,w,-1,1,0,.9),`rgba(255,120,40,${.08+.08*g})`);}
  if(R.style==='clay'){for(let i=1;i<6;i++){const y=i*ch/6;line3(wallPt(S,w,-1,y),wallPt(S,w,1,y),'rgba(80,40,10,.18)',2);}for(let i=0;i<18;i++){const u=(seeded(i+11+w.charCodeAt(0))*2-1)*.9,y=.3+seeded(i+77)*(ch-.6);poly3(wallQuad(S,w,u-.08,u+.08,y-.06,y+.06),'rgba(255,220,170,.15)');}}
  if(R.style==='salt'){for(let i=0;i<70;i++){const u=(seeded(i+5+w.charCodeAt(0))*2-1)*.97,y=.15+seeded(i+600+w.charCodeAt(0))*(ch-.3),du=.03+seeded(i+700)*.07,dy=.04+seeded(i+800)*.1,sp=.5+.5*Math.sin(t*3+i*1.7);poly3(wallQuad(S,w,u-du,u+du,y-dy,y+dy),`rgba(255,255,255,${.35+.5*sp})`,`rgba(200,180,160,${.4})`,1);}
    // 핑크 히말라야 소금 조명
    poly3(wallQuad(S,w,-1,1,0,ch),`rgba(255,180,150,${.08+.04*Math.sin(t*1.5)})`);}
  if(R.style==='ice'){poly3(wallQuad(S,w,-1,1,0,ch),`rgba(255,255,255,${.1+.05*Math.sin(t+w.charCodeAt(0))})`);
    for(let i=0;i<10;i++){const u=(seeded(i+21+w.charCodeAt(0))*2-1)*.9,y=.2+seeded(i+900+w.charCodeAt(0))*(ch-.4);line3(wallPt(S,w,u,y),wallPt(S,w,u+(seeded(i+31)-.5)*.3,y+(seeded(i+41)-.5)*.9),'rgba(255,255,255,.7)',1.5);line3(wallPt(S,w,u,y),wallPt(S,w,u+(seeded(i+51)-.5)*.3,y-(seeded(i+61))*.5),'rgba(255,255,255,.5)',1);}
    // 얼음 블록 라인
    for(let i=1;i<5;i++){const y=i*ch/5;line3(wallPt(S,w,-1,y),wallPt(S,w,1,y),'rgba(255,255,255,.5)',2);}for(let i=-4;i<=4;i++){line3(wallPt(S,w,i/4+.12,0),wallPt(S,w,i/4+.12,ch),'rgba(255,255,255,.3)',1.5);}
    // 서리 낀 창
    poly3(wallQuad(S,w,-.25,.25,1.2,2),'rgba(220,240,255,.75)','rgba(255,255,255,.9)',3);}
}
/* ================= 캐릭터 (빌보드 2D) ================= */
const SUIT=['#f0a24b','#9cc46a'];
function skinOf(p,st){let c=p.skin;if(st.red)c=mixc(c,'#e24c3a',st.red*.75);if(st.frost)c=mixc(c,'#eef5fb',st.frost*.7);return c;}
/* x,y: 발 위치(화면), hp: 서있을 때 키(px), st: {red,frost,snow,sweat,shiver,sleepy,chew,pose:'stand|sit|eat',face} */
function drawPerson(p,x,y,hp,st,t){
  st=st||{};const sit=st.pose==='sit',eat=st.pose==='eat';
  const sh=st.shiver?Math.sin(t*40+x)*hp*.006*st.shiver:0;x+=sh;
  const skin=skinOf(p,st),suit=p.suit||SUIT[0];
  const u=hp;
  const headR=u*.105,headY=y-(sit?u*.62:u*.84),torsoTop=headY+headR*.9,torsoBot=sit?y-u*.12:y-u*.32,tw=u*.21;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(x,y,sit?u*.28:u*.17,u*.04,0,0,TAU);ctx.fill();
  // 다리
  if(sit){ctx.fillStyle=suit;rr(x-u*.3,y-u*.16,u*.6,u*.16,u*.07);ctx.fill();ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(x-u*.2,y-u*.03,u*.07,u*.045,0,0,TAU);ctx.ellipse(x+u*.2,y-u*.03,u*.07,u*.045,0,0,TAU);ctx.fill();}
  else if(!eat){ctx.fillStyle=suit;rr(x-tw*.95,torsoBot-u*.02,tw*.9,u*.3,u*.04);ctx.fill();rr(x+tw*.05,torsoBot-u*.02,tw*.9,u*.3,u*.04);ctx.fill();ctx.fillStyle=shade(suit,.8);rr(x-tw*.95,torsoBot+u*.2,tw*.9,u*.08,u*.03);ctx.fill();rr(x+tw*.05,torsoBot+u*.2,tw*.9,u*.08,u*.03);ctx.fill();ctx.fillStyle=skin;ctx.beginPath();ctx.ellipse(x-tw*.5,y-u*.015,u*.06,u*.035,0,0,TAU);ctx.ellipse(x+tw*.5,y-u*.015,u*.06,u*.035,0,0,TAU);ctx.fill();}
  // 몸통(찜질복)
  ctx.fillStyle=suit;rr(x-tw,torsoTop,tw*2,torsoBot-torsoTop+u*.02,u*.06);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.08)';ctx.fillRect(x-u*.01,torsoTop+u*.04,u*.02,(torsoBot-torsoTop)*.6);
  ctx.fillStyle=skin;ctx.beginPath();ctx.moveTo(x-u*.07,torsoTop);ctx.lineTo(x+u*.07,torsoTop);ctx.lineTo(x,torsoTop+u*.07);ctx.fill();

  ctx.fillStyle=skin;
  if(eat){const ch=st.chew?Math.sin(t*14)*u*.02:0;rr(x-tw-armW*.6,torsoTop+armL*.5,armW,armL*.45,armW/2);ctx.fill();rr(x+tw-armW*.4,torsoTop+armL*.5,armW,armL*.45,armW/2);ctx.fill();
    ctx.beginPath();ctx.arc(x-tw*.5,torsoTop+armL*.6+ch,armW*.7,0,TAU);ctx.arc(x+tw*.5,torsoTop+armL*.6-ch,armW*.7,0,TAU);ctx.fill();}
  else{rr(x-tw-armW*.6,torsoTop+armL*.5,armW,armL*.5,armW/2);ctx.fill();rr(x+tw-armW*.4,torsoTop+armL*.5,armW,armL*.5,armW/2);ctx.fill();}
  // 목·머리
  ctx.fillStyle=skin;ctx.fillRect(x-u*.035,headY+headR*.6,u*.07,headR*.5);
  ctx.beginPath();ctx.arc(x,headY,headR,0,TAU);ctx.fill();
  if(st.red>.15){ctx.fillStyle=`rgba(230,60,50,${st.red*.5})`;ctx.beginPath();ctx.ellipse(x-headR*.5,headY+headR*.25,headR*.3,headR*.2,0,0,TAU);ctx.ellipse(x+headR*.5,headY+headR*.25,headR*.3,headR*.2,0,0,TAU);ctx.fill();}
  drawHair(p,x,headY,headR);
  drawFace(p,x,headY,headR,u,tw,torsoTop,armW,armL,st,t);

}
function drawFace(p,x,headY,headR,u,tw,torsoTop,armW,armL,st,t){
  // 양머리 수건
  if(G.towel){ctx.fillStyle='#f3e3c3';rr(x-headR*1.05,headY-headR*1.05,headR*2.1,headR*.6,headR*.3);ctx.fill();ctx.fillStyle='#e8d2a8';ctx.beginPath();ctx.arc(x-headR*1.05,headY-headR*.75,headR*.42,0,TAU);ctx.arc(x+headR*1.05,headY-headR*.75,headR*.42,0,TAU);ctx.fill();ctx.strokeStyle='rgba(120,90,50,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x-headR*1.05,headY-headR*.75,headR*.22,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(x+headR*1.05,headY-headR*.75,headR*.22,0,TAU);ctx.stroke();}

  else{const blink=(Math.sin(t*1.3+x*.1)>.97)?.2:1;ctx.fillStyle='#3a2416';ctx.beginPath();ctx.ellipse(x-ex,ey,headR*.09,headR*.13*blink,0,0,TAU);ctx.ellipse(x+ex,ey,headR*.09,headR*.13*blink,0,0,TAU);ctx.fill();}
  if(p.glasses){ctx.strokeStyle='rgba(40,40,60,.8)';ctx.lineWidth=Math.max(1,headR*.07);ctx.beginPath();ctx.arc(x-ex,ey,headR*.26,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(x+ex,ey,headR*.26,0,TAU);ctx.stroke();ctx.beginPath();ctx.moveTo(x-ex+headR*.26,ey);ctx.lineTo(x+ex-headR*.26,ey);ctx.stroke();}

function placeParty(room){
  POS={};
  const spots=room.id==='lobby'?[[-2.7,1.2],[2.7,1.6],[-2.3,3.1]]:room.id==='fire'?[[-1.4,1.9],[1.2,2.2],[0,2.9]]:room.id==='ice'?[[-1.2,1.8],[1.3,2.1],[0,2.7]]:room.id==='clay'?[[-1.6,2],[1.4,2.3],[0,3]]:room.id==='rest'?[[-2,2.5],[1.8,2.9],[-.2,3.6]]:[[-1.5,2.2],[1.4,2.5],[0,3.2]];
  G.party.forEach((id,i)=>{const s=spots[i%spots.length];POS[id]={x:s[0],z:s[1],sit:['fire','clay','salt','ice','rest'].includes(room.id)};});
}
function partyState(id){const st={};
  if(G.room==='fire'){st.red=G.heat;st.sweat=G.heat;st.face=G.heat>.8?'open':null;}
  if(G.room==='ice'){st.frost=Math.min(1,G.cold*1.4);st.snow=Math.max(0,(G.cold-.45)/.55);st.shiver=Math.max(0,(G.cold-.7)/.3);}
  if(G.room==='clay'){st.sleepy=G.drowsy;}
  const pos=POS[id];if(pos&&pos.sit)st.pose='sit';
  return st;}
function myState(){const st={};
  if(G.room==='fire'){st.red=G.heat;st.sweat=G.heat;}
  if(G.room==='ice'){st.frost=Math.min(1,G.cold*1.4);st.snow=Math.max(0,(G.cold-.45)/.55);st.shiver=Math.max(0,(G.cold-.7)/.3);}
  return st;}
function drawBillboards(t){

  G.party.forEach(id=>{const pos=POS[id];if(!pos)return;const c=toCam([pos.x,0,pos.z]);if(c[2]<=NEAR+.2)return;BB.push({z:c[2],draw(){const f=proj(c),hp=PEOPLE[id].h*F/c[2];drawPerson(PEOPLE[id],f[0],f[1],hp,partyState(id),t);drawBubble(id,f[0],f[1]-hp*(POS[id].sit?.78:1.02),hp);}});});

/* ================= 방 소품 (3D) ================= */
function box3(x0,y0,z0,x1,y1,z1,col){
  const faces=[
    {p:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],c:.85,n:[0,0,1]},{p:[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],c:.85,n:[0,0,-1]},
    {p:[[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],c:.7,n:[-1,0,0]},{p:[[x1,y0,z0],[x1,y0,z1],[x1,y1,z1],[x1,y1,z0]],c:.7,n:[1,0,0]},
    {p:[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],c:1,n:[0,1,0]},{p:[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]],c:.5,n:[0,-1,0]}];
  const cx=(x0+x1)/2,cy=(y0+y1)/2,cz=(z0+z1)/2;
  faces.map(f=>{const fc=[cx+f.n[0]*(x1-x0)/2,cy+f.n[1]*(y1-y0)/2,cz+f.n[2]*(z1-z0)/2];const v=[cam.x-fc[0],cam.h-fc[1],cam.z-fc[2]];f.vis=v[0]*f.n[0]+v[1]*f.n[1]+v[2]*f.n[2]>0;f.d=v[0]*v[0]+v[1]*v[1]+v[2]*v[2];return f;}).filter(f=>f.vis).sort((a,b)=>b.d-a.d).forEach(f=>poly3(f.p,shade(col,f.c),'rgba(0,0,0,.15)',1));
}

/* ================= 입력 (포인터: 드래그 둘러보기 / 탭 / 아이템 드래그) ================= */
const PT={down:false,x:0,y:0,sx:0,sy:0,moved:false,yaw0:0,grab:false};
function toLocal(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
cv.addEventListener('pointerdown',e=>{if(!cur)return;ac();const[x,y]=toLocal(e);PT.down=true;PT.moved=false;PT.x=PT.sx=x;PT.y=PT.sy=y;PT.yaw0=cam.yaw;cv.setPointerCapture(e.pointerId);
  PT.grab=false;const s=SC[cur];if(s.down&&s.down(x,y))PT.grab=true;});
cv.addEventListener('pointermove',e=>{if(!PT.down||!cur)return;const[x,y]=toLocal(e);const s=SC[cur];
  if(PT.grab){if(s.move)s.move(x,y);PT.x=x;PT.y=y;return;}
  if(Math.hypot(x-PT.sx,y-PT.sy)>6)PT.moved=true;
  if(PT.moved&&s.drag!==false){cam.yaw=PT.yaw0+(x-PT.sx)*.0045;const lim=s.yawLimit||1.1;cam.yaw=clamp(cam.yaw,-lim,lim);}
  PT.x=x;PT.y=y;});
function pointerEnd(e){if(!PT.down||!cur)return;PT.down=false;const[x,y]=toLocal(e);const s=SC[cur];
  if(PT.grab){if(s.up)s.up(x,y);PT.grab=false;return;}
  if(!PT.moved){// 탭: 핫스팟 우선
    for(const h of HOT){if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){SFX.tap();h.fn();return;}}
    if(s.tap)s.tap(x,y);}}
cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',pointerEnd);
window.addEventListener('keydown',e=>{if(!cur)return;if(e.key==='ArrowLeft')cam.yaw=clamp(cam.yaw-.08,-1.1,1.1);if(e.key==='ArrowRight')cam.yaw=clamp(cam.yaw+.08,-1.1,1.1);if(e.key===' '&&SC[cur].tap){e.preventDefault();SC[cur].tap(W/2,H/2);}});

/* ================= 스케일 ================= */
function fit(){const sw=window.innerWidth,sh=window.innerHeight,s=Math.min(sw/W,sh/H);G.scale=s;const st=$('stage');st.style.transform=`scale(${s})`;st.style.position='absolute';st.style.left=((sw-W*s)/2)+'px';st.style.top=((sh-H*s)/2)+'px';}
window.addEventListener('resize',fit);fit();

/* ================= 메인 루프 ================= */
let last=performance.now(),hudT=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  ctx.setTransform(1,0,0,1,0,0);
  if(cur){const s=SC[cur];const paused=!$('msgModal').classList.contains('hidden')||!$('withModal').classList.contains('hidden')||!$('endModal').classList.contains('hidden');
    if(!paused){G.time+=dt;if(s.tick)s.tick(dt);tickFx(dt);for(const b of G.bubbles)b.t-=dt;G.bubbles=G.bubbles.filter(b=>b.t>0);}
    ctx.save();if(G.shake>0){ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));G.shake=Math.max(0,G.shake-dt*10);}
    s.draw(t);drawFx();ctx.restore();
    hudT+=dt;if(hudT>.25){hudT=0;updateHUD();}}
  else{// 시작 화면 배경: 로비를 천천히 회전
    cam.yaw=Math.sin(t*.15)*.6;cam.z=-2.2;cam.h=1.5;G.room='lobby';drawRoom(ROOMS.lobby,t);drawProps(ROOMS.lobby,t);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,0,W,H);}
  requestAnimationFrame(frame);}
buildStart();updateHUD();requestAnimationFrame(frame);
</script>
</body>
</html>
