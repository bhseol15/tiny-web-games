<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포근한 작은 정원</title>
<style>
:root{--bg:#f6efe4;--card:#fffdf8;--ink:#4a3f35;--muted:#8b7d6e;--accent:#c9a97e;--accent-d:#b08f64;--green:#8fb996;--line:#eadfce;--danger:#d98c7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{display:flex;gap:14px;padding:0 14px 24px;max-width:1100px;margin:0 auto;align-items:flex-start}
#habitat{position:relative;flex:1 1 58%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;border:1px solid var(--line);user-select:none;-webkit-user-select:none;box-shadow:0 6px 18px rgba(90,70,40,.08)}
#habitat.squirrel{background:linear-gradient(#fbf3e6 0%,#f4e6d0 60%,#d9c3a1 60%,#c8ad87 100%)}
#night{position:absolute;inset:0;background:linear-gradient(rgba(40,55,110,.5),rgba(40,55,110,.3) 60%,rgba(30,30,60,.35));opacity:0;transition:opacity 1.5s;pointer-events:none;z-index:1;mix-blend-mode:multiply}
#habitat.night #night{opacity:1}
#skyBadge{position:absolute;right:10px;top:10px;font-size:clamp(20px,4vw,34px);line-height:1;z-index:6;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));transition:transform .6s}
#habitat.night #skyBadge{transform:rotate(-15deg)}
#habitat.night .decor{filter:brightness(.8)}
#habitat.night #petWrap{filter:drop-shadow(0 0 6px rgba(255,240,200,.55))}
#habitat.gecko.night #night{background:linear-gradient(rgba(40,55,110,.45),rgba(40,55,110,.28) 60%,rgba(30,30,60,.3))}
#habitat.night #bubble{filter:none;background:#fff}
.stars{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity 1.5s;background:radial-gradient(circle at 12% 18%,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 30% 8%,#fff 0 1px,transparent 2px),radial-gradient(circle at 48% 22%,#fff 0 1.4px,transparent 2px),radial-gradient(circle at 66% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 84% 26%,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 22% 34%,#fff 0 .9px,transparent 2px),radial-gradient(circle at 76% 40%,#fff 0 1px,transparent 2px)}
#habitat.night .stars{opacity:.9}
#habitat.gecko{background:linear-gradient(#f5ede0 0%,#ebdcc6 60%,#b8a27e 60%,#a48c68 100%)}
#habitat.marimo{background:linear-gradient(#eef7fa 0%,#d6ecf3 16%,#a9d6e6 16%,#7fbcd3 100%)}
#habitat.marimo:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;background:radial-gradient(circle at 10% 60%,#c9c2b1 0 8px,transparent 9px),radial-gradient(circle at 30% 40%,#b7ad9a 0 7px,transparent 8px),radial-gradient(circle at 50% 70%,#d3ccbc 0 9px,transparent 10px),radial-gradient(circle at 72% 45%,#bdb3a0 0 8px,transparent 9px),radial-gradient(circle at 90% 65%,#cfc7b6 0 7px,transparent 8px),#a89e8b}
#habitat.marimo:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 70% 0%,rgba(255,246,190,.95),rgba(255,246,190,0) 60%);opacity:var(--light,.6);transition:opacity .8s;pointer-events:none;z-index:1}
#dirt{position:absolute;inset:0;background:radial-gradient(circle at 20% 80%,rgba(110,80,40,.5),transparent 30%),radial-gradient(circle at 75% 85%,rgba(110,80,40,.45),transparent 28%),radial-gradient(circle at 50% 70%,rgba(110,80,40,.3),transparent 26%);opacity:0;transition:opacity .8s;pointer-events:none}
#decorLayer span{position:absolute;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));pointer-events:none}
/* floor materials */
#floorLayer{position:absolute;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:0;transition:opacity .5s}
#floorLayer.floor-wood{height:40%;background:radial-gradient(ellipse at 30% 40%,#f7ead1 0 4px,transparent 5px),radial-gradient(ellipse at 70% 70%,#e2caa2 0 4px,transparent 5px),radial-gradient(ellipse at 15% 80%,#fbf1de 0 3px,transparent 4px),radial-gradient(ellipse at 85% 25%,#d8bd92 0 3px,transparent 4px),linear-gradient(#efdcbb,#e3cda6);background-size:46px 30px,46px 30px,38px 26px,38px 26px,100% 100%;box-shadow:inset 0 6px 8px -6px rgba(90,60,20,.35)}
#floorLayer.floor-coco{height:40%;background:radial-gradient(circle at 30% 40%,#7a5540 0 2px,transparent 3px),radial-gradient(circle at 75% 70%,#8b6a52 0 2px,transparent 3px),radial-gradient(circle at 55% 20%,#3f2a1d 0 2px,transparent 3px),linear-gradient(#5c3f2d,#4a3224);background-size:20px 16px,24px 18px,22px 20px,100% 100%;box-shadow:inset 0 6px 8px -6px rgba(0,0,0,.45)}
#floorLayer.floor-gravel{--g1:#e0d8ca;--g1b:#bcb2a0;--g2:#cfc6b5;--g2b:#a89d8a;--g3:#d9cfbf;--g3b:#b3a894;--gbase:#9c917f;height:19%;background:radial-gradient(ellipse at 50% 50%,var(--g1) 0 38%,var(--g1b) 40% 47%,transparent 50%),radial-gradient(ellipse at 50% 50%,var(--g2) 0 38%,var(--g2b) 40% 47%,transparent 50%),radial-gradient(ellipse at 50% 50%,var(--g3) 0 36%,var(--g3b) 38% 46%,transparent 50%),var(--gbase);transition:background .5s;background-size:34px 22px,34px 22px,26px 18px;background-position:0 0,17px 11px,8px 4px;z-index:1;box-shadow:inset 0 6px 6px -5px rgba(0,0,0,.35)}
/* decor objects */
.decor{position:absolute;line-height:0;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18));z-index:1}
.decor svg{display:block;width:100%;height:auto}
.decor.tap{cursor:pointer;pointer-events:auto;transition:transform .15s}
.decor.tap:hover{transform:scale(1.03)}
.decor.back{z-index:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.16))}
.decor .wheel-rot{transform-origin:50px 50px}
.decor.spin .wheel-rot{animation:spinW .55s linear infinite}
@keyframes spinW{to{transform:rotate(-360deg)}}
.decor .sticks{transform-origin:110px 40px}
.decor.gnaw .sticks{animation:gnaw .32s ease-in-out infinite}
@keyframes gnaw{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(1.5px,-1px) rotate(1.2deg)}}
.crumb{position:absolute;font-size:18px;line-height:1;color:#c49a6a;pointer-events:none;z-index:3;animation:crumb .9s ease-out forwards}
@keyframes crumb{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(calc(-14px + 28px*var(--r,.5)),-34px)}}
.decor .weed{transform-origin:30px 200px;animation:sway 3.2s ease-in-out infinite alternate}
.decor .weed.w2{animation-delay:-1.4s}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.decor .drop{position:absolute;left:50%;top:78%;font-size:clamp(14px,3vw,24px);line-height:1;transform:translateX(-50%);opacity:0;pointer-events:none}
.decor.dripping .drop{animation:drip .7s ease-in 2}
@keyframes drip{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,120%) scale(1)}}
#petWrap.inside .pet{transform:scale(.15) translateY(120%);opacity:0;transition:transform .55s ease-in,opacity .45s ease-in}
#petWrap.inside #bubble{opacity:1;bottom:auto;top:-46px}
.pet.run{animation:run .3s ease-in-out infinite}
#petWrap.climbing{transition:bottom 1.6s ease-in-out,left .9s ease;bottom:30%!important;z-index:3}
#petWrap.climbing .pet{transform:scale(.5) scaleX(-1) rotate(66deg) translate(2%,0);filter:drop-shadow(-4px 5px 3px rgba(0,0,0,.35))}
.pet.bite{animation:bite .5s ease}
@keyframes bite{0%,100%{transform:translateX(0)}30%{transform:translateX(-8%) rotate(-10deg)}60%{transform:translateX(4%) rotate(4deg)}}
.pet.sleep.deep{animation:breathe 2.4s ease-in-out infinite}
#zz.deep{font-size:clamp(26px,5.5vw,48px)}
@keyframes run{0%,100%{transform:scale(.58) rotate(-6deg)}50%{transform:scale(.58) translateY(-5%) rotate(6deg)}}
#petWrap.onwheel{z-index:1;bottom:43%!important}
#petWrap.flip .pet{transform:scaleX(-1)}
#petWrap.flip .pet.nibble{animation:nibbleF .8s ease}
@keyframes nibbleF{0%,100%{transform:scaleX(-1) rotate(0)}25%{transform:scaleX(-1) rotate(4deg)}75%{transform:scaleX(-1) rotate(-4deg)}}
/* pipette (marimo feeding) */
#pipette{position:absolute;left:50%;top:-90%;width:9%;transform:translateX(-50%);transition:top .7s ease;z-index:4;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
#pipette.on{top:2%}
#petWrap.pipetting #bubble{left:112%;transform:none;bottom:60%}
#petWrap.pipetting #bubble:after{left:-7px;bottom:10px;transform:rotate(135deg)}
#pipette svg{display:block;width:100%;height:auto}
#pipette.squeeze .bulb{animation:squeeze .5s ease}
@keyframes squeeze{50%{transform:scaleY(.8) translateY(6px)}}
.nutri-drop{position:absolute;left:50%;top:-30%;font-size:clamp(16px,3.4vw,28px);line-height:1;transform:translateX(-50%);animation:ndrop .75s ease-in forwards;pointer-events:none;z-index:3}
@keyframes ndrop{0%{opacity:0;transform:translate(-50%,0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,90%) scale(1.1)}}
.ripple{position:absolute;left:50%;top:40%;width:60%;aspect-ratio:3/1;border:3px solid rgba(255,255,255,.75);border-radius:50%;transform:translate(-50%,-50%) scale(.4);animation:ripple .9s ease-out forwards;pointer-events:none;z-index:3}
@keyframes ripple{to{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.bowl.pipette:before{border-radius:10px 10px 30px 30px;height:50px;background:linear-gradient(90deg,#e6f3f8,#ffffff 40%,#d3e8f0);box-shadow:inset 0 0 0 3px rgba(150,190,205,.6),0 3px 4px rgba(0,0,0,.12)}
.poop{position:absolute;bottom:6%;font-size:clamp(18px,3.6vw,30px);cursor:pointer;line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2));transition:transform .15s}
.poop:hover{transform:scale(1.12)}
#petWrap{position:absolute;left:50%;bottom:12%;width:36%;transform:translateX(-50%);z-index:2;transition:bottom .75s cubic-bezier(.3,.9,.4,1.1),left .9s ease}
#habitat.gecko #petWrap{width:52%;bottom:9%}
#habitat.marimo #petWrap{width:22%;bottom:24%;transition:width .9s ease,bottom .75s}
#habitat.marimo .pet{transition:transform .5s}
.decor-baby{z-index:2}
.decor-baby svg{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.morphs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.morphs[hidden]{display:none}
.morph{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}
.morph.on{border-color:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
#petWrap.held{bottom:29%}
#habitat.gecko #petWrap.held{bottom:22%;width:44%}
/* big hand */
#hand{position:absolute;left:50%;bottom:-70%;width:64%;transform:translateX(-50%);transition:bottom .75s cubic-bezier(.3,.9,.4,1.1);z-index:1;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(80,50,20,.25))}
#hand.on{bottom:1%}
#hand svg{display:block;width:100%;height:auto}
#pat{position:absolute;left:50%;bottom:78%;transform:translateX(-50%);font-size:clamp(36px,7.5vw,68px);line-height:1;opacity:0;pointer-events:none;z-index:4}
#pat.go{animation:pat 1.5s ease}
@keyframes pat{0%{opacity:0;transform:translate(-50%,-30%)}15%{opacity:1;transform:translate(-50%,0)}35%{transform:translate(-40%,10%) rotate(-8deg)}55%{transform:translate(-60%,0) rotate(6deg)}75%{transform:translate(-45%,10%) rotate(-6deg)}90%{opacity:1}100%{opacity:0;transform:translate(-50%,-25%)}}
.hand-treat{position:absolute;left:62%;bottom:40%;font-size:clamp(20px,4.5vw,40px);line-height:1;animation:treat 1s ease forwards;pointer-events:none;z-index:4}
@keyframes treat{0%{opacity:0;transform:translate(30%,-40%) scale(.6)}30%{opacity:1;transform:translate(0,0) scale(1)}70%{opacity:1;transform:translate(-10%,5%) scale(.7)}100%{opacity:0;transform:translate(-20%,10%) scale(.2)}}
#habitat.gecko .hand-treat{left:16%;bottom:36%}
.heart{position:absolute;font-size:20px;animation:heart 1.4s ease forwards;pointer-events:none;z-index:5}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:1}100%{opacity:0;transform:translateY(-46px) scale(1.15)}}
/* broom / sponge */
#broom{position:absolute;left:10%;bottom:6%;font-size:clamp(40px,9vw,80px);line-height:1;opacity:0;pointer-events:none;z-index:3;transform-origin:50% 90%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
#broom.sweep{animation:sweep 1.9s ease-in-out}
@keyframes sweep{0%{left:8%;opacity:0;transform:rotate(-28deg)}8%{opacity:1}20%{transform:rotate(22deg)}35%{left:30%;transform:rotate(-28deg)}50%{transform:rotate(22deg)}65%{left:52%;transform:rotate(-28deg)}80%{transform:rotate(22deg)}92%{left:72%;opacity:1;transform:rotate(-20deg)}100%{left:76%;opacity:0;transform:rotate(0)}}
.puff{position:absolute;bottom:8%;font-size:clamp(16px,3.5vw,28px);opacity:0;animation:puff 1s ease forwards;pointer-events:none;z-index:2}
@keyframes puff{0%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:.85}100%{opacity:0;transform:translateY(-24px) translateX(14px) scale(1.2)}}
.pet{width:100%;height:auto;display:block;transform-origin:50% 100%;transition:transform .5s ease}
.pet .m-smile,.pet .m-flat,.pet .m-frown,.pet .lids,.pet .blush,.pet .sweat{display:none}
.pet.mood-happy .m-smile,.pet.mood-happy .blush{display:inline}
.pet.mood-neutral .m-smile{display:inline}
.pet.mood-hungry .m-flat,.pet.mood-hungry .lids{display:inline}
.pet.mood-uncomfortable .m-frown,.pet.mood-uncomfortable .sweat{display:inline}
.pet .glow circle{opacity:calc(var(--light,.6)*.55);transition:opacity .8s}
#petWrap.eating .pet{transform:translateX(-12%) rotate(-8deg)}
#habitat.gecko #petWrap.eating .pet{transform:translateX(-6%) rotate(-3deg)}
.pet.pulse{animation:chew .5s ease}
@keyframes chew{0%,100%{transform:translateX(-12%) rotate(-8deg)}50%{transform:translateX(-12%) rotate(-11deg) translateY(2%)}}
#habitat.gecko .pet.pulse{animation:chewG .5s ease}
@keyframes chewG{0%,100%{transform:translateX(-6%) rotate(-3deg)}50%{transform:translateX(-7%) rotate(-5deg) translateY(2%)}}
.pet.lift{animation:lift 1.3s ease}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%) scale(1.04)}}
.pet.nibble{animation:nibble .8s ease}
@keyframes nibble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.pet.walk{animation:walk 3.2s ease-in-out}
/* sleep */
.pet.sleep .lids{display:inline}.pet.sleep .m-smile,.pet.sleep .m-frown,.pet.sleep .blush,.pet.sleep .sweat{display:none}.pet.sleep .m-flat{display:inline}
.pet.sleep{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02,.98)}}
#zz{position:absolute;left:68%;bottom:80%;font-size:clamp(18px,4vw,34px);line-height:1;opacity:0;pointer-events:none;z-index:4}
#zz.go{animation:zz 1.6s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(30%,-70%) scale(1.15)}}
/* exercise ball + outside */
#ball{position:absolute;left:-12%;right:-12%;bottom:-6%;aspect-ratio:1;border-radius:50%;pointer-events:none;z-index:3;display:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),rgba(200,235,255,.25) 45%,rgba(120,190,230,.28) 100%);box-shadow:inset 0 -8px 16px rgba(60,130,180,.25),inset 0 0 0 4px rgba(255,255,255,.7),0 6px 10px rgba(0,0,0,.15)}
#ball i{position:absolute;inset:6%;border-radius:50%;border:4px dashed rgba(120,190,230,.55)}
#petWrap.rolling #ball{display:block}
#petWrap.rolling #ball i{animation:ballspin 1.1s linear infinite}
@keyframes ballspin{to{transform:rotate(360deg)}}
#petWrap.rolling{animation:roll 4.4s ease-in-out;bottom:14%}
#petWrap.rolling .pet{transform:scale(.8)}
@keyframes roll{0%{left:50%}30%{left:22%}70%{left:78%}100%{left:50%}}
#petWrap.rolling #bubble{bottom:118%}
#habitat.squirrel.outside{background:linear-gradient(#cfe9f7 0%,#e9f4fb 55%,#9ccf7a 55%,#7fb965 100%)}
#habitat.outside #floorLayer,#habitat.outside #decorLayer,#habitat.outside #dirt,#habitat.outside #poopLayer{opacity:0;transition:opacity .4s}
#habitat.outside:before{content:"☁️      ☁️";position:absolute;left:8%;top:6%;font-size:clamp(22px,5vw,44px);letter-spacing:.4em;opacity:.9;z-index:1;pointer-events:none}
#habitat.outside:after{content:"🌷 🌼  🌱   🌻  🌷";position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:clamp(18px,4vw,34px);letter-spacing:.6em;z-index:1;pointer-events:none}
@keyframes walk{0%{transform:translateX(0)}25%{transform:translateX(-95%) scaleX(1)}50%{transform:translateX(-95%) scaleX(-1)}75%{transform:translateX(95%) scaleX(-1)}90%{transform:translateX(95%) scaleX(1)}100%{transform:translateX(0)}}
.pet.wobble{animation:wobble 1.6s ease}
@keyframes wobble{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-6%) rotate(5deg)}70%{transform:translateY(-3%) rotate(-5deg)}}
#bubble{position:absolute;left:50%;bottom:104%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 11px;font-size:clamp(11px,1.6vw,14px);white-space:nowrap;max-width:260px;box-shadow:0 3px 8px rgba(0,0,0,.08);z-index:3}
#bubble:after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
#habitat.gecko #bubble{left:26%}
.dish{position:absolute;left:-38%;bottom:0;width:36%;aspect-ratio:2/1;z-index:1}
#habitat.gecko .dish{left:-14%;width:24%;bottom:2%}
.dish:before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#fff9ee,#e9d9c2 65%,#cbb59a);box-shadow:inset 0 -5px 0 #b79e82,0 3px 4px rgba(0,0,0,.18)}
.dish-items{position:absolute;left:10%;right:10%;top:-4%;bottom:34%;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1px;font-size:clamp(13px,2.4vw,24px);line-height:1}
.dish.plate{aspect-ratio:3/1;width:40%;left:-42%}
.dish.plate:before{background:radial-gradient(ellipse at 50% 35%,#ffffff,#f3eee6 55%,#d9cfc0 85%,#c9bdab);box-shadow:inset 0 0 0 4px rgba(255,255,255,.7),inset 0 -3px 0 #bfae98,0 3px 4px rgba(0,0,0,.16)}
.dish.plate .dish-items{top:-18%;bottom:24%}
.dish[hidden]{display:none}
#sun{position:absolute;top:-30%;right:-20%;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,240,170,.95),rgba(255,240,170,0) 70%);opacity:0;transition:opacity .6s;pointer-events:none;z-index:2}
#sun.on{opacity:1}
/* 마리모 털(fuzz) — petWrap의 --fuzz(0~1)로 표시 */
.pet .fuzz{opacity:calc(var(--fuzz,.2)*.9);transition:opacity .6s}
#brush{position:absolute;left:50%;top:50%;font-size:clamp(28px,6vw,54px);line-height:1;opacity:0;pointer-events:none;z-index:4;transform:translate(-50%,-50%) rotate(-40deg);filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
#brush.on{animation:brushing 3s ease-in-out}
@keyframes brushing{0%{opacity:0;transform:translate(60%,-120%) rotate(-40deg)}10%{opacity:1;transform:translate(10%,-80%) rotate(-40deg)}30%{transform:translate(-80%,-40%) rotate(-55deg)}50%{transform:translate(-20%,20%) rotate(-30deg)}70%{transform:translate(50%,-20%) rotate(-50deg)}90%{opacity:1;transform:translate(-30%,-90%) rotate(-40deg)}100%{opacity:0;transform:translate(60%,-120%) rotate(-40deg)}}
.fluff{position:absolute;font-size:16px;line-height:1;color:#5c9e48;pointer-events:none;z-index:3;animation:crumb .9s ease-out forwards}
.spark{position:absolute;font-size:22px;animation:spark 1.2s ease forwards;pointer-events:none;z-index:4}
@keyframes spark{0%{opacity:0;transform:scale(.4) translateY(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.2) translateY(-30px)}}
#panel{flex:1 1 42%;min-width:280px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.namerow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.namerow h2{margin:0;font-size:18px}
.namerow small{color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 8px;cursor:pointer;font-size:14px}
#nameForm{display:flex;gap:6px;margin-top:8px}
#nameForm[hidden]{display:none}
#nameForm input{flex:1;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;font-family:inherit}
.stat{display:grid;grid-template-columns:52px 1fr 36px;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.bar{height:10px;background:#efe6d8;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--green);transition:width .5s}
.bar i.low{background:var(--danger)}
.bar i.mid{background:#e2b86a}
#moodText{font-size:13px;color:var(--muted);margin-top:4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 8px;font-size:14px;cursor:pointer;transition:transform .1s,background .2s}
.act:hover{background:#fbf5ea}
.act:active{transform:scale(.97)}
.acts.busy .act{opacity:.55;pointer-events:none}
#feedInline[hidden]{display:none}
.feed-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:600}
.feed-head small{font-weight:400;color:var(--muted);font-size:12px}
.feed-row{display:flex;align-items:center;gap:14px;margin:12px 0}
.food-cards{display:flex;gap:8px;flex-wrap:wrap}
.food-card{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:28px;line-height:1;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 0 var(--line)}
.food-card:active{cursor:grabbing;transform:scale(.96)}
.bowl{position:relative;width:128px;height:72px;flex:none;margin-left:auto}
.bowl:before{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,#fff9ee,#e9d9c2 65%,#cbb59a);box-shadow:inset 0 -6px 0 #b79e82,0 3px 4px rgba(0,0,0,.15);transition:box-shadow .2s,transform .2s}
.bowl.target:before{box-shadow:inset 0 -6px 0 #b79e82,0 0 0 3px var(--green)}
.bowl.over:before{transform:scale(1.06)}
.bowl.plate{height:56px}
.bowl.plate:before{height:40px;background:radial-gradient(ellipse at 50% 35%,#ffffff,#f3eee6 55%,#d9cfc0 85%,#c9bdab);box-shadow:inset 0 0 0 4px rgba(255,255,255,.7),inset 0 -3px 0 #bfae98,0 3px 4px rgba(0,0,0,.15)}
.bowl.plate .bowl-items{top:0;bottom:12px}
.bowl.plate .bowl-empty{top:16px}
#handBox[hidden]{display:none}
.hand-acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.hand-acts .act{padding:10px 6px;font-size:13px}
.hand-acts.busy .act{opacity:.55;pointer-events:none}
.bowl-items{position:absolute;left:14px;right:14px;top:4px;bottom:22px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px;font-size:22px;line-height:1}
.bowl-items span{cursor:pointer}
.bowl-empty{position:absolute;left:0;right:0;top:24px;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}
.feed-btns{display:flex;gap:8px}
.feed-btns button{flex:1;border-radius:12px;padding:10px;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff}
.feed-btns .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.feed-btns .primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{position:fixed;transform:translate(-50%,-50%);font-size:30px;pointer-events:none;z-index:50;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.personas{align-items:center}
.personas[hidden]{display:none}
.personas .plabel{font-size:12px;color:var(--muted);margin-right:2px}
.chip.persona{padding:4px 9px;font-size:12px}
.gravels{align-items:center;margin-top:8px}
.gravels[hidden]{display:none}
.gravels .plabel{font-size:12px;color:var(--muted);margin-right:2px}
.gsw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;background:radial-gradient(circle at 35% 35%,var(--a) 0 40%,var(--b) 42% 100%)}
.gsw.on{border-color:var(--accent);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#4a3f35;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 14px 24px}
footer button{background:none;border:none;text-decoration:underline;color:var(--muted);cursor:pointer;font-size:12px}
@media (max-width:760px){main{flex-direction:column}#habitat{flex:none;width:100%}#panel{min-width:0;width:100%}.act{padding:12px 6px}}
</style>
</head>

/* ---------- mood ---------- */
function moodOf(p){
  if(S.mode==='marimo'){
    if(p.light<40) return ['hungry','빛이 부족해요. 광합성을 시켜 주세요!'];
    if(p.nutri<40) return ['hungry','영양이 부족해요. 영양제를 주세요!'];
    if(p.water<40) return ['uncomfortable','물이 탁해요. 물갈이를 해 주세요!'];
    if((p.fuzz||0)>65) return ['uncomfortable','털이 북슬북슬해요. 칫솔로 다듬어 주세요!'];
    if(p.light>=70&&p.water>=70&&p.nutri>=60&&(p.fuzz||0)<=40) return ['happy','물속이 맑고 따뜻해서 기분이 좋아요.'];
    return ['neutral','오늘도 천천히 동글동글 자라고 있어요.'];
  }
  var L=persona().lines;
  if(p.hunger<40) return ['hungry',L.hungry||'배가 고파요. 밥을 주세요!'];
  if(p.clean<40||p.poops.length>=3) return ['uncomfortable','집을 깨끗하게 해 주세요!'];
  if(p.happy<40) return ['neutral',L.bored||(S.mode==='squirrel'?'심심해요. 같이 놀아 주세요!':'조심스럽게 쓰다듬어 주세요.')];
  if(p.hunger>=70&&p.happy>=70&&p.clean>=70) return ['happy',L.happy||'오늘은 편안하고 행복해요.'];
  return ['neutral','오늘도 잘 지내고 있어요.'];
}

function renderDecor(){
  var cfg=PETS[S.mode],p=P(),layer=$('decorLayer'),floor=$('floorLayer'); layer.innerHTML=''; floor.className='';
  p.decor.forEach(function(i){var d=cfg.decor[i];if(!d)return;
    if(d.kind==='floor'){floor.className=d.cls;if(d.cls==='floor-gravel')applyGravel();return;}
    var el=document.createElement('div');el.className='decor decor-'+d.kind+(d.act?' tap':'')+(d.back?' back':'');el.dataset.id=d.id;
    if(d.kind==='emoji'){el.textContent=d.emoji;el.style.lineHeight='1';}else{el.innerHTML=DECOR_SVG[d.kind]||'';}
    for(var k in d.style)el.style[k]=d.style[k];
    if(d.act){el.title=d.label;el.onclick=function(){decorAct(d.act,el);};}
    layer.appendChild(el);});

/* ---------- decor activities ---------- */
function centerPct(el){var r=el.getBoundingClientRect(),h=habitat.getBoundingClientRect();return ((r.left+r.width/2-h.left)/h.width*100);}
function petTo(pct,cb){petWrap.style.left=Math.max(18,Math.min(82,pct))+'%';setTimeout(cb,950);}
function petHome(){petWrap.style.left='';}
function hideDecor(){var cfg=PETS[S.mode];for(var i=0;i<cfg.decor.length;i++){var d=cfg.decor[i];if((d.act==='house'||d.act==='hide')&&P().decor.indexOf(i)>=0)return {def:d,el:document.querySelector('.decor[data-id="'+d.id+'"]')};}return null;}
function isInside(){var p=P();return !!(p.insideUntil&&p.insideUntil>Date.now());}
function insideLeft(){var ms=Math.max(0,P().insideUntil-Date.now()),m=Math.floor(ms/60000),sec=Math.floor(ms%60000/1000);return m+':'+(sec<10?'0':'')+sec;}
function enterHide(kind,el){
  if(isInside()||feed.eating||hand.held)return;
  /* v26: 휴식 시간 랜덤 — 기본 HIDE_MS의 0.45~1.55배, 밤에는 0.4배, 낮에는 1.3배, 다람쥐는 성격 배율 추가 */
  var dur=HIDE_MS*(0.45+Math.random()*1.1); if(S.mode!=='marimo')dur*=isNight()?0.4:1.3; dur*=persona().hideDur; dur=Math.max(Math.min(20000,HIDE_MS*0.3),Math.round(dur));
  var p=P(); p.insideUntil=Date.now()+dur; p.insideDur=dur; p.insideKind=kind; save();
  say(kind==='hide'?'은신처로 사묵사묵…':'집에 들어갈래요!',1000);
  petTo(centerPct(el)+(kind==='hide'?2:0),function(){petWrap.classList.add('inside');update();});
}
function exitHide(){
  var p=P(); p.insideUntil=0; petWrap.classList.remove('inside'); p.happy=cl(p.happy+8); save(); update();
  setTimeout(function(){petHome();say(p.insideKind==='hide'?'다시 나왔어요. 푹 쉬었네요!':'잘 쉬고 나왔어요!',1600);},450);
}
function runWheel(el){
  var dur=(2000+Math.random()*6000)*(persona().id==='active'?1.3:persona().id==='lazy'?0.6:1); /* 2~8초 랜덤 × 성격 */
  setBusy(dur+2300); say('쳇바퀴 탈 시간!',900);
  petTo(centerPct(el),function(){
    el.classList.add('spin'); petWrap.classList.add('onwheel'); var svg=petHolder.querySelector('.pet'); if(svg)svg.classList.add('run'); say('다다다다다… 시원해요!',dur);
    setTimeout(function(){el.classList.remove('spin'); petWrap.classList.remove('onwheel'); if(svg)svg.classList.remove('run'); var q=P();var k=dur/3300;q.happy=cl(q.happy+Math.round(14*k));q.hunger=cl(q.hunger-Math.round(5*k));save();update();
      petHome(); say(dur>6000?'헉헉… 진짜 오래 뛰었어요!':dur<3200?'조금만 뛰었어요. 다음에 더!':'운동 완료! 배가 조금 고파요.',1600);},dur);
  });
}
function decorAct(kind,el){
  if(isInside()&&kind!=='house'&&kind!=='hide'){toast('지금은 쉬는 중이에요. 남은 시간 '+insideLeft());return;}
  if(busy||feed.eating||hand.held){toast('지금은 잠시 기다려 주세요.');return;}
  var p=P();
  if(kind==='house'||kind==='hide'){
    if(isInside()){toast('쉬는 중이에요. 남은 시간 '+insideLeft());return;}
    var wait=400+Math.random()*2400; setBusy(wait+1200);
    say(kind==='hide'?'음… 은신처에 들어갈까…':'음… 집에 들어갈까…',wait+300);
    var pEnter=Math.min(.97,(isNight()?0.35:0.8)*persona().hideP);
    setTimeout(function(){
      if(Math.random()<pEnter){enterHide(kind,el);}
      else{anim('wobble',1200);say(isNight()?'밤인데요? 지금은 놀고 싶어요!':(kind==='hide'?'지금은 안 들어갈래요.':'아직 졸리지 않아요!'),1800);}
    },wait);
  }else if(kind==='climb'){
    setBusy(6200); say('올라가 볼래요!',900);
    petTo(centerPct(el)+5,function(){
      petWrap.classList.add('climbing'); say('영차… 영차…',1800);
      setTimeout(function(){say('꼭대기! 여기 전망 좋아요 👀',1800);},1900);
      setTimeout(function(){petWrap.classList.remove('climbing'); say('조심조심 내려가요.',1500);},3700);
      setTimeout(function(){var q=P();q.happy=cl(q.happy+12);q.hunger=cl(q.hunger-3);save();update();petHome();say('운동 잘했어요!',1400);},5400);
    });
  }else if(kind==='chew'){
    var cdur=2200+Math.random()*2000; setBusy(cdur+2200); say('이가 간질간질해요!',900);
    petTo(centerPct(el)+15,function(){
      el.classList.add('gnaw'); anim('nibble',cdur); say('사각사각… 사각사각…',cdur);
      var cn=0,civ=setInterval(function(){var s=document.createElement('span');s.className='crumb';s.textContent='‧';var r=el.getBoundingClientRect(),h=habitat.getBoundingClientRect();s.style.left=((r.left-h.left)/h.width*100+30+Math.random()*40)+'%';s.style.bottom='8%';s.style.setProperty('--r',Math.random());habitat.appendChild(s);setTimeout(function(){s.remove();},900);if(++cn>=Math.floor(cdur/300))clearInterval(civ);},300);
      setTimeout(function(){el.classList.remove('gnaw');var q=P();q.happy=cl(q.happy+Math.round(5+cdur/700));q.hunger=cl(q.hunger+2);save();update();petHome();say(persona().id==='active'?'이 다 갈았다! 이제 뛰어놀자!':'이가 시원해졌어요. 만족!',1600);},cdur);
    });
  }else if(kind==='wheel'){
    runWheel(el);
  }else if(kind==='bottle'){
    setBusy(3800); el.classList.remove('dripping'); void el.offsetWidth; el.classList.add('dripping'); say('물통에서 물이 나와요.',900);
    petWrap.classList.add('flip');
    petTo(centerPct(el)-(S.mode==='gecko'?30:16),function(){
      anim('nibble',1200); say('촉촉… 물 맛있다.',1600);
      setTimeout(function(){el.classList.remove('dripping');var q=P();q.happy=cl(q.happy+6);q.hunger=cl(q.hunger+3);save();update();petHome();petWrap.classList.remove('flip');},1500);
    });
  }
}
function renderPoops(){
  var layer=$('poopLayer'),p=P(); layer.innerHTML='';
  if(S.mode==='marimo')return;
  p.poops.forEach(function(x,i){var s=document.createElement('span');s.className='poop';s.textContent='💩';s.style.left=x+'%';s.title='치우기';
    s.onclick=function(){p.poops.splice(i,1);p.clean=cl(p.clean+6);save();update();say('고마워요!',1200);};layer.appendChild(s);});
}
function renderStats(){
  var cfg=PETS[S.mode],p=P(); statsEl.innerHTML='';
  cfg.stats.forEach(function(s){var v=s[0]==='vital'?(p.light+p.water)/2:s[0]==='tidy'?100-(p.fuzz==null?20:p.fuzz):p[s[0]];v=Math.round(cl(v));
    var row=document.createElement('div');row.className='stat';
    row.innerHTML='<span>'+s[1]+'</span><div class="bar"><i class="'+(v<40?'low':v<70?'mid':'')+'" style="width:'+v+'%"></i></div><b>'+v+'</b>';statsEl.appendChild(row);});
  var mt=document.createElement('div');mt.id='moodText';statsEl.appendChild(mt);
}
function renderFoodCards(){
  var list=foodsFor(feed.kind); foodCards.innerHTML=''; if(!list)return;
  list.forEach(function(f,i){var b=document.createElement('button');b.type='button';b.className='food-card';b.textContent=f[0];b.setAttribute('aria-label',f[1]);bindCard(b,i);foodCards.appendChild(b);});
}
function renderBowl(){
  var list=foodsFor(feed.kind); bowlItems.innerHTML='';
  if(list){feed.items.forEach(function(i,k){var s=document.createElement('span');s.textContent=list[i][0];s.title='빼기';s.onclick=function(){feed.items.splice(k,1);renderBowl();};bowlItems.appendChild(s);});}
  bowlEmpty.style.display=feed.items.length?'none':'block';
  bowlEmpty.textContent=S.mode==='marimo'?'스포이드가 비어 있어요':feed.kind==='snack'?'접시가 비어 있어요':'종지가 비어 있어요';
  serveBtn.disabled=!feed.items.length||feed.eating;
}
function renderServed(list,foods){
  servedItems.textContent=list.map(function(i){return foods[i][0];}).join('');
}
function update(){
  var p=P(),m=moodOf(p);
  if(S.mode==='marimo'){var n=p.nutri==null?60:p.nutri;petWrap.style.width=(13+n*0.16).toFixed(1)+'%';petWrap.style.setProperty('--fuzz',((p.fuzz==null?20:p.fuzz)/100).toFixed(2));}else{petWrap.style.width='';}
  if(S.mode!=='marimo'){
    if(isInside()){var hd=hideDecor();if(hd&&hd.el){petWrap.classList.add('inside');if(!petWrap.style.left)petWrap.style.left=Math.max(18,Math.min(82,centerPct(hd.el)+(p.insideKind==='hide'?2:0)))+'%';}else{p.insideUntil=0;}}
    else if(p.insideUntil){exitHide();return;}
  }
  var svg=petHolder.querySelector('.pet');
  if(svg){svg.classList.remove('mood-happy','mood-neutral','mood-hungry','mood-uncomfortable');svg.classList.add('mood-'+m[0]);}
  bubble.textContent=isInside()?(p.insideKind==='hide'?'은신처에서 쉬는 중… ':'집에서 쉬는 중… ')+insideLeft():(tempSay||m[1]);
  $('petName').textContent=p.name; $('petKind').textContent=PETS[S.mode].label;
  renderStats();
  $('moodText').textContent=S.mode!=='marimo'?(isNight()?'🌙 밤 — 야행성이라 활발하게 놀아요.':(S.mode==='gecko'?'☀️ 낮 — 은신처에서 자주 쉬어요.':'☀️ 낮 — 집에서 자주 쉬어요.')):S.mode==='marimo'?'빛과 물을 잘 챙겨 주면 동글동글 자라요.':'포만감·행복·청결이 70 이상이면 가장 행복해요.';
  renderPoops();
  if(S.mode==='marimo'){habitat.style.setProperty('--light',(0.15+p.light/100*0.85).toFixed(2));$('dirt').style.opacity=((100-p.water)/100*0.35).toFixed(2);}
  else{$('dirt').style.opacity=((100-p.clean)/100*0.4).toFixed(2);}
  renderBowl();
}
function renderAll(){
  habitat.className=S.mode+(S.mode!=='marimo'&&isNight()?' night':''); $('skyBadge').textContent=S.mode!=='marimo'?(isNight()?'🌙':'☀️'):''; renderTabs(); renderPet(); renderPersonas(); renderActs(); renderDecorChips(); renderDecor(); renderGravels(); renderFoodCards(); update();
}
function setMode(m){
  if(!PETS[m]||m===S.mode)return;
  resetFeed(); resetHand(); resetDecorAct(); clearTimeout(busyTimer); busy=false; actsEl.classList.remove('busy'); tempSay=null; clearTimeout(sayTimer);
  $('nameForm').hidden=true;
  S.mode=m; save(); renderAll();
}

/* ---------- actions ---------- */
function act(id){
  if(isInside()){toast('지금은 쉬는 중이에요. 남은 시간 '+insideLeft());return;}
  if(busy||feed.eating||hand.held){toast('지금은 잠시 기다려 주세요.');return;}
  var p=P();
  switch(id){
    case 'feed': openFeed('feed'); return;
    case 'snack': openFeed('snack'); return;
    case 'clean': sweep('🧹',1900); anim('wobble',1600); setBusy(1900); say('쓱쓱… 치우는 중!',1300);
      setTimeout(function(){var q=P();q.clean=100;sparkle();save();update();say('집이 깨끗해져서 상쾌해요!');},1300); break;
    case 'poop': if(!p.poops.length){toast('치울 똥이 없어요.');return;} p.poops=[]; p.clean=cl(p.clean+15); sparkle(); setBusy(700); say('고마워요, 발이 깨끗해졌어요!'); break;
    case 'handle': pickUp(); return;
    case 'walk': setBusy(5400); say('공에 들어가서 밖으로 나가요!',1000);
      setTimeout(function(){habitat.classList.add('outside'); petWrap.classList.add('rolling'); say('데굴데굴~ 바깥 공기 최고예요! 🌿',4200);},700);
      setTimeout(function(){petWrap.classList.remove('rolling'); habitat.classList.remove('outside'); var q=P(); q.happy=cl(q.happy+18); q.hunger=cl(q.hunger-6); save(); update(); say('재밌었어요! 집이 그리웠지만요.',1600);},5200); break;
    case 'photo': p.light=cl(p.light+25); $('sun').classList.add('on'); setTimeout(function(){$('sun').classList.remove('on');},1800); anim('wobble',1600); setBusy(1500); say('따뜻한 빛이 들어와요. 몽글몽글!'); break;
    case 'trim': setBusy(3400); brushMarimo(3000); anim('wobble',1600); say('사각사각… 다듬는 중!',2600);
      setTimeout(function(){var q=P();q.fuzz=0;q.water=cl(q.water+4);sparkle();save();update();say('동글동글 매끈해졌어요! 기분 최고!');},3000); break;
    case 'water': sweep('🧽',1900); anim('wobble',1600); setBusy(1900); say('뽀글뽀글… 수조 청소 중!',1300);
      setTimeout(function(){var q=P();q.water=100;sparkle();save();update();say('물이 맑아져서 숨쉬기 편해요!');},1300); break;
    default: return;
  }
  save(); update();
}

/* ---------- hand (handling) ---------- */
var STROKE_SAY={squirrel:['가리가리… 기분 좋아요!','그 자리 더 쓸어 주세요~','손이 따뜻해서 졸려요…'],gecko:['천천히… 좋아요.','배기 천천히 편안해져요.','눈을 가리하게 반짝이면 기분 좋다는 뜻이예요.']};
function pickUp(){
  if(S.mode==='marimo')return;
  hand.held=true; actsEl.classList.add('busy'); feedBox.hidden=true;
  handEl.classList.add('on'); petWrap.classList.add('held');
  var p=P(); p.happy=cl(p.happy+Math.round(6*persona().handle)); save(); update();
  say(S.mode==='gecko'?'손 위가 따뜻해요…':(persona().id==='shy'?'헉… 손이 너무 커요…':persona().id==='active'?'손 위! 근데 금방 내려갈래요!':'손 위에 올라가는 거 좋아요!'),2200);
  renderHandActs(); handBox.hidden=false;
  if(handBox.scrollIntoView)handBox.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderHandActs(){
  var cfg=PETS[S.mode]; handActs.innerHTML='';
  var list=[['stroke','🫳 쓰다듬기']]; if(cfg.treat)list.push(['treat',cfg.treat[0]+' '+cfg.treat[1]]); list.push(['down','⬇️ 내려놓기']);
  list.forEach(function(a){var b=document.createElement('button');b.type='button';b.className='act';b.textContent=a[1];b.onclick=function(){handAct(a[0]);};handActs.appendChild(b);});
}
function handBusy(ms){hand.busy=true;handActs.classList.add('busy');hand.timers.push(setTimeout(function(){hand.busy=false;handActs.classList.remove('busy');},ms));}
function handAct(id){
  if(!hand.held||hand.busy)return;
  var p=P(),cfg=PETS[S.mode];
  if(id==='stroke'){
    var svg=petHolder.querySelector('.pet');
    if(hand.sleep>0){
      if(Math.random()<persona().bite){
        // bite!
        hand.sleep=0; if(svg){svg.classList.remove('sleep','deep');svg.classList.remove('bite');void svg.offsetWidth;svg.classList.add('bite');setTimeout(function(){svg.classList.remove('bite');},500);}
        $('zz').classList.remove('go','deep'); p.happy=cl(p.happy-4); handBusy(1500); toast('앗! 잠결에 물렸어요.');
        say(S.mode==='gecko'?'…앙! 깨우지 마세요.':'앙! 자는데 왜 만져요! 😠',1800);
      }else{
        hand.sleep=2; if(svg)svg.classList.add('deep'); $('zz').classList.add('deep'); p.happy=cl(p.happy+3); handBusy(1500);
        say(S.mode==='gecko'?'…더 깊이 잠들었어요.':'쿨쿨쿨… 더 깊이 잠들었어요 💤💤',1800);
      }
      save(); update(); return;
    }
    var ps=persona(); p.happy=cl(p.happy+Math.round(7*ps.handle)); patEl.classList.remove('go'); void patEl.offsetWidth; patEl.classList.add('go');
    hearts(); var sleepIn=Math.round(1300*ps.sleep); handBusy(sleepIn+1700);
    say(S.mode==='gecko'?'천천히… 좋아요. 눈이 감겨요…':(ps.lines.hand||'가리가리… 기분 좋아요…'),Math.max(1400,sleepIn));
    hand.timers.push(setTimeout(function(){var sv=petHolder.querySelector('.pet'); if(sv)sv.classList.add('sleep'); $('zz').classList.add('go'); hand.sleep=1; say(S.mode==='gecko'?'…쿨. 💤':'쿨쿨… 💤',2600);},sleepIn));
  }else if(id==='treat'&&cfg.treat){
    if(hand.sleep>0){hand.sleep=0; var sv2=petHolder.querySelector('.pet'); if(sv2)sv2.classList.remove('sleep','deep'); $('zz').classList.remove('go','deep'); say('음? 냄새에 깼어요!',900);}
    var t=cfg.treat, list=cfg.snacks, emo=list?list[Math.floor(Math.random()*list.length)][0]:t[0];
    var s=document.createElement('span');s.className='hand-treat';s.textContent=emo;petWrap.appendChild(s);hand.timers.push(setTimeout(function(){s.remove();},1000));
    hand.timers.push(setTimeout(function(){anim('nibble',800);},350));
    p.hunger=cl(p.hunger+t[2]); p.happy=cl(p.happy+t[3]); handBusy(1200);
    say(S.mode==='gecko'?'손에서 먹는 귀뚜라미는 최고예요!':'냠… 손에서 먹는 간식이 제일 맛있어요 🍓',1600);
  }else if(id==='down'){
    putDown(); return;
  }
  save(); update();
}
function putDown(){
  var wasSleep=hand.sleep>0; hand.sleep=0; $('zz').classList.remove('deep'); var sv0=petHolder.querySelector('.pet'); if(sv0)sv0.classList.remove('deep','bite');
  hand.timers.forEach(clearTimeout); hand.timers=[]; hand.busy=false; handActs.classList.remove('busy');
  handBox.hidden=true; petWrap.classList.remove('held'); handEl.classList.remove('on');
  patEl.classList.remove('go'); $('zz').classList.remove('go'); var sv=petHolder.querySelector('.pet'); if(sv)sv.classList.remove('sleep'); Array.prototype.forEach.call(petWrap.querySelectorAll('.hand-treat'),function(e){e.remove();});
  hand.held=false; setBusy(800); say(wasSleep?'음… 잘 잤어요. 😊':'다음에 또 올려 주세요!',1600);
}
function resetDecorAct(){
  petWrap.classList.remove('inside','flip','onwheel','climbing'); petHome();
  Array.prototype.forEach.call(document.querySelectorAll('.decor.spin,.decor.dripping'),function(e){e.classList.remove('spin','dripping');});
  var svg=petHolder.querySelector('.pet'); if(svg)svg.classList.remove('run');
}
function resetHand(){
  hand.sleep=0; $('zz').classList.remove('deep'); var sv1=petHolder.querySelector('.pet'); if(sv1)sv1.classList.remove('deep','bite');
  hand.timers.forEach(clearTimeout); hand.timers=[]; hand.busy=false; hand.held=false; handActs.classList.remove('busy');
  handBox.hidden=true; petWrap.classList.remove('held','rolling'); habitat.classList.remove('outside'); handEl.classList.remove('on'); patEl.classList.remove('go'); $('zz').classList.remove('go');
  Array.prototype.forEach.call(petWrap.querySelectorAll('.hand-treat'),function(e){e.remove();});
  broomEl.classList.remove('sweep');
}

/* ---------- feeding ---------- */
function openFeed(kind){
  kind=kind||'feed'; var list=foodsFor(kind); if(!list)return;
  if(feed.eating){toast('지금 맛있게 먹고 있어요. 조금만 기다려 주세요.');return;}
  feed.kind=kind; feed.items=[]; feedBox.hidden=false;
  var snack=kind==='snack',mar=S.mode==='marimo';
  $('feedTitle').textContent=mar?'🧪 영양제 준비':snack?'🍓 간식 준비':'🍽️ 먹이 준비';
  $('feedHint').textContent=mar?'영양제를 누르거나 스포이드로 끌어다 담아요':snack?'간식을 누르거나 접시로 끌어다 담아요':'사료를 누르거나 종지로 끌어다 담아요';
  serveBtn.textContent=mar?'스포이드로 주기':snack?'간식 주기':'밥 주기';
  bowlEl.classList.toggle('plate',snack); bowlEl.classList.toggle('pipette',mar);
  renderFoodCards(); renderBowl();
  if(feedBox.scrollIntoView)feedBox.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function cancelFeed(){ feed.items=[]; feedBox.hidden=true; renderBowl(); }
function addItem(i){
  if(feed.items.length>=MAX_ITEMS){toast((feed.kind==='snack'?'접시':'종지')+'가 가득 찼어요. (최대 '+MAX_ITEMS+'개)');return;}
  feed.items.push(i); renderBowl();
}
function serve(){
  if(feed.eating)return;
  if(!feed.items.length){toast(feed.kind==='snack'?'먼저 간식을 접시에 담아 주세요.':'먼저 사료를 종지에 담아 주세요.');return;}
  var kind=feed.kind,foods=foodsFor(kind),items=feed.items.slice(),snack=kind==='snack',mar=S.mode==='marimo';
  feed.items=[]; feedBox.hidden=true; feed.eating=true; actsEl.classList.add('busy'); renderBowl();
  if(mar){
    $('pipette').classList.add('on'); petWrap.classList.add('pipetting'); say('영양제 시간이에요!',900);
  }else{
    servedBowl.classList.toggle('plate',snack);
    renderServed(items,foods); servedBowl.hidden=false;
    requestAnimationFrame(function(){petWrap.classList.add('eating');});
    say(snack?'와, 간식이다! 🍓':'와, 밥이다!',900);
  }
  var idx=0;
  function step(){
    if(!feed.eating)return;
    if(idx>=items.length){feed.timers.push(setTimeout(function(){finishEating(snack);},1200));return;}
    var f=foods[items[idx]],p=P(); idx++;
    if(mar){
      p.nutri=cl(p.nutri+f[2]); var pip=$('pipette'); pip.classList.remove('squeeze'); void pip.offsetWidth; pip.classList.add('squeeze');
      var dr=document.createElement('span');dr.className='nutri-drop';dr.textContent=f[0]==='🌿'?'🟢':'💧';petWrap.appendChild(dr);feed.timers.push(setTimeout(function(){dr.remove();},800));
      feed.timers.push(setTimeout(function(){var rp=document.createElement('span');rp.className='ripple';petWrap.appendChild(rp);setTimeout(function(){rp.remove();},950);anim('wobble',1000);},650));
      say('몽글몽글… 흡수 중!',900); save(); update();
      feed.timers.push(setTimeout(step,1000)); return;
    }
    p.hunger=cl(p.hunger+f[2]); p.happy=cl(p.happy+(f[3]||2));
    renderServed(items.slice(idx),foods); anim('pulse',500); say('냠냠…',900); save(); update();
    feed.timers.push(setTimeout(step,850));
  }
  feed.timers.push(setTimeout(step,900));
}
function finishEating(snack){
  clearFeedTimers(); feed.eating=false; actsEl.classList.remove('busy');
  servedBowl.hidden=true; servedItems.textContent=''; petWrap.classList.remove('eating'); $('pipette').classList.remove('on','squeeze'); petWrap.classList.remove('pipetting');
  if(S.mode==='marimo'){say('영양 만점! 더 동글동글해질 거예요 💚'); save(); update(); return;}
  if(snack){say('간식 최고! 고마워요 🍓'); save(); update(); return;}
  say('잘 먹었어요! 고마워요 💕'); save(); update();
}
function clearFeedTimers(){ feed.timers.forEach(clearTimeout); feed.timers=[]; }
function resetFeed(){
  clearFeedTimers(); feed.items=[]; feed.eating=false; actsEl.classList.remove('busy');
  servedBowl.hidden=true; servedItems.textContent=''; petWrap.classList.remove('eating'); feedBox.hidden=true; $('pipette').classList.remove('on','squeeze'); petWrap.classList.remove('pipetting');
  Array.prototype.forEach.call(petWrap.querySelectorAll('.nutri-drop,.ripple'),function(e){e.remove();}); renderBowl();
}
function inRect(r,x,y){return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
function bindCard(btn,i){
  var sx=0,sy=0,drag=false,ghost=null,pid=null;
  btn.addEventListener('contextmenu',function(e){e.preventDefault();});
  btn.addEventListener('pointerdown',function(e){
    if(e.button&&e.button!==0)return;
    pid=e.pointerId; sx=e.clientX; sy=e.clientY; drag=false;
    try{btn.setPointerCapture(pid);}catch(err){}
  });
  btn.addEventListener('pointermove',function(e){
    if(pid===null||e.pointerId!==pid)return;
    if(!drag){
      if(Math.hypot(e.clientX-sx,e.clientY-sy)<8)return;
      drag=true; ghost=document.createElement('div'); ghost.className='ghost'; ghost.textContent=foodsFor(feed.kind)[i][0];
      document.body.appendChild(ghost); bowlEl.classList.add('target');
    }
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
    bowlEl.classList.toggle('over',inRect(bowlEl.getBoundingClientRect(),e.clientX,e.clientY));
  });
  function end(e){
    if(pid===null||e.pointerId!==pid)return;
    var wasDrag=drag,x=e.clientX,y=e.clientY,cancelled=e.type==='pointercancel';
    pid=null; drag=false;
    if(ghost){ghost.remove();ghost=null;}
    bowlEl.classList.remove('target','over');
    if(cancelled)return;
    if(!wasDrag){addItem(i);return;}
    if(inRect(bowlEl.getBoundingClientRect(),x,y))addItem(i); else toast('종지 안에 놓아 주세요.');
  }
  btn.addEventListener('pointerup',end);
  btn.addEventListener('pointercancel',end);
  btn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();addItem(i);}});
}
serveBtn.onclick=serve;
$('cancelFeedBtn').onclick=cancelFeed;

/* ---------- name ---------- */
$('nameBtn').onclick=function(){var f=$('nameForm');f.hidden=!f.hidden;if(!f.hidden){$('nameInput').value=P().name;$('nameInput').focus();}};
$('nameForm').onsubmit=function(e){e.preventDefault();var v=$('nameInput').value.trim().slice(0,8);if(v){P().name=v;save();update();say(v+'… 예쁜 이름이에요!');}$('nameForm').hidden=true;};

/* ---------- reset ---------- */
$('resetBtn').onclick=function(){if(confirm('모든 친구의 기록을 지우고 처음부터 시작할까요?')){resetFeed();resetHand();resetDecorAct();S=fresh();save();renderAll();}};

/* ---------- time ---------- */
setInterval(function(){ if(S.mode!=='marimo'&&P().insideUntil){update();} },1000);
setInterval(function(){
  if(S.mode!=='marimo'&&!isInside()&&!busy&&!feed.eating&&!hand.held){
    var pHide=(isNight()?0.004:0.06)*persona().auto;
    if(Math.random()<pHide){var hd=hideDecor();if(hd&&hd.el){enterHide(hd.def.act,hd.el);}}
    else if(S.mode==='gecko'&&isNight()&&Math.random()<0.05){var ci=PETS.gecko.decor.findIndex(function(d){return d.id==='climb';});var ce=document.querySelector('.decor[data-id=climb]');if(ce&&P().decor.indexOf(ci)>=0){say('밤이라 기운이 넘쳐요!',900);setTimeout(function(){decorAct('climb',ce);},900);}}
    else if(S.mode==='squirrel'&&isNight()&&Math.random()<0.05*persona().wheel){var wi=PETS.squirrel.decor.findIndex(function(d){return d.id==='wheel';});var we=document.querySelector('.decor[data-id=wheel]');if(we&&P().decor.indexOf(wi)>=0){say('밤이라 기운이 넘쳐요!',900);setTimeout(function(){runWheel(we);},900);}}
  }
  habitat.classList.toggle('night',S.mode!=='marimo'&&isNight()); $('skyBadge').textContent=S.mode!=='marimo'?(isNight()?'🌙':'☀️'):'';
  ['squirrel','gecko'].forEach(function(m){var p=S.pets[m];
    /* v18: 상태 감소 속도 약 55% 완화 (3초 틱) */
    p.hunger=cl(p.hunger-0.55); p.happy=cl(p.happy-0.3); p.clean=cl(p.clean-(0.2+p.poops.length*0.18));
    if(p.hunger>45&&p.poops.length<4&&Math.random()<0.045)p.poops.push(Math.round(8+Math.random()*78));});
  var mm=S.pets.marimo; mm.light=cl(mm.light-0.45); mm.water=cl(mm.water-0.35); mm.nutri=cl((mm.nutri==null?60:mm.nutri)-0.3); mm.fuzz=cl((mm.fuzz==null?20:mm.fuzz)+0.35);
  save(); update();
},3000);

renderAll();
})();
</script>
