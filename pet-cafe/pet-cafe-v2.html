<title>Pet Cafe v2</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#f7e9d7;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:#5a4636}
#app{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto;overflow:hidden;background:#f7e9d7}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.btn{border:0;border-radius:16px;padding:14px 18px;font-size:16px;font-weight:700;color:#fff;background:#e8946a;box-shadow:0 4px 0 #c9704a;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c9704a}
.btn.sec{background:#8fb8a8;box-shadow:0 4px 0 #6d9484}.btn.sec:active{box-shadow:0 1px 0 #6d9484}
.btn.ghost{background:#fff;color:#5a4636;box-shadow:0 4px 0 #d9c7b2}.btn.ghost:active{box-shadow:0 1px 0 #d9c7b2}
.btn:disabled{opacity:.45;box-shadow:none;transform:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;z-index:5}
.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.pill.timer{font-variant-numeric:tabular-nums}
.pill.timer.warn{background:#ffd9d9;color:#c0392b;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
/* lobby */
#lobby{background:linear-gradient(#fbf3e6,#f3dfc8);align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#lobby h1{font-size:40px;margin:0;letter-spacing:-1px}
#lobby p{margin:0 0 10px;opacity:.75}
#lobby .menu{display:grid;gap:10px;width:100%;max-width:300px}
/* ticket */
#ticket{padding:20px;gap:12px;overflow:auto}
.tk{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tk b{font-size:18px}.tk small{opacity:.6}

.floor{position:absolute;left:0;right:0;top:13%;bottom:31%}
.pet.hiding .body img{clip-path:inset(0 0 58% 0);opacity:.85}
.pet.hiding .body{animation:peek 2.4s ease-in-out infinite}
.pet.hiding .spot{display:flex}
.pet .spot{display:none;position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);font-size:64px;line-height:1;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.2))}
.pet.hiding .name{opacity:0}
@keyframes peek{0%,55%,100%{transform:translateY(34%)}70%,85%{transform:translateY(18%)}}
.pet{position:absolute;width:30%;aspect-ratio:1;touch-action:none;transform-origin:50% 100%;transition:left .9s cubic-bezier(.34,1.3,.5,1),bottom .9s cubic-bezier(.34,1.3,.5,1)}
.pet .body{position:relative;width:100%;height:100%;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.pet.sleepy .body{animation-duration:4.6s}
.pet img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom;transition:opacity .22s;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.18))}
.pet img.f{opacity:0}.pet img.f.on{opacity:1}
.pet .name{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-size:12px;font-weight:700;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:999px;white-space:nowrap}
.pet.sel .name{background:#e8946a;color:#fff}
.pet .bubble{position:absolute;left:60%;top:-8px;background:#fff;border-radius:14px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.12);opacity:0;transform:translateY(6px) scale(.8);transition:all .25s}
.pet .bubble.on{opacity:1;transform:none}
.pet .emoji{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;font-size:90px}
@keyframes breathe{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.025) scaleX(.985)}}
.pet.pet-on .body{animation:none;transform:var(--tilt,none)}
.pet.wiggle .body{animation:wiggle .5s ease-in-out}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scaleY(.96)}75%{transform:rotate(4deg) scaleY(.96)}}
.pet.chew .body{animation:chew .32s ease-in-out 7}
@keyframes chew{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(2px) scaleY(.965) scaleX(1.02)}}
.pet.hop .body{animation:hop .55s cubic-bezier(.3,1.4,.6,1)}
@keyframes hop{0%{transform:scaleY(1)}20%{transform:scaleY(.88) scaleX(1.06)}50%{transform:translateY(-16%) scaleY(1.06) scaleX(.96)}80%{transform:scaleY(.95) scaleX(1.03)}100%{transform:none}}
.pet.ignore .body{animation:ignore .7s ease-in-out}
@keyframes ignore{0%,100%{transform:rotate(0)}40%{transform:rotate(6deg) translateX(3%)}}
.pet.flash{filter:brightness(1.4)}
.heart{position:absolute;font-size:22px;pointer-events:none;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
.crumb{position:absolute;width:6px;height:6px;border-radius:50%;background:#c58d5a;pointer-events:none;animation:crumb .7s ease-out forwards}
@keyframes crumb{to{opacity:0;transform:translate(var(--dx),40px)}}
#flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
#flashfx.on{animation:flash .45s}
@keyframes flash{0%{opacity:0}15%{opacity:.95}100%{opacity:0}}
/* bottom panel */
.panel{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);border-radius:22px 22px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:6}
.panel .hint{font-size:13px;opacity:.7;margin:0 0 8px;min-height:18px}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fdf6ec;border:2px solid transparent;border-radius:14px;padding:8px 2px;font-size:11px;font-weight:700;cursor:pointer;touch-action:none}
.act.on{border-color:#e8946a;background:#fff1e6}
.act .ic{font-size:26px}
.act small{font-weight:400;opacity:.6}
.tray{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.item{flex:0 0 auto;width:58px;height:58px;border-radius:14px;background:#fdf6ec;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;touch-action:none;position:relative}
.item small{font-size:10px;position:absolute;bottom:2px;right:5px;font-weight:700}
.item.empty{opacity:.35}
.item.buy{width:64px;height:64px;cursor:pointer}
.item.buy em{font-style:normal;font-size:10px;position:absolute;top:2px;left:5px;opacity:.7}
.toyobj{position:absolute;font-size:34px;transform:translate(-50%,-50%) translateY(-60px) scale(.6);opacity:0;transition:transform .45s cubic-bezier(.3,1.5,.6,1),opacity .2s;pointer-events:none;z-index:120;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.toyobj.land{transform:translate(-50%,-50%);opacity:1}
.toyobj.playing{animation:toyplay .5s ease-in-out infinite}
.toyobj.gone{opacity:0;transform:translate(-50%,-50%) scale(.3)}
@keyframes toyplay{0%,100%{transform:translate(-50%,-50%) rotate(-15deg)}50%{transform:translate(-50%,-70%) rotate(15deg)}}
.drag{position:absolute;z-index:50;font-size:36px;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.aff{height:8px;background:#f0e3d2;border-radius:99px;overflow:hidden;margin:4px 0 8px}
.aff i{display:block;height:100%;background:linear-gradient(90deg,#f9a8c9,#e8946a);border-radius:99px;transition:width .4s}
.petinfo{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.petinfo b{font-size:16px}
.tag{font-size:11px;background:#8fb8a8;color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px}
.tag.f{background:#e8946a}.tag.a{background:#c98cd9}
/* modal */
.modal{position:absolute;inset:0;background:rgba(60,40,20,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.modal.on{display:flex}
.card{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:340px;text-align:center;animation:pop .25s cubic-bezier(.3,1.4,.6,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h3{margin:0 0 8px}.card p{margin:0 0 16px;font-size:14px;line-height:1.5;opacity:.8}
.card .row{display:flex;gap:8px}.card .row .btn{flex:1}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:rgba(60,40,20,.85);color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;z-index:70;opacity:0;transition:opacity .3s;white-space:nowrap}
.toast.on{opacity:1}
/* album / shop */
.list{padding:14px;overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{background:#fff;border-radius:14px;padding:6px;box-shadow:0 2px 6px rgba(0,0,0,.08);text-align:center;font-size:11px}
.photo .ph{height:90px;background:#f7e9d7;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.photo img{height:100%;object-fit:contain}
.shoprow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.shoprow .ic{font-size:30px}.shoprow .t{flex:1}.shoprow .t small{display:block;opacity:.6}
.dex{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px;margin-bottom:8px}
.dex img{width:56px;height:56px;object-fit:contain}
.dex .t{flex:1;font-size:13px}.dex .t b{font-size:15px}
.dex .t .aff{margin:4px 0}
.empty-floor{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);font-weight:700;padding:30px;pointer-events:none}
.dbg{position:absolute;right:8px;bottom:8px;font-size:10px;opacity:.5;z-index:80}
</style>
</head>
<body>
<div id="app">

<!-- LOBBY -->
<section id="lobby" class="screen active">
  <div style="font-size:64px">🐾</div>
  <h1>Pet Cafe</h1>
  <p>작은 동물 친구들과 쉬어가는 힐링 카페</p>
  <div class="pill">🪙 <span class="coins"></span> 코인</div>
  <div class="menu">
    <button class="btn" onclick="go('ticket')">☕ 카페 입장</button>
    <button class="btn sec" onclick="go('home')">🏠 우리 집 <span id="homeCount"></span></button>
    <button class="btn ghost" onclick="go('dex')">📖 친구 도감</button>
    <button class="btn ghost" onclick="go('album')">📷 앨범</button>
    <button class="btn ghost" onclick="go('shop')">🛍 상점</button>
  </div>
  <small style="opacity:.5">v2 · 매일 첫 접속 +200코인</small>
</section>

<!-- TICKET -->
<section id="ticket" class="screen">
  <div class="topbar"><button class="btn ghost" onclick="go('lobby')">←</button><div class="pill">🪙 <span class="coins"></span></div></div>
  <div style="padding:0 20px"><h2 style="margin:0 0 4px">입장권 구매</h2><p style="margin:0 0 14px;font-size:13px;opacity:.7">결제한 시간만큼 카페에 머물 수 있어요 (10분 = 100코인)</p></div>
  <div id="tickets" style="padding:0 20px;display:grid;gap:10px"></div>
  <div style="padding:16px 20px 0"><h3 style="margin:0 0 2px">🍪 간식 챙겨가기</h3><p style="margin:0 0 8px;font-size:12px;opacity:.7">탭하면 1개씩 구매 · 숫자는 보유 수량</p></div>
  <div class="tray" id="ticketSnacks" style="padding:0 20px 4px"></div>
  <p style="padding:12px 20px;font-size:12px;opacity:.6">※ 시간이 끝나면 자동으로 퇴장돼요. 남은 시간은 저장되지 않아요.</p>
</section>

<!-- CAFE -->
<section id="cafe" class="screen">
  <div class="scene"></div>
  <div class="topbar">
    <button class="btn ghost" onclick="leaveCafe(true)">퇴장</button>
    <div class="pill timer" id="timer">10:00</div>
    <div class="pill">🪙 <span class="coins"></span></div>
  </div>
  <div class="floor" id="cafeFloor"></div>
  <div id="flashfx"></div>
  <div class="panel" id="cafePanel"></div>
</section>

<!-- HOME -->
<section id="home" class="screen">
  <div class="scene"></div>
  <div class="topbar">
    <button class="btn ghost" onclick="go('lobby')">←</button>
    <div class="pill">🏠 우리 집</div>
    <div class="pill">🪙 <span class="coins"></span></div>
  </div>
  <div class="floor" id="homeFloor"></div>
  <div class="empty-floor" id="homeEmpty">아직 함께 사는 친구가 없어요.<br>카페에서 5번 이상 놀아주면<br>임시보호를 신청할 수 있어요!</div>
  <div class="panel" id="homePanel"></div>
</section>

<!-- DEX -->
<section id="dex" class="screen">
  <div class="topbar"><button class="btn ghost" onclick="go('lobby')">←</button><div class="pill">📖 친구 도감</div><span></span></div>
  <div class="list" id="dexList"></div>
</section>

<!-- ALBUM -->
<section id="album" class="screen">
  <div class="topbar"><button class="btn ghost" onclick="go('lobby')">←</button><div class="pill">📷 앨범</div><span></span></div>
  <div class="list"><div class="grid" id="albumGrid"></div><p id="albumEmpty" style="text-align:center;opacity:.6">아직 사진이 없어요</p></div>
</section>

<!-- SHOP -->
<section id="shop" class="screen">
  <div class="topbar"><button class="btn ghost" onclick="go('lobby')">←</button><div class="pill">🛍 상점</div><div class="pill">🪙 <span class="coins"></span></div></div>
  <div class="list" id="shopList"></div>
</section>

<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>
<div class="dbg" id="dbg">⚙</div>
</div>

const TICKETS = [10,20,30,60];
const PRICE_PER_10 = 100;
const TIME_SCALE = 0.1;          // 결제 10분 = 실제 플레이 1분
const PLAYS_FOR_FOSTER = 5;   // 카페에서 5번 이상 플레이 → 임시보호
const CARE_DAYS_FOR_ADOPT = 3; // 임시보호 중 3일 돌봄 → 입양
const AFF_FOR_ADOPT = 60;

/* ---------- state ---------- */
const KEY = "petcafe-save-v1";
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
  const s = {coins:1000, inv:{fish:3,bone:3,carrot:2,seed:3,worm:1,cookie:2}, toys:{wand:1,ball:1}, pets:{}, album:[], ticketEnd:0, lastDaily:"", debugSpeed:1, sessionPlayed:{}};
  PETS.forEach(p=> s.pets[p.id]={aff:0,plays:0,status:"cafe",careDays:0,lastCare:""});
  return s;
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function today(){ return new Date().toISOString().slice(0,10); }
function addCoins(n){ S.coins=Math.max(0,S.coins+n); save(); renderCoins(); if(n>0) toast(`🪙 +${n}`); }
function renderCoins(){ document.querySelectorAll(".coins").forEach(e=>e.textContent=S.coins); }
function toast(msg,ms=1400){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),ms); }
function modal(html){ document.getElementById("modalCard").innerHTML=html; document.getElementById("modal").classList.add("on"); }
function closeModal(){ document.getElementById("modal").classList.remove("on"); }

/* ---------- navigation ---------- */
function go(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  renderCoins();
  if(id==="lobby") renderLobby();
  if(id==="ticket") renderTickets();
  if(id==="home") renderHome();
  if(id==="dex") renderDex();
  if(id==="album") renderAlbum();
  if(id==="shop") renderShop();
}
function renderLobby(){
  const n = PETS.filter(p=>S.pets[p.id].status!=="cafe").length;
  document.getElementById("homeCount").textContent = n?`(${n})`:"";
}

/* ---------- ticket ---------- */
function renderTickets(){
  const box=document.getElementById("tickets"); box.innerHTML="";
  TICKETS.forEach(min=>{
    const price=min/10*PRICE_PER_10;
    const d=document.createElement("div"); d.className="tk";
    const play=Math.round(min*TIME_SCALE*60); const pm=Math.floor(play/60), ps=play%60;
    d.innerHTML=`<div><b>${min}분 이용권</b><br><small>플레이 ${pm}:${String(ps).padStart(2,"0")} 동안 자유롭게 교감</small></div><button class="btn" ${S.coins<price?"disabled":""}>🪙 ${price}</button>`;
    d.querySelector("button").onclick=()=>buyTicket(min,price);
    box.appendChild(d);
  });
  renderSnackShop(document.getElementById("ticketSnacks"), renderTickets);
}
function renderSnackShop(box, after){
  box.innerHTML="";
  Object.entries(SNACKS).forEach(([id,s])=>{
    const d=document.createElement("div"); d.className="item buy"+(S.coins<s.p?" empty":"");
    d.innerHTML=`${s.ic}<small>${S.inv[id]||0}</small><em>🪙${s.p}</em>`; d.title=s.n;
    d.onclick=()=>{ if(S.coins<s.p) return toast("코인이 부족해요"); S.coins-=s.p; S.inv[id]=(S.inv[id]||0)+1; save(); renderCoins(); toast(`${s.ic} ${s.n} +1`); after&&after(); };
    box.appendChild(d);
  });
}
function buyTicket(min,price){
  if(S.coins<price) return toast("코인이 부족해요");
  S.coins-=price;
  S.ticketEnd = Date.now() + Math.round(min*TIME_SCALE*60*1000);
  S.sessionPlayed = {};
  save(); enterCafe();
}

/* ---------- scene / pets ---------- */
// [left%, bottom%, scale] : 위쪽(멀리)은 작게, 아래쪽(가까이)은 크게
const SPOTS = [[3,72,.55],[28,80,.5],[56,74,.55],[80,68,.58],[8,40,.78],[44,44,.74],[76,36,.8],[4,4,1],[38,0,1],[70,6,1]];
const HOME_SPOTS = [[6,66,.6],[52,72,.58],[80,60,.62],[10,30,.82],[60,34,.8],[30,2,1],[66,4,1]];
const HIDE_SPOTS = ["📦","🧺","🪴","🛋","🌿"];
const HIDE_COUNT = 3;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let scene = {floor:null, panel:null, mode:"cafe", sel:null, els:{}, mode_act:"pet"};

function makePetEl(p, spot){
  const el=document.createElement("div"); el.className="pet"+(p.sleepy?" sleepy":"");
  el.style.left=spot[0]+"%"; el.style.bottom=spot[1]+"%"; el.style.width=(30*spot[2])+"%"; el.style.zIndex=100-Math.round(spot[1]);
  el.dataset.id=p.id;
  const a=ASSETS[p.id];
  el.innerHTML=`<div class="body">
    <img class="f on" data-f="idle" src="${a.idle}">
    <img class="f" data-f="happy" src="${a.happy}">
    <img class="f" data-f="eat" src="${a.eat}">
  </div><div class="spot"></div><div class="bubble"></div><div class="name">${p.name}</div>`;
  el.addEventListener("pointerdown", e=>onPetDown(e,p,el));
  return el;
}
function setFrame(el,f){ el.querySelectorAll("img.f").forEach(i=>i.classList.toggle("on",i.dataset.f===f)); }
function anim(el,cls,ms){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(()=>el.classList.remove(cls),ms); }
function bubble(el,txt,ms=1500){ const b=el.querySelector(".bubble"); b.textContent=txt; b.classList.add("on"); clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove("on"),ms); }
function hearts(el,n=1,x,y){
  for(let i=0;i<n;i++){
    const h=document.createElement("div"); h.className="heart"; h.textContent=["💗","💕","✨","💖"][Math.floor(Math.random()*4)];
    h.style.left=(x??50+Math.random()*30-15)+"%"; h.style.top=(y??20+Math.random()*30)+"%";
    el.appendChild(h); setTimeout(()=>h.remove(),1100);
  }
}
function crumbs(el){
  for(let i=0;i<6;i++){ const c=document.createElement("div"); c.className="crumb"; c.style.left=(45+Math.random()*10)+"%"; c.style.top="55%"; c.style.setProperty("--dx",(Math.random()*40-20)+"px"); el.appendChild(c); setTimeout(()=>c.remove(),700); }
}
function selectPet(p){
  scene.sel=p;
  Object.values(scene.els).forEach(e=>e.classList.toggle("sel",e.dataset.id===p.id));
  renderPanel();
}
function buildScene(mode){
  scene.mode=mode;
  scene.floor=document.getElementById(mode==="cafe"?"cafeFloor":"homeFloor");
  scene.panel=document.getElementById(mode==="cafe"?"cafePanel":"homePanel");
  scene.floor.innerHTML=""; scene.els={}; scene.sel=null;
  const list = PETS.filter(p=> mode==="cafe" ? S.pets[p.id].status==="cafe" : S.pets[p.id].status!=="cafe");
  const spots = shuffle(mode==="cafe"?SPOTS:HOME_SPOTS);
  list.forEach((p,i)=>{ const el=makePetEl(p,spots[i%spots.length]); scene.floor.appendChild(el); scene.els[p.id]=el; });
  // 몇몇은 숨어 있음 (탭해서 찾기)
  const hideN = mode==="cafe" ? Math.min(HIDE_COUNT, Math.max(0,list.length-1)) : Math.min(1, Math.max(0,list.length-1));
  shuffle(list).slice(0,hideN).forEach((p,i)=>{ const el=scene.els[p.id]; el.classList.add("hiding"); el.querySelector(".spot").textContent=HIDE_SPOTS[(i+Math.floor(Math.random()*5))%HIDE_SPOTS.length]; });
  if(mode==="home") document.getElementById("homeEmpty").style.display=list.length?"none":"flex";
  const visible=list.filter(p=>!scene.els[p.id].classList.contains("hiding"));
  if(visible.length) selectPet(visible[0]); else renderPanel();
  scene.floor.onpointerdown=onFloorTap;
  idleLoop();
}

/* ---------- idle behaviour (natural motion) ---------- */
let idleTimer;
function idleLoop(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    const ids=Object.keys(scene.els); if(!ids.length) return;
    const el=scene.els[ids[Math.floor(Math.random()*ids.length)]];
    if(!el.classList.contains("pet-on") && !el.classList.contains("hiding")){
      const r=Math.random();
      if(r<0.4) anim(el,"wiggle",500);
      else if(r<0.6){ setFrame(el,"happy"); setTimeout(()=>setFrame(el,"idle"),900); }
      else if(r<0.75){ const p=PETS.find(x=>x.id===el.dataset.id); bubble(el,["zZ","...","♪","?"][Math.floor(Math.random()*4)],1200); }
    }
    idleLoop();
  }, 2500+Math.random()*3000);
}

/* ---------- interaction: pet (stroke) ---------- */
let stroke=null;
/* 빈 곳을 탭하면 선택된 동물이 그 자리로 달려옴 */
function floorPos(e){ const r=scene.floor.getBoundingClientRect(); return {px:(e.clientX-r.left)/r.width, py:(e.clientY-r.top)/r.height, r}; }
function onFloorTap(e){
  if(e.target!==scene.floor || drag || stroke) return;
  const p=scene.sel; if(!p) return; const el=scene.els[p.id]; if(!el||el.classList.contains("hiding")) return;
  const {px,py}=floorPos(e);
  runTo(p,el,px,py,()=>{ setFrame(el,"happy"); bubble(el,["왔어!","나 불렀어?","♡"][Math.floor(Math.random()*3)]); setTimeout(()=>setFrame(el,"idle"),1000); });
}
/* px,py: 바닥 영역 내 0~1 좌표. 도착 후 done() 호출 */
function runTo(p,el,px,py,done){
  const r=scene.floor.getBoundingClientRect();
  const w=el.offsetWidth/(r.width||1), h=el.offsetHeight/(r.height||1);
  const left=Math.max(0,Math.min(1-w,px-w/2))*100;
  const bottom=Math.max(0,Math.min(1-h,(1-py)-h*0.15))*100;
  const st=S.pets[p.id]; const quick = st.aff>=30 || Math.random()>p.shy;
  const dur = quick?900:1600;
  el.style.transitionDuration=(dur/1000)+"s";
  el.style.left=left+"%"; el.style.bottom=bottom+"%"; el.style.zIndex=100-Math.round(bottom);
  anim(el,"hop",550); if(dur>900) setTimeout(()=>anim(el,"hop",550),650);
  if(!quick) bubble(el,"...천천히 갈게",900);
  setTimeout(()=>{ el.style.transitionDuration=""; done&&done(quick); }, dur);
}
function reveal(p,el){
  el.classList.remove("hiding"); anim(el,"hop",550); setFrame(el,"happy"); hearts(el,2);
  bubble(el,["찾았다!","여기 있었지~","들켰네","♡"][Math.floor(Math.random()*4)]);
  addCoins(15); setTimeout(()=>setFrame(el,"idle"),1200);
}
function onPetDown(e,p,el){
  selectPet(p);
  if(el.classList.contains("hiding")){ e.preventDefault(); reveal(p,el); return; }
  if(scene.mode_act==="pet"){
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    stroke={el,p,lastX:e.clientX,lastY:e.clientY,dist:0,gain:0};
    el.classList.add("pet-on"); setFrame(el,"happy");
    el.onpointermove=onStrokeMove; el.onpointerup=el.onpointercancel=onStrokeEnd;
  }
}
function onStrokeMove(e){
  if(!stroke) return;
  const dx=e.clientX-stroke.lastX, dy=e.clientY-stroke.lastY;
  stroke.lastX=e.clientX; stroke.lastY=e.clientY;
  stroke.dist+=Math.hypot(dx,dy);
  const r=stroke.el.getBoundingClientRect();
  const nx=(e.clientX-r.left)/r.width-0.5;   // -0.5..0.5
  const tilt=Math.max(-7,Math.min(7,nx*14));
  const squash=1-Math.min(0.06,stroke.dist/4000);
  stroke.el.style.setProperty("--tilt",`rotate(${tilt}deg) scaleY(${squash}) scaleX(${2-squash})`);
  if(stroke.dist>120){ stroke.dist=0; stroke.gain++; hearts(stroke.el,1,(nx+0.5)*100,(e.clientY-r.top)/r.height*100); if(navigator.vibrate) navigator.vibrate(8); }
}
function onStrokeEnd(e){
  if(!stroke) return;
  const {el,p,gain}=stroke; stroke=null;
  el.classList.remove("pet-on"); el.style.removeProperty("--tilt");
  el.onpointermove=el.onpointerup=el.onpointercancel=null;
  setTimeout(()=>setFrame(el,"idle"),700);
  if(gain>0){ const liked = Math.random()>S.pets[p.id].aff/300 ? true : true; gainAff(p, Math.min(gain,6), "쓰다듬기"); bubble(el,["골골...","좋아~","더 해줘!","♡"][Math.floor(Math.random()*4)]); }
}

/* ---------- interaction: snack drag ---------- */
let drag=null;
function onItemDown(e,kind,id){
  if(kind==="snack" && !(S.inv[id]>0)) return toast("간식이 없어요. 상점에서 구매!");
  if(kind==="toy" && !(S.toys[id]>0)) return;
  e.preventDefault();
  const d=document.createElement("div"); d.className="drag"; d.textContent=(kind==="snack"?SNACKS:TOYS)[id].ic;
  document.getElementById("app").appendChild(d);
  drag={kind,id,el:d,sx:e.clientX,sy:e.clientY}; moveDrag(e);
  window.addEventListener("pointermove",moveDrag); window.addEventListener("pointerup",endDrag,{once:true});
}
function moveDrag(e){ if(!drag) return; const r=document.getElementById("app").getBoundingClientRect(); drag.el.style.left=(e.clientX-r.left)+"px"; drag.el.style.top=(e.clientY-r.top)+"px";
  Object.values(scene.els).forEach(el=>{ const b=el.getBoundingClientRect(); const over=e.clientX>b.left&&e.clientX<b.right&&e.clientY>b.top&&e.clientY<b.bottom; el.style.transform=over?"scale(1.06)":""; }); }
function endDrag(e){
  window.removeEventListener("pointermove",moveDrag);
  if(!drag) return; const {kind,id,el,sx,sy}=drag; drag=null; el.remove();
  let target=null;
  Object.values(scene.els).forEach(pe=>{ pe.style.transform=""; const b=pe.getBoundingClientRect(); if(e.clientX>b.left&&e.clientX<b.right&&e.clientY>b.top&&e.clientY<b.bottom) target=pe; });
  if(!target){
    if(kind!=="toy") return;
    const fr=scene.floor.getBoundingClientRect();
    const moved=Math.hypot(e.clientX-sx,e.clientY-sy)>12;
    const inFloor=e.clientX>fr.left&&e.clientX<fr.right&&e.clientY>fr.top&&e.clientY<fr.bottom;
    if(moved && inFloor){ const {px,py}=floorPos(e); throwToy(id,px,py); }
    else if(!moved){ throwToy(id,0.15+Math.random()*0.7,0.25+Math.random()*0.6); } // 탭만 하면 또져줌
    return;
  }
  const p=PETS.find(x=>x.id===target.dataset.id); selectPet(p);
  if(target.classList.contains("hiding")) reveal(p,target);
  if(kind==="snack") feed(p,target,id); else play(p,target,id);
}
function feed(p,el,snack){
  S.inv[snack]--; save();
  const fav = snack===p.snack || snack==="cookie";
  setFrame(el,"eat"); anim(el,"chew",2300); crumbs(el);
  setTimeout(()=>crumbs(el),900);
  setTimeout(()=>{ setFrame(el,"happy"); hearts(el,fav?3:1); bubble(el,fav?"냠냠! 최고야":"음... 먹을게"); gainAff(p,fav?8:3,"간식"); },2300);
  setTimeout(()=>setFrame(el,"idle"),3600);
  renderPanel();
}
/* ---------- interaction: toy (바닥에 던지면 선택된 친구가 달려가 놀아요) ---------- */
function throwToy(toy,px,py){
  const p=scene.sel; if(!p) return toast("먼저 친구를 선택하세요");
  const el=scene.els[p.id]; if(!el) return;
  if(el.classList.contains("hiding")) reveal(p,el);
  const t=document.createElement("div"); t.className="toyobj"; t.textContent=TOYS[toy].ic;
  t.style.left=(px*100)+"%"; t.style.top=(py*100)+"%"; scene.floor.appendChild(t);
  setTimeout(()=>t.classList.add("land"),50);
  const fav = toy===p.toy;
  bubble(el, fav?"오!! 저거!":"응?", 800);
  runTo(p,el,px,py+0.02,()=>{
    t.classList.add("playing");
    anim(el,"hop",550); setTimeout(()=>anim(el,"hop",550),600); setTimeout(()=>anim(el,"wiggle",500),1200);
    setFrame(el,"happy"); hearts(el,fav?3:1);
    setTimeout(()=>{ bubble(el,fav?"신난다!!":"오, 재밌네"); gainAff(p,fav?7:3,"놀아주기"); },1300);
    setTimeout(()=>{ setFrame(el,"idle"); t.classList.add("gone"); setTimeout(()=>t.remove(),400); },2600);
  });
}
function play(p,el,toy){
  const fav = toy===p.toy;
  const floorW=scene.floor.clientWidth, petW=el.clientWidth;
  const x = Math.random()*(floorW-petW)/floorW*100;
  el.style.left=x+"%";
  anim(el,"hop",550);
  setTimeout(()=>{ anim(el,"hop",550); setFrame(el,"happy"); },600);
  setTimeout(()=>{ hearts(el,fav?3:1); bubble(el,fav?"신난다!!":"오, 재밌네"); gainAff(p,fav?7:3,"놀아주기"); setFrame(el,"idle"); },1300);
}
/* ---------- interaction: photo ---------- */
function photo(p,el){
  const fx=document.getElementById("flashfx"); fx.classList.remove("on"); void fx.offsetWidth; fx.classList.add("on");
  const f=el.querySelector("img.f.on").dataset.f;
  S.album.unshift({id:p.id,f,t:Date.now(),aff:S.pets[p.id].aff}); if(S.album.length>60) S.album.pop();
  addCoins(10); gainAff(p,1,"사진"); bubble(el,"📸 찰칵!"); save();
}
/* ---------- interaction: call ---------- */
function call(p,el){
  const st=S.pets[p.id];
  const come = Math.random() > p.shy*(1-st.aff/100);
  if(come){
    const floorW=scene.floor.clientWidth, petW=el.clientWidth;
    el.style.left=((floorW-petW)/2/floorW*100)+"%"; el.style.bottom="6%";
    anim(el,"hop",550); setTimeout(()=>{setFrame(el,"happy"); bubble(el,p.species==="앵무새"?"안녕! 안녕!":"응? 불렀어?"); hearts(el,2); gainAff(p,3,"부르기"); setTimeout(()=>setFrame(el,"idle"),1200);},700);
  } else {
    anim(el,"ignore",700); bubble(el,["...","흥","zZ","(못 들은 척)"][Math.floor(Math.random()*4)]);
    toast(`${p.name}가 아직 낯을 가려요. 더 친해져 봐요!`);
  }
}

/* ---------- affinity / progression ---------- */
function gainAff(p,n,why){
  const st=S.pets[p.id];
  const before=st.aff;
  st.aff=Math.min(100,st.aff+n);
  if(!S.sessionPlayed[p.id]){ S.sessionPlayed[p.id]=true; if(st.status==="cafe") st.plays++; }
  if(scene.mode==="home" && st.lastCare!==today()){ st.lastCare=today(); st.careDays++; toast(`🏠 ${p.name} 돌봄 ${st.careDays}일째`); }
  const coin = Math.max(1,Math.round(n*1.5)); S.coins+=coin;
  save(); renderCoins(); renderPanel();
  if(before<50 && st.aff>=50) setTimeout(()=>modal(`<h3>💗 ${p.name}와 많이 친해졌어요!</h3><p>이제 부르면 잘 다가와요.</p><button class="btn" onclick="closeModal()">좋아</button>`),800);
  if(st.status==="cafe" && st.plays>=PLAYS_FOR_FOSTER && !st.fosterNotified){ st.fosterNotified=true; save(); setTimeout(()=>modal(`<h3>🏡 임시보호 가능!</h3><p>${p.name}와 ${st.plays}번 놀아줬어요.<br>이제 임시보호를 신청해서 집으로 데려갈 수 있어요.</p><div class="row"><button class="btn ghost" onclick="closeModal()">나중에</button><button class="btn" onclick="closeModal();foster('${p.id}')">신청하기</button></div>`),900); }
}
function foster(id){
  const p=PETS.find(x=>x.id===id), st=S.pets[id];
  if(st.plays<PLAYS_FOR_FOSTER) return toast(`${PLAYS_FOR_FOSTER}번 이상 플레이해야 해요 (${st.plays}/${PLAYS_FOR_FOSTER})`);
  st.status="foster"; st.careDays=0; st.lastCare=""; save();
  modal(`<div style="font-size:50px">🏡</div><h3>${p.name}를 임시보호해요</h3><p>${CARE_DAYS_FOR_ADOPT}일 동안 집에서 돌봐주고 호감도 ${AFF_FOR_ADOPT} 이상이 되면 정식 입양할 수 있어요.</p><button class="btn" onclick="closeModal();go('home')">집으로 가기</button>`);
  if(scene.mode==="cafe") buildScene("cafe");
}
function adopt(id){
  const p=PETS.find(x=>x.id===id), st=S.pets[id];
  if(st.careDays<CARE_DAYS_FOR_ADOPT || st.aff<AFF_FOR_ADOPT) return toast("아직 조건이 안 됐어요");
  st.status="adopted"; save();
  modal(`<div style="font-size:50px">🎉</div><h3>${p.name}를 입양했어요!</h3><p>이제 ${p.name}는 평생 가족이에요.<br>보너스 🪙 300</p><button class="btn" onclick="closeModal()">고마워</button>`);
  addCoins(300); renderHome();
}
function returnPet(id){
  const p=PETS.find(x=>x.id===id); S.pets[id].status="cafe"; S.pets[id].careDays=0; save(); toast(`${p.name}가 카페로 돌아갔어요`); renderHome();
}

/* ---------- panel ---------- */
function renderPanel(){
  const panel=scene.panel; if(!panel) return;
  const p=scene.sel;
  if(!p){ panel.innerHTML=`<p class="hint">친구를 터치해서 선택하세요</p>`; return; }
  const st=S.pets[p.id];
  const tag = st.status==="foster"?`<span class="tag f">임시보호</span>`:st.status==="adopted"?`<span class="tag a">가족</span>`:`<span class="tag">카페</span>`;
  let prog="";
  if(st.status==="cafe") prog=`플레이 ${st.plays}/${PLAYS_FOR_FOSTER} ${st.plays>=PLAYS_FOR_FOSTER?`<button class="btn sec" style="padding:4px 10px;font-size:12px;margin-left:6px" onclick="foster('${p.id}')">임시보호 신청</button>`:""}`;
  else if(st.status==="foster") prog=`돌봄 ${st.careDays}/${CARE_DAYS_FOR_ADOPT}일 · 호감도 ${st.aff}/${AFF_FOR_ADOPT} ${st.careDays>=CARE_DAYS_FOR_ADOPT&&st.aff>=AFF_FOR_ADOPT?`<button class="btn" style="padding:4px 10px;font-size:12px;margin-left:6px" onclick="adopt('${p.id}')">입양하기</button>`:""} <button class="btn ghost" style="padding:4px 8px;font-size:11px;margin-left:4px" onclick="returnPet('${p.id}')">돌려보내기</button>`;
  else prog=`💜 평생 가족`;
  const hints={pet:"친구 위를 손가락으로 쓸어주세요 · 빈 곳을 탭하면 달려와요",snack:"아래 간식을 친구에게 끌어다 놓으세요",toy:"장난감을 바닥에 던지거나(탭/드래그) 친구에게 끌어다 놓으세요",photo:"버튼을 눌러 사진을 찍어요",call:"버튼을 눌러 이름을 불러요"};
  panel.innerHTML=`
   <div class="petinfo"><div><b>${p.emoji} ${p.name}</b> <small>${p.species} · ${p.personality}</small>${tag}</div><div style="font-size:12px">${prog}</div></div>
   <div class="aff"><i style="width:${st.aff}%"></i></div>
   <p class="hint">${hints[scene.mode_act]}</p>
   <div class="acts">
     ${[["pet","🤚","쓰다듬기"],["snack","🍪","간식"],["toy","🎾","놀아주기"],["photo","📷","사진"],["call","📣","부르기"]].map(([k,ic,n])=>`<div class="act ${scene.mode_act===k?"on":""}" data-k="${k}"><span class="ic">${ic}</span>${n}</div>`).join("")}
   </div>
   <div class="tray" id="tray"></div>`;
  panel.querySelectorAll(".act").forEach(a=>a.onclick=()=>{
    const k=a.dataset.k; const el=scene.els[p.id];
    if(k==="photo") return photo(p,el);
    if(k==="call") return call(p,el);
    scene.mode_act=k; renderPanel();
  });
  fitFloor();
  const tray=panel.querySelector("#tray");
  if(scene.mode_act==="snack"){
    Object.entries(SNACKS).forEach(([id,s])=>{ const n=S.inv[id]||0; const d=document.createElement("div"); d.className="item"+(n?"":" empty"); d.innerHTML=`${s.ic}<small>${n}</small>`; d.title=s.n; d.addEventListener("pointerdown",e=>onItemDown(e,"snack",id)); tray.appendChild(d); });
  } else if(scene.mode_act==="toy"){
    Object.entries(TOYS).forEach(([id,t])=>{ const n=S.toys[id]||0; if(!n) return; const d=document.createElement("div"); d.className="item"; d.innerHTML=`${t.ic}`; d.title=t.n; d.addEventListener("pointerdown",e=>onItemDown(e,"toy",id)); tray.appendChild(d); });
    if(!tray.children.length) tray.innerHTML=`<small style="opacity:.6">장난감이 없어요. 상점에서 구매!</small>`;
  } else tray.style.display="none";
}

/* 펫 활동 영역을 하단 버튼 패널 위로 제한 (패널 높이에 맞춰 동적 계산) */
function fitFloor(){
  if(!scene.floor||!scene.panel) return;
  requestAnimationFrame(()=>{ scene.floor.style.bottom=(scene.panel.offsetHeight+24)+"px"; });
}
window.addEventListener("resize",fitFloor);

/* ---------- cafe session / timer ---------- */
let timerI;
function enterCafe(){
  go("cafe"); buildScene("cafe"); scene.mode_act="pet"; renderPanel();
  clearInterval(timerI); timerI=setInterval(tick,250); tick();
}
function tick(){
  const left=S.ticketEnd-Date.now();
  const t=document.getElementById("timer");
  if(left<=0){ leaveCafe(false); return; }
  const s=Math.ceil(left/1000); t.textContent=`⏱ ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  t.classList.toggle("warn",s<=60);
}
function leaveCafe(manual){
  clearInterval(timerI); clearTimeout(idleTimer);
  const played=Object.keys(S.sessionPlayed).length;
  const bonus=played*20;
  S.ticketEnd=0; S.sessionPlayed={}; if(bonus) S.coins+=bonus; save();
  go("lobby");
  modal(`<div style="font-size:46px">${manual?"👋":"⏰"}</div><h3>${manual?"또 놀러오세요!":"이용 시간이 끝났어요"}</h3><p>오늘 ${played}마리 친구와 교감했어요.<br>세션 보너스 🪙 ${bonus}</p><button class="btn" onclick="closeModal()">확인</button>`);
}
window.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.ticketEnd && document.getElementById("cafe").classList.contains("active")) tick(); });

/* ---------- home ---------- */
function renderHome(){ buildScene("home"); scene.mode_act="pet"; renderPanel(); }

/* ---------- dex / album / shop ---------- */

function renderShop(){

  l.insertAdjacentHTML("beforeend","<h3 style='margin:14px 0 8px'>장난감</h3>");

    d.innerHTML=`<span class="ic">${t.ic}</span><div class="t">${t.n}<small>${own?"보유 중":"영구 보유"}</small></div><button class="btn" ${own||S.coins<t.p?"disabled":""}>${own?"✓":"🪙 "+t.p}</button>`;
    d.querySelector("button").onclick=()=>{ S.coins-=t.p; S.toys[id]=1; save(); renderShop(); renderCoins(); }; l.appendChild(d); });
}

/* ---------- daily bonus / resume / debug ---------- */
function boot(){
  if(S.lastDaily!==today()){ S.lastDaily=today(); S.coins+=200; save(); setTimeout(()=>toast("🎁 출석 보너스 +200 코인",2000),500); }
  renderCoins(); renderLobby();
  if(S.ticketEnd>Date.now()){ enterCafe(); toast("이용권 시간이 남아 있어 카페로 돌아왔어요"); }
